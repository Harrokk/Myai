name: VENTUNO ALSA 0 1 permissions and driver state read-only

on:
  push:
    branches:
      - dev/routing-boundary-followup
    paths:
      - .github/workflows/ventuno-capture-permissions-readonly.yml
      - scripts/ventuno_capture_permissions_probe.py
      - tests/test_ventuno_capture_permissions_probe.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ventuno-capture-permissions-no-recording
  cancel-in-progress: true

jobs:
  probe:
    name: Read metadata only, do not open microphone
    runs-on: [self-hosted, Linux, ARM64, ventuno-q]
    timeout-minutes: 3
    steps:
      - name: Fetch exact source commit on VENTUNO
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          test "$(id -un)" = "arduino"
          mkdir -p "$RUNNER_TEMP/myai-mic-permissions"
          cd "$RUNNER_TEMP/myai-mic-permissions"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --force --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Run device-node access safety tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/myai-mic-permissions"
          /home/arduino/MyAI/.venv/bin/python -m pytest -q \
            tests/test_ventuno_capture_permissions_probe.py

      - name: Read capture character-device permissions and ALSA substream state
        shell: bash
        run: |
          set -euo pipefail
          systemctl is-active --quiet myai-geniex.service
          systemctl is-active --quiet myai-ventuno.service
          cd "$RUNNER_TEMP/myai-mic-permissions"
          /home/arduino/MyAI/.venv/bin/python -m scripts.ventuno_capture_permissions_probe
          echo 'No ALSA device opened and no audio captured.'

      - name: Confirm live services preserved
        if: always()
        shell: bash
        run: |
          systemctl is-active --quiet myai-geniex.service
          systemctl is-active --quiet myai-ventuno.service
