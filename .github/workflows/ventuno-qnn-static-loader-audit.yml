name: VENTUNO QNN ELF loader dependencies (strict read-only)
on:
  push:
    branches: [dev/ventuno-qnn-static-loader-audit-20261014]
    paths:
      - .github/workflows/ventuno-qnn-static-loader-audit.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: myai-qnn-static-elf-readonly
  cancel-in-progress: false
jobs:
  inspect-only:
    runs-on: [self-hosted, Linux, ARM64, ventuno-q]
    timeout-minutes: 4
    steps:
      - name: Get exact SHA into isolated temporary working tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(id -un)" = "arduino"
          mkdir -p "$RUNNER_TEMP/myai-qnn-static-loader"
          cd "$RUNNER_TEMP/myai-qnn-static-loader"
          git init -q
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Inspect ELF dynamic metadata; never run QNN
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/myai-qnn-static-loader"
          timeout --signal=TERM --kill-after=3s 60s /home/arduino/MyAI/.venv/bin/python -B -m scripts.ventuno_qnn_static_loader_probe
          echo 'readelf only; no NPU inference, audio, production or service modification.'
