name: Hosted bounded Unix inspection transport tests
on:
  push:
    branches: [dev/offline-unix-bounded-transport-20261014]
    paths:
      - core/selfdev_offline_preview_transport.py
      - core/selfdev_offline_preview_pipeline.py
      - core/selfdev_peer_identity.py
      - core/selfdev_signed_manifest.py
      - tests/test_selfdev_offline_preview_transport.py
      - .github/workflows/hosted-offline-transport-security.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch exact commit to temporary runner
        shell: bash
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE" init -q
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/Harrokk/Myai.git"
          git -C "$GITHUB_WORKSPACE" fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install isolated cryptography and pytest versions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/myai-transport-test"
          "$RUNNER_TEMP/myai-transport-test/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: "cryptography==45.0.7" "pytest==8.3.5"
      - name: Verify fragmentation, EOF, timeouts and real signed preview
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/myai-transport-test/bin/python" -B -m pytest -q -rs tests/test_selfdev_offline_preview_transport.py tests/test_selfdev_offline_preview_pipeline.py tests/test_selfdev_signed_manifest.py tests/test_selfdev_peer_identity.py
