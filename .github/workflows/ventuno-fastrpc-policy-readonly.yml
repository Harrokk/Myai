name: VENTUNO one bounded FastRPC vendor-policy metadata probe
on:
  push:
    branches: [dev/ventuno-fastrpc-policy-audit-20261014]
    paths:
      - .github/workflows/ventuno-fastrpc-policy-readonly.yml
permissions:
  contents: read
concurrency:
  group: myai-fastrpc-policy-one-pass-20261014
  cancel-in-progress: false
jobs:
  metadata-only:
    runs-on: [self-hosted, Linux, ARM64, ventuno-q]
    timeout-minutes: 4
    steps:
      - name: One-pass metadata inspection in isolated checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          test "$(id -un)" = "arduino"
          test "$GITHUB_REF" = "refs/heads/dev/ventuno-fastrpc-policy-audit-20261014"
          scratch="$(mktemp -d "$RUNNER_TEMP/myai-fastrpc-policy.XXXXXX")"
          chmod 700 "$scratch"
          cd "$scratch"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          trap 'git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git" >/dev/null 2>&1 || true' EXIT
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          timeout --signal=TERM --kill-after=3s 35s /home/arduino/MyAI/.venv/bin/python -B -m scripts.ventuno_fastrpc_policy_readonly
          echo 'Read-only metadata completed; no device opens, QNN, audio or configuration changes.'
