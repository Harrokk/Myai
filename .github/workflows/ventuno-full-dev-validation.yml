name: VENTUNO full development validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ventuno-full-dev-validation.yml

permissions:
  contents: read

concurrency:
  group: ventuno-full-dev-validation
  cancel-in-progress: false

jobs:
  validate:
    name: Test complete MyAI development branch on VENTUNO Q
    if: github.repository == 'Harrokk/Myai' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, ventuno-q]
    timeout-minutes: 20
    steps:
      - name: Fetch development branch into isolated temporary directory
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNNER_TEMP:-}"
          source_dir="$(mktemp -d "$RUNNER_TEMP/myai-dev-XXXXXXXX")"
          echo "MYAI_TEST_DIR=$source_dir" >> "$GITHUB_ENV"
          git init -q "$source_dir"
          git -C "$source_dir" remote add origin https://github.com/Harrokk/Myai.git
          git -C "$source_dir" fetch --depth=1 origin refs/heads/dev/routing-boundary-followup
          git -C "$source_dir" checkout --detach -q FETCH_HEAD
          echo "Tested commit: $(git -C "$source_dir" rev-parse HEAD)"
      - name: Verify test environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          test "$(id -un)" = "arduino"
          test -x /home/arduino/MyAI/.venv/bin/python
          /home/arduino/MyAI/.venv/bin/python -m pytest --version
      - name: Run full Python test suite without touching live services
        shell: bash
        env:
          PYTHONPATH: ${{ env.MYAI_TEST_DIR }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          cd "$MYAI_TEST_DIR"
          /home/arduino/MyAI/.venv/bin/python -m pytest -q -p no:cacheprovider tests/
      - name: Verify generated systemd units without installation
        shell: bash
        run: |
          set -euo pipefail
          cd "$MYAI_TEST_DIR"
          /home/arduino/MyAI/.venv/bin/python scripts/generate_ventuno_systemd.py
          systemd-analyze verify runtime/systemd/*.service runtime/systemd/*.target
