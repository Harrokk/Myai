name: MyAI STT interrupted cleanup and stale reply safety - synthetic only
on:
  push:
    branches: [dev/ventuno-stt-cleanup-poison-reply-boundary-20261015]
    paths:
      - .github/workflows/ventuno-stt-cleanup-reply-audit.yml
      - core/voice_stt_worker.py
      - core/voice_stt_child_limits.py
      - core/voice_stt_reply.py
      - core/voice_stt_bounded_io.py
      - core/voice_stt_process_group.py
      - core/voice_stt_process.py
      - core/voice_stt_persistent.py
      - core/voice_session.py
      - core/voice_stt_persistent_worker.py
      - tests/test_voice_session.py
      - core/voice_factory.py
      - core/config.py
      - core/config_validation.py
      - tests/test_voice_stt_rlimit_denial.py
      - tests/test_voice_stt_child_limits.py
      - tests/test_voice_stt_reply.py
      - tests/test_voice_stt_process.py
      - tests/test_voice_stt_process_group.py
      - tests/test_voice_stt_persistent.py
      - tests/test_voice_factory.py
      - tests/test_config_validation.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: myai-stt-reap-reply-review-20261015
  cancel-in-progress: false
jobs:
  x86-real-synthetic-process:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Fetch exact SHA into private disposable source tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          scratch="$(mktemp -d "$RUNNER_TEMP/myai-persistent-stt-host.XXXXXX")"
          chmod 700 "$scratch"
          echo "MYAI_PERSISTENT_STT_HOST=$scratch" >> "$GITHUB_ENV"
          cd "$scratch"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify interrupted STT reap is poisoned and unsolicited replies are rejected
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/myai-persistent-stt-venv"
          "$RUNNER_TEMP/myai-persistent-stt-venv/bin/python" -m pip install \
            --disable-pip-version-check --only-binary=:all: \
            pytest==8.3.5 psutil==7.1.0 requests==2.32.5
          cd "$MYAI_PERSISTENT_STT_HOST"
          "$RUNNER_TEMP/myai-persistent-stt-venv/bin/python" -B -m pytest -q \
            tests/test_voice_stt_rlimit_denial.py \
            tests/test_voice_stt_child_limits.py \
            tests/test_voice_stt_reply.py \
            tests/test_voice_stt_process_group.py \
            tests/test_voice_stt_persistent.py \
            tests/test_voice_session.py \
            tests/test_voice_stt_process.py \
            tests/test_voice_factory.py \
            tests/test_config_validation.py
      - name: Erase hosted temporary worktree/venv
        if: always()
        shell: bash
        run: |
          if [ -n "${MYAI_PERSISTENT_STT_HOST:-}" ]; then rm -rf -- "$MYAI_PERSISTENT_STT_HOST"; fi
          rm -rf -- "$RUNNER_TEMP/myai-persistent-stt-venv"

  ventuno-source-only:
    runs-on: [self-hosted, Linux, ARM64, ventuno-q]
    needs: x86-real-synthetic-process
    timeout-minutes: 4
    steps:
      - name: Fetch exact commit to disposable VENTUNO checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          test "$(id -un)" = "arduino"
          scratch="$(mktemp -d "$RUNNER_TEMP/myai-persistent-stt-board.XXXXXX")"
          chmod 700 "$scratch"
          echo "MYAI_PERSISTENT_STT_BOARD=$scratch" >> "$GITHUB_ENV"
          cd "$scratch"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Confirm default OFF and no real STT/hardware calls
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: |
          set -euo pipefail
          cd "$MYAI_PERSISTENT_STT_BOARD"
          /home/arduino/MyAI/.venv/bin/python -B - <<'PY'
          from core.config import DEFAULT_SETTINGS
          from core.voice_factory import build_voice_components
          cfg = DEFAULT_SETTINGS["voice"]
          assert cfg["enabled"] is False
          assert cfg["stt_process_isolation_enabled"] is False
          assert cfg["stt_persistent_worker_enabled"] is False
          assert cfg["stt_persistent_worker_max_utterances"] == 4
          assert cfg["stt_child_cpu_seconds"] == 0
          assert cfg["stt_child_virtual_memory_mib"] == 0
          result = build_voice_components(settings={"voice": {"enabled": False}})
          assert result["primary_stt"] is None
          assert result["backup_stt"] == []
          print("Persistent STT DEFAULT OFF; no model load, DSP/GenieX or audio capture.")
          PY
      - name: Delete disposable board checkout
        if: always()
        shell: bash
        run: |
          if [ -n "${MYAI_PERSISTENT_STT_BOARD:-}" ]; then rm -rf -- "$MYAI_PERSISTENT_STT_BOARD"; fi
