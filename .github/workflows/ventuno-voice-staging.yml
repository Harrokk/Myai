name: VENTUNO isolated voice wheels staging

on:
  workflow_dispatch:
  push:
    branches:
      - dev/routing-boundary-followup
    paths:
      - .github/workflows/ventuno-voice-staging.yml
      - scripts/ventuno_voice_wheel_staging.py
      - tests/test_ventuno_voice_wheel_staging.py
      - scripts/ventuno_portaudio_temp_stage.py
      - tests/test_ventuno_portaudio_temp_stage.py
      - scripts/ventuno_stt_wheel_preflight.py
      - tests/test_ventuno_stt_wheel_preflight.py
      - scripts/ventuno_stt_import_staging.py
      - tests/test_ventuno_stt_import_staging.py

permissions:
  contents: read

concurrency:
  group: ventuno-voice-staging
  cancel-in-progress: false

jobs:
  stage:
    name: Stage optional small ARM64 voice wheels without touching GenieX
    runs-on: [self-hosted, Linux, ARM64, ventuno-q]
    timeout-minutes: 9
    steps:
      - name: Fetch exact commit in disposable runner directory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          test "$(id -un)" = "arduino"
          mkdir -p "$RUNNER_TEMP/myai-voice-checkout"
          cd "$RUNNER_TEMP/myai-voice-checkout"
          git init -q
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Test resource and isolation safety, without pip install
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/myai-voice-checkout"
          /home/arduino/MyAI/.venv/bin/python -m pytest -q \
            tests/test_ventuno_voice_wheel_staging.py \
            tests/test_ventuno_portaudio_temp_stage.py \
            tests/test_ventuno_stt_wheel_preflight.py \
            tests/test_ventuno_stt_import_staging.py
          /home/arduino/MyAI/.venv/bin/python \
            scripts/ventuno_voice_wheel_staging.py --runner-temp "$RUNNER_TEMP"

      - name: Confirm production services running before staging
        shell: bash
        run: |
          set -euo pipefail
          systemctl is-active --quiet myai-geniex.service
          systemctl is-active --quiet myai-ventuno.service
          echo 'Production GenieX and MyAI services are active and will not be changed.'

      - name: Stage small ARM64 voice wheels in temporary isolated venv only
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/myai-voice-checkout"
          SYSTEM_PY="$(readlink -f "$(command -v python3)")"
          test -x "$SYSTEM_PY"
          /home/arduino/MyAI/.venv/bin/python \
            scripts/ventuno_voice_wheel_staging.py \
            --stage-light \
            --allow-missing-portaudio \
            --runner-temp "$RUNNER_TEMP" \
            --python "$SYSTEM_PY"

      - name: Test temporary distro PortAudio without installing an OS package
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/myai-voice-checkout"
          /home/arduino/MyAI/.venv/bin/python \
            scripts/ventuno_portaudio_temp_stage.py \
            --runner-temp "$RUNNER_TEMP" \
            --staged-python "$RUNNER_TEMP/myai-voice-staging/bin/python"
          echo 'PortAudio test is confined to the runner temporary directory.'

      - name: Resolve faster-whisper ARM64 wheel dependency chain without installing
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/myai-voice-checkout"
          /home/arduino/MyAI/.venv/bin/python \
            -m scripts.ventuno_stt_wheel_preflight \
            --runner-temp "$RUNNER_TEMP"
          echo 'Whisper compatibility checked; no STT model downloaded.'

      - name: Install and import faster-whisper/CT2 only in temporary ARM64 venv
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/myai-voice-checkout"
          /home/arduino/MyAI/.venv/bin/python \
            -m scripts.ventuno_stt_import_staging \
            --runner-temp "$RUNNER_TEMP"
          echo 'STT Python import only, no model weights or inference.'

      - name: Check services unchanged and voice disabled
        shell: bash
        run: |
          set -euo pipefail
          systemctl is-active --quiet myai-geniex.service
          systemctl is-active --quiet myai-ventuno.service
          /home/arduino/MyAI/.venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path("/home/arduino/MyAI/config/profiles/ventuno_q.json").read_text())
          voice = cfg.get("voice", {})
          assert voice.get("enabled") is not True
          assert voice.get("tts_enabled") is not True
          assert voice.get("handsfree_enabled") is not True
          print("Production voice remains disabled.")
          PY

      - name: Remove staged voice wheels and Python environment
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Fixed, narrow names inside GitHub RUNNER_TEMP; never production venv.
          for name in myai-voice-staging myai-voice-wheel-report myai-voice-portaudio; do
            case "$RUNNER_TEMP" in
              /home/arduino/MyAI/.venv*|""|"/") exit 2 ;;
            esac
            if test -e "$RUNNER_TEMP/$name" && ! test -L "$RUNNER_TEMP/$name"; then
              rm -rf -- "$RUNNER_TEMP/$name"
            fi
          done
          echo 'Only isolated voice wheel staging removed.'
          echo 'No Whisper model downloaded, microphone opened or GenieX service modified.'
