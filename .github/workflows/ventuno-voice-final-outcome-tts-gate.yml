name: Voice verified-outcome TTS gate synthetic CI
on:
  push:
    branches: [dev/ventuno-voice-final-outcome-tts-gate-20261015]
    paths:
      - .github/workflows/ventuno-voice-final-outcome-tts-gate.yml
      - core/voice_pipeline.py
      - tests/test_voice_final_outcome_tts_gate.py
      - tests/test_voice_tool_execution_status_bridge.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: myai-final-outcome-tts-gate-20261015
  cancel-in-progress: false
jobs:
  synthetic-voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Exact SHA detached checkout in isolated workspace
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          scratch="$(mktemp -d "$RUNNER_TEMP/myai-outcome-tts.XXXXXX")"
          chmod 700 "$scratch"
          echo "MYAI_TTS_GATE_SCRATCH=$scratch" >> "$GITHUB_ENV"
          cd "$scratch"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Pinned dependencies in disposable venv
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/myai-outcome-tts-venv"
          "$RUNNER_TEMP/myai-outcome-tts-venv/bin/python" -m pip install \
            --disable-pip-version-check --only-binary=:all: \
            pytest==8.3.5 requests==2.32.5 psutil==7.1.0
      - name: Run fake-only voice safety regression suites
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          cd "$MYAI_TTS_GATE_SCRATCH"
          "$RUNNER_TEMP/myai-outcome-tts-venv/bin/python" -B -m pytest -q \
            tests/test_voice_final_outcome_tts_gate.py \
            tests/test_voice_tool_execution_status_bridge.py \
            tests/test_voice_memory_feedback_bridge.py \
            tests/test_voice_pipeline.py
          echo 'No physical STT/TTS, live memory, camera, QNN or production commands.'
      - name: Remove disposable checkout and venv
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${MYAI_TTS_GATE_SCRATCH:-}" ]; then
            rm -rf -- "$MYAI_TTS_GATE_SCRATCH"
          fi
          rm -rf -- "$RUNNER_TEMP/myai-outcome-tts-venv"
