name: Memory explicit retry feedback (synthetic only)
on:
  push:
    branches: [dev/ventuno-memory-explicit-retry-feedback-20261015]
    paths:
      - .github/workflows/ventuno-memory-explicit-retry-feedback.yml
      - core/memory_feedback.py
      - core/assistant.py
      - tests/test_memory_explicit_retry_feedback.py
      - tests/test_memory_literal_search_and_recovery.py
permissions:
  contents: read
concurrency:
  group: myai-memory-retry-feedback-20261015
  cancel-in-progress: false
jobs:
  synthetic-dialog:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout exact SHA into disposable directory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          scratch="$(mktemp -d "$RUNNER_TEMP/myai-memory-retry.XXXXXX")"
          chmod 700 "$scratch"
          echo "MYAI_MEMORY_RETRY_SCRATCH=$scratch" >> "$GITHUB_ENV"
          cd "$scratch"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Pinned pytest and dependencies in disposable virtual environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/myai-memory-retry-venv"
          "$RUNNER_TEMP/myai-memory-retry-venv/bin/python" -m pip install \
            --disable-pip-version-check --only-binary=:all: \
            pytest==8.3.5 requests==2.32.5 psutil==7.1.0
      - name: Test offline SQLite retries and dialog outcome correctness
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          cd "$MYAI_MEMORY_RETRY_SCRATCH"
          "$RUNNER_TEMP/myai-memory-retry-venv/bin/python" -B -m pytest -q \
            tests/test_memory_explicit_retry_feedback.py \
            tests/test_memory_literal_search_and_recovery.py \
            tests/test_assistant_core.py
          echo 'All SQLite test data synthetic, no active board access or models.'
      - name: Clean disposable checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${MYAI_MEMORY_RETRY_SCRATCH:-}" ]; then
            rm -rf -- "$MYAI_MEMORY_RETRY_SCRATCH"
          fi
          rm -rf -- "$RUNNER_TEMP/myai-memory-retry-venv"
