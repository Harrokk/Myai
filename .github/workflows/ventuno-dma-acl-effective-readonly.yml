name: VENTUNO read-only DMA heap ACL permission evaluation
on:
  push:
    branches: [dev/ventuno-dma-acl-effective-permissions-20261014]
    paths:
      - .github/workflows/ventuno-dma-acl-effective-readonly.yml
permissions:
  contents: read
concurrency:
  group: myai-dma-acl-20261014
  cancel-in-progress: false
jobs:
  acl-metadata:
    runs-on: [self-hosted, Linux, ARM64, ventuno-q]
    timeout-minutes: 4
    steps:
      - name: Exact commit, no device open and no raw identities or ACL export
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          test "$(id -un)" = "arduino"
          test "$GITHUB_REF" = "refs/heads/dev/ventuno-dma-acl-effective-permissions-20261014"
          scratch="$(mktemp -d "$RUNNER_TEMP/myai-dma-acl.XXXXXX")"
          chmod 700 "$scratch"
          trap 'cd "$RUNNER_TEMP" && rm -rf -- "$scratch"' EXIT
          cd "$scratch"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          timeout --signal=TERM --kill-after=3s 30s /home/arduino/MyAI/.venv/bin/python -B -m scripts.ventuno_dma_acl_effective_readonly
          echo 'ACL outcomes only; no hardware open, LLM, QNN, permission change or deployment.'
