name: VENTUNO Q runner check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-check:
    name: Check VENTUNO Q runner
    runs-on: [self-hosted, Linux, ARM64, ventuno-q]
    timeout-minutes: 5
    steps:
      - name: Check runner environment
        shell: bash
        run: |
          set -euo pipefail
          printf 'Runner: %s\n' "${RUNNER_NAME}"
          printf 'Architecture: '
          uname -m
          printf 'User: '
          id -un
          printf 'Working directory: %s\n' "${GITHUB_WORKSPACE}"
          test "$(uname -m)" = "aarch64"
          test "$(id -un)" = "arduino"
          echo "GODKÄNT: VENTUNO Q runner svarar"
