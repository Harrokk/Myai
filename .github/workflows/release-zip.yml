name: Build MyAI VENTUNO ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - "dev/routing-boundary-followup"
    paths:
      - ".github/workflows/release-zip.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact commit without external actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Remove development-only generated files
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.db' -o -name '*.db-wal' -o -name '*.db-shm' \) -delete
          rm -rf .git runtime

      - name: Create release ZIP
        run: |
          mkdir -p dist
          zip -r "dist/MyAI-VENTUNO-Q.zip" .             -x "dist/*" ".github/*" "tests/*" ".pytest_cache/*"

      - name: Verify ZIP was generated
        run: |
          test -s dist/MyAI-VENTUNO-Q.zip
          unzip -t dist/MyAI-VENTUNO-Q.zip >/dev/null
          echo "ZIP validated (artifact upload requires an allowed action)"
