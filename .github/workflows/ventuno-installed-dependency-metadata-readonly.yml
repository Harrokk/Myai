name: VENTUNO integrated installed dependency audit source-only
on:
  push:
    branches: [dev/manual-audit-integrated-installed-deps-20261017]
permissions:
  contents: read
jobs:
  readonly-installed-evidence:
    runs-on: [self-hosted, Linux, ARM64, ventuno-q]
    timeout-minutes: 5
    steps:
      - name: Checkout exact SHA outside installed MyAI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(id -un)" = arduino
          test -d "$RUNNER_TEMP" && test ! -L "$RUNNER_TEMP"
          root="$(mktemp -d "$RUNNER_TEMP/myai-installed-deps-XXXXXXXX")"
          chmod 700 "$root"
          echo "MYAI_DEPENDENCY_METADATA_SCRATCH=$root" >> "$GITHUB_ENV"
          git init -q "$root"
          git -C "$root" remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git -C "$root" -c credential.helper= fetch -q --depth=1 origin "$GITHUB_SHA"
          git -C "$root" -c credential.helper= checkout -q --detach FETCH_HEAD
          git -C "$root" remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git"
          test "$(git -C "$root" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Read only allowlisted installed Python distribution names and versions
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: |
          set -euo pipefail
          cd "$MYAI_DEPENDENCY_METADATA_SCRATCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          timeout --signal=TERM --kill-after=3s 30s \
            /home/arduino/MyAI/.venv/bin/python -B -m scripts.ventuno_installed_dependency_metadata_readonly
          echo "Dependency metadata is diagnostic only; this is not a transitive SBOM or CVE clearance."
          echo "No audio opened, no model constructed, no production files changed."
      - name: Verify fail-closed source test invariants
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: |
          set -euo pipefail
          cd "$MYAI_DEPENDENCY_METADATA_SCRATCH"
          timeout --signal=TERM --kill-after=3s 100s \
            /home/arduino/MyAI/.venv/bin/python -B -m pytest -q \
              tests/test_ventuno_installed_dependency_metadata_readonly.py
      - name: Remove exact-SHA temporary checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          case "${MYAI_DEPENDENCY_METADATA_SCRATCH:-}" in
            "$RUNNER_TEMP"/myai-installed-deps-*)
              if [ -d "$MYAI_DEPENDENCY_METADATA_SCRATCH" ] && [ ! -L "$MYAI_DEPENDENCY_METADATA_SCRATCH" ]; then
                rm -rf -- "$MYAI_DEPENDENCY_METADATA_SCRATCH"
              fi
              ;;
            "") ;;
            *) echo "Unexpected cleanup target; refusing" >&2; exit 2 ;;
          esac
