name: VENTUNO USB speaker code and aplay flags no-playback preflight

on:
  push:
    branches: [dev/routing-boundary-followup]
    paths:
      - .github/workflows/ventuno-usb-speaker-preflight.yml
      - scripts/ventuno_usb_speaker_smoke.py
      - scripts/ventuno_tts_temp_stage.py
      - tests/test_ventuno_usb_speaker_smoke.py
      - tests/test_ventuno_tts_temp_stage.py

permissions:
  contents: read
  statuses: write

concurrency:
  group: ventuno-usb-speaker-preflight
  cancel-in-progress: false

jobs:
  verify:
    name: Check aplay CLI and synth tests without playback
    runs-on: [self-hosted, Linux, ARM64, ventuno-q]
    timeout-minutes: 5
    steps:
      - name: Clone tested commit to temporary directory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          test "$(id -un)" = "arduino"
          test -n "${RUNNER_TEMP:-}"
          source_dir="$(mktemp -d "$RUNNER_TEMP/myai-usb-speaker-preflight-XXXXXXXX")"
          echo "MYAI_SPEAKER_SOURCE=$source_dir" >> "$GITHUB_ENV"
          git init -q "$source_dir"
          git -C "$source_dir" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$source_dir" -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -C "$source_dir" -c credential.helper= checkout -q --detach FETCH_HEAD
          git -C "$source_dir" remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Verify playback CLI capabilities without opening speaker
        shell: bash
        run: |
          set -euo pipefail
          /home/arduino/MyAI/.venv/bin/python - <<'PY'
          import shutil
          import subprocess
          tool = shutil.which("aplay")
          assert tool, "aplay not installed"
          result = subprocess.run(
              [tool, "--help"],
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              timeout=6,
              check=False,
          )
          # Usage text is not logged; only allowlisted option indicators.
          raw = (result.stdout + result.stderr)[:65536].decode(
              "utf-8", errors="replace").lower()
          required = ("--file-type", "--device")
          found = {flag: flag in raw for flag in required}
          print("Supported aplay command-line flags:", found)
          assert all(found.values()), "Required aplay CLI option missing"
          PY

      - name: Verify speaker amplitude limiter and fail-closed device gates
        shell: bash
        run: |
          set -euo pipefail
          cd "$MYAI_SPEAKER_SOURCE"
          /home/arduino/MyAI/.venv/bin/python -m pytest -q -p no:cacheprovider \
            tests/test_ventuno_usb_speaker_smoke.py \
            tests/test_ventuno_tts_temp_stage.py \
            tests/test_ventuno_usb_audio_inventory.py
          echo "All test audio was synthetic. No speaker or microphone opened."

      - name: Confirm active services and clean test checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          systemctl is-active --quiet myai-ventuno.service
          systemctl is-active --quiet myai-geniex.service
          if [ -n "${MYAI_SPEAKER_SOURCE:-}" ] && [ -n "${RUNNER_TEMP:-}" ]; then
            case "$MYAI_SPEAKER_SOURCE" in
              "$RUNNER_TEMP"/myai-usb-speaker-preflight-*)
                if [ -d "$MYAI_SPEAKER_SOURCE" ]; then
                  rm -rf -- "$MYAI_SPEAKER_SOURCE"
                fi
                ;;
              *)
                echo "Unsafe cleanup path" >&2
                exit 1
                ;;
            esac
          fi

      - name: Publish CI status to source commit
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          sha = os.environ.get("GITHUB_SHA", "")
          token = os.environ.get("GH_TOKEN", "")
          if not (re.fullmatch(r"[0-9a-f]{40}", sha) and
                  re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo) and token):
              raise SystemExit(0)
          body = {
              "state": {"success": "success", "failure": "failure"}.get(
                  os.environ.get("JOB_RESULT", ""), "error"),
              "context": "myai/ventuno-usb-speaker-preflight",
              "description": "aplay --help and mocked playback tests; NO audio I/O",
              "target_url": "https://github.com/" + repo + "/actions/runs/" +
                            os.environ.get("GITHUB_RUN_ID", ""),
          }
          request = urllib.request.Request(
              "https://api.github.com/repos/" + repo + "/statuses/" + sha,
              data=json.dumps(body).encode("utf-8"), method="POST",
              headers={"Authorization": "Bearer " + token,
                       "Accept": "application/vnd.github+json",
                       "X-GitHub-Api-Version": "2022-11-28",
                       "Content-Type": "application/json"},
          )
          try:
              with urllib.request.urlopen(request, timeout=10) as response:
                  print("No-playback speaker validation status posted:", response.status == 201)
          except Exception as error:
              print("Commit-status update failed:", type(error).__name__)
          PY
