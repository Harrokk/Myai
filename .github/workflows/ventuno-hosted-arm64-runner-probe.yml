name: ARM64 GitHub hosted runner readiness, no hardware
on:
  push:
    branches: [dev/ventuno-arm64-voice-sandbox-20261016]
    paths:
      - .github/workflows/ventuno-hosted-arm64-runner-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 3
    steps:
      - name: Fetch exact reviewed commit in private hosted ARM64 scratch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$(mktemp -d "$RUNNER_TEMP/myai-arm64-source.XXXXXX")"
          chmod 700 "$work"
          echo "MYAI_HOSTED_SOURCE=$work" >> "$GITHUB_ENV"
          git -C "$work" init -q
          git -C "$work" remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git -C "$work" -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -C "$work" -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git -C "$work" remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git"
          test "$(git -C "$work" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Check hosted ARM64 architecture without installed voice or devices
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          python3 --version
          echo "MYAI_HOSTED_ARM64_RUNNER_AVAILABLE=true"

      - name: Install exact 28 SHA256 voice wheels in disposable hosted ARM64 venv
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          set -euo pipefail
          cd "$MYAI_HOSTED_SOURCE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3.12 -B -m scripts.ventuno_voice_static_lock_check
          scratch="$(mktemp -d "$RUNNER_TEMP/voice-hosted-arm.XXXXXX")"
          chmod 700 "$scratch"
          echo "MYAI_VOICE_ARM_SCRATCH=$scratch" >> "$GITHUB_ENV"
          python3.12 -m venv "$scratch/env"
          "$scratch/env/bin/python" -m pip download --no-deps --only-binary=:all: --require-hashes \
            --dest "$scratch/wheels" -r requirements-voice-arm64-hashed.lock
          "$scratch/env/bin/python" -m pip install --no-index --no-deps --require-hashes \
            --find-links="$scratch/wheels" -r requirements-voice-arm64-hashed.lock
          "$scratch/env/bin/python" -m pip check
          echo "MYAI_HOSTED_ARM64_HASHED_WHEEL_INSTALL=true"
      - name: Import native voice libraries without opening a device or model
        shell: bash
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          "$MYAI_VOICE_ARM_SCRATCH/env/bin/python" -c \
            'import faster_whisper, sounddevice, webrtcvad, pyttsx3, ctranslate2, av, numpy; print("MYAI_HOSTED_ARM64_NATIVE_IMPORTS=true")'
          echo "MYAI_AUDIO_DEVICE_OR_MODEL_OPENED=false"
      - name: Delete all temporary hosted ARM64 staging data
        if: always()
        shell: bash
        run: |
          if [ -n "${MYAI_VOICE_ARM_SCRATCH:-}" ]; then
            rm -rf -- "$MYAI_VOICE_ARM_SCRATCH"
          fi
          if [ -n "${MYAI_HOSTED_SOURCE:-}" ]; then
            rm -rf -- "$MYAI_HOSTED_SOURCE"
          fi
