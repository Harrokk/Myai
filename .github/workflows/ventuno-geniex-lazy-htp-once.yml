name: VENTUNO one existing idle GenieX model request - NPU association
on:
  push:
    # This unique-branch one-shot workflow is deliberately NOT retriggered
    # by test/code updates; only adding/changing the workflow itself runs it.
    branches: [dev/ventuno-geniex-lazy-htp-activation-once-20261015]
    paths: [.github/workflows/ventuno-geniex-lazy-htp-once.yml]
permissions:
  contents: read
concurrency:
  group: myai-geniex-lazy-htp-once-20261015
  cancel-in-progress: false
jobs:
  mocked-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Fetch exact commit in private disposable hosted x86 checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          scratch="$(mktemp -d "$RUNNER_TEMP/myai-lazy-htp-unit.XXXXXX")"
          chmod 700 "$scratch"
          echo "MYAI_LAZY_HTP_UNIT=$scratch" >> "$GITHUB_ENV"
          cd "$scratch"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Test synthetic source and all no-POST fail-closed guards
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/myai-lazy-htp-venv"
          "$RUNNER_TEMP/myai-lazy-htp-venv/bin/python" -m pip install \
            --disable-pip-version-check --only-binary=:all: \
            pytest==8.3.5 psutil==7.1.0 requests==2.32.5
          cd "$MYAI_LAZY_HTP_UNIT"
          "$RUNNER_TEMP/myai-lazy-htp-venv/bin/python" -B -m pytest -q \
            tests/test_ventuno_geniex_lazy_htp_once.py \
            tests/test_ventuno_geniex_idle_model_readonly.py \
            tests/test_ventuno_live_qairt_synthetic_once.py
      - name: Delete x86 temporary source and test environment
        if: always()
        shell: bash
        run: |
          if [ -n "${MYAI_LAZY_HTP_UNIT:-}" ]; then rm -rf -- "$MYAI_LAZY_HTP_UNIT"; fi
          rm -rf -- "$RUNNER_TEMP/myai-lazy-htp-venv"

  board-one-existing-request:
    name: One preflight-gated existing GenieX synthetic prompt only
    runs-on: [self-hosted, Linux, ARM64, ventuno-q]
    needs: mocked-safety
    timeout-minutes: 4
    steps:
      - name: Fetch same exact source commit privately on board
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          test "$(id -un)" = "arduino"
          scratch="$(mktemp -d "$RUNNER_TEMP/myai-lazy-existing-htp.XXXXXX")"
          chmod 700 "$scratch"
          echo "MYAI_LAZY_HTP_BOARD=$scratch" >> "$GITHUB_ENV"
          cd "$scratch"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: At most ONE synthetic POST to verified existing idle GenieX
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
          MYAI_ALLOW_ONE_EXISTING_GENIEX_LAZY_HTP_REQUEST: "yes"
        run: |
          set -euo pipefail
          cd "$MYAI_LAZY_HTP_BOARD"
          timeout --signal=TERM --kill-after=3s 70s \
            /home/arduino/MyAI/.venv/bin/python -B \
            -m scripts.ventuno_geniex_lazy_htp_once \
            | tee "$MYAI_LAZY_HTP_BOARD/sanitized.txt"
          /home/arduino/MyAI/.venv/bin/python -B - <<'PY'
          import json
          from pathlib import Path
          data = Path("sanitized.txt").read_text(encoding="utf-8").splitlines()
          assert len(data) == 1 and data[0].startswith("MYAI_GENIEX_LAZY_HTP_ONCE_JSON=")
          r = json.loads(data[0].split("=", 1)[1])
          assert r["npu_operator_placement_verified"] is False
          assert r["htp_cycles_or_utilization_measured"] is False
          assert r["new_htp_or_geniex_process_started"] is False
          assert r["service_or_model_configuration_modified"] is False
          assert r["permissions_or_firmware_modified"] is False
          assert r["model_response_text_exported"] is False
          assert r["personal_prompts_or_model_files_read"] is False
          if r["bounded_synthetic_reply_received"]:
              assert r["http_post_attempted"] is True
              assert r["sample"]["returned_text_logged"] is False
              print("One bounded reply. No QNN per-op profile; NPU placement remains unverified.")
          else:
              print("NO-GO or inconclusive one-shot, never a certified NPU execution.")
          PY
      - name: Delete temporary source and bounded status file
        if: always()
        shell: bash
        run: |
          if [ -n "${MYAI_LAZY_HTP_BOARD:-}" ]; then rm -rf -- "$MYAI_LAZY_HTP_BOARD"; fi
