name: Disposable real Bubblewrap signed observation test
on:
  push:
    branches: [dev/manual-audit-real-bwrap-evidence-observer-20261018]
    paths:
      - core/selfdev_bwrap_observation.py
      - scripts/test_hosted_real_bwrap_observer.py
      - tests/test_selfdev_real_bwrap_observation.py
      - .github/workflows/disposable-real-bwrap-observer.yml
      - docs/security/disposable-real-bwrap-observer.md

permissions:
  contents: read

jobs:
  real-bwrap-observer:
    name: Real network-unshared Bubblewrap on disposable hosted Ubuntu
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Confirm isolated GitHub-hosted environment
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test "$(uname -m)" = "x86_64"
          test "$(id -u)" -ne 0

      - name: Fetch exact checked revision outside production paths
        shell: bash
        run: |
          set -euo pipefail
          temp="$(mktemp -d "$RUNNER_TEMP/myai-real-bwrap-XXXXXXXX")"
          chmod 700 "$temp"
          echo "MYAI_BWRAP_CHECKOUT=$temp" >> "$GITHUB_ENV"
          git init -q "$temp"
          git -C "$temp" remote add origin https://github.com/Harrokk/Myai.git
          git -C "$temp" fetch -q --depth=1 origin "$GITHUB_SHA"
          git -C "$temp" checkout -q --detach FETCH_HEAD
          test "$(git -C "$temp" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install Bubblewrap on disposable host without relaxing user namespaces
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends bubblewrap
          test -x /usr/bin/bwrap
          test -x /usr/bin/python3
          # Do NOT disable host AppArmor/user namespace restrictions.
          # Unavailable namespaces are an expected BLOCKER, not a reason
          # to fall back to running unsandboxed.

      - name: Create temporary isolated Python test environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$MYAI_BWRAP_CHECKOUT/venv"
          "$MYAI_BWRAP_CHECKOUT/venv/bin/python" -m pip install \
            --disable-pip-version-check --only-binary=:all: \
            "cryptography==45.0.7"

      - name: Execute real Bubblewrap and verify signed synthetic observation
        shell: bash
        env:
          MYAI_HOSTED_BWRAP_TEST: "yes"
          MYAI_RUNNER_ENVIRONMENT: "github-hosted"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          cd "$MYAI_BWRAP_CHECKOUT"
          PYTHONPATH="$MYAI_BWRAP_CHECKOUT" \
            "$MYAI_BWRAP_CHECKOUT/venv/bin/python" -B \
            scripts/test_hosted_real_bwrap_observer.py

      - name: Remove temporary checkout and ephemeral test keys
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          case "${MYAI_BWRAP_CHECKOUT:-}" in
            "$RUNNER_TEMP"/myai-real-bwrap-*)
              if [ -d "$MYAI_BWRAP_CHECKOUT" ] && [ ! -L "$MYAI_BWRAP_CHECKOUT" ]; then
                rm -rf -- "$MYAI_BWRAP_CHECKOUT"
              fi
              ;;
            "") ;;
            *) echo "Refusing unexpected cleanup path" >&2; exit 2 ;;
          esac
