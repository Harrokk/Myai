name: VENTUNO external Actions source identity pin gate
on:
  push:
    branches: [dev/manual-audit-actions-sha-pinning-20261017]
permissions:
  contents: read
jobs:
  readonly-installed-evidence:
    runs-on: [self-hosted, Linux, ARM64, ventuno-q]
    timeout-minutes: 5
    steps:
      - name: Checkout exact SHA outside installed MyAI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(id -un)" = arduino
          test -d "$RUNNER_TEMP" && test ! -L "$RUNNER_TEMP"
          root="$(mktemp -d "$RUNNER_TEMP/myai-action-refs-XXXXXXXX")"
          chmod 700 "$root"
          echo "MYAI_ACTION_PIN_SCRATCH=$root" >> "$GITHUB_ENV"
          git init -q "$root"
          git -C "$root" remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git -C "$root" -c credential.helper= fetch -q --depth=1 origin "$GITHUB_SHA"
          git -C "$root" -c credential.helper= checkout -q --detach FETCH_HEAD
          git -C "$root" remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git"
          test "$(git -C "$root" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Reject mutable external actions before release
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: |
          set -euo pipefail
          cd "$MYAI_ACTION_PIN_SCRATCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          timeout --signal=TERM --kill-after=3s 30s \
            /usr/bin/python3 -B -m scripts.ventuno_external_actions_sha_audit
          echo "Source Action pinning is a drift check, not a third-party security attestation."
          echo "No audio opened, no model constructed, no production files changed."
      - name: Test action SHA pinning and unsafe refs
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: |
          set -euo pipefail
          cd "$MYAI_ACTION_PIN_SCRATCH"
          timeout --signal=TERM --kill-after=3s 100s \
            /home/arduino/MyAI/.venv/bin/python -B -m pytest -q \
              tests/test_ventuno_external_actions_sha_audit.py
      - name: Remove exact-SHA temporary checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          case "${MYAI_ACTION_PIN_SCRATCH:-}" in
            "$RUNNER_TEMP"/myai-action-refs-*)
              if [ -d "$MYAI_ACTION_PIN_SCRATCH" ] && [ ! -L "$MYAI_ACTION_PIN_SCRATCH" ]; then
                rm -rf -- "$MYAI_ACTION_PIN_SCRATCH"
              fi
              ;;
            "") ;;
            *) echo "Unexpected cleanup target; refusing" >&2; exit 2 ;;
          esac
