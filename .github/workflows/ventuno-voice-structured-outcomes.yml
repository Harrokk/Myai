name: Voice structured tool outcomes (synthetic only)
on:
  push:
    branches: [dev/ventuno-voice-structured-tool-outcomes-20261015]
    paths:
      - .github/workflows/ventuno-voice-structured-outcomes.yml
      - core/tool_outcome.py
      - core/tool_manager.py
      - core/assistant.py
      - core/voice_plan_attestation.py
      - modules/files/workspace.py
      - modules/files/excel.py
      - modules/system/memory_admin.py
      - tests/test_voice_structured_tool_outcomes.py
      - tests/test_voice_multitool_preflight.py
permissions:
  contents: read
concurrency:
  group: myai-voice-structured-outcomes-20261015
  cancel-in-progress: false
jobs:
  fake-tool-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Exact-SHA disposable hosted x86 checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          scratch="$(mktemp -d "$RUNNER_TEMP/myai-voice-outcome.XXXXXX")"
          chmod 700 "$scratch"
          echo "MYAI_OUTCOME_SCRATCH=$scratch" >> "$GITHUB_ENV"
          cd "$scratch"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Pinned pytest and existing dependencies in temporary host venv
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/myai-voice-outcome-venv"
          "$RUNNER_TEMP/myai-voice-outcome-venv/bin/python" -m pip install \
            --disable-pip-version-check --only-binary=:all: \
            pytest==8.3.5 requests==2.32.5 psutil==7.1.0
      - name: Test synthetic outcomes and existing guarded voice dispatch
        shell: bash
        run: |
          set -euo pipefail
          cd "$MYAI_OUTCOME_SCRATCH"
          "$RUNNER_TEMP/myai-voice-outcome-venv/bin/python" -B -m pytest -q \
            tests/test_voice_structured_tool_outcomes.py \
            tests/test_voice_multitool_preflight.py \
            tests/test_voice_dispatch_plan_binding.py
          echo 'Mock tool functions only. No workspace changes, real AI models, microphone or device access.'
      - name: Remove temporary checkout and venv
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${MYAI_OUTCOME_SCRATCH:-}" ]; then
            rm -rf -- "$MYAI_OUTCOME_SCRATCH"
          fi
          rm -rf -- "$RUNNER_TEMP/myai-voice-outcome-venv"
