name: ONE-TIME user-approved low-level USB Swedish speaker playback

on:
  push:
    branches: [dev/routing-boundary-followup]
    paths:
      - .github/workflows/ventuno-usb-speaker-consent-once.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: ventuno-usb-speaker-consent-2026-10-12
  cancel-in-progress: false

jobs:
  speaker:
    name: Exactly one low-digital-peak Swedish phrase on USB speaker
    if: >-
      github.event_name == 'push' &&
      github.event.head_commit.message == 'Authorize one-time low-volume USB speaker playback on VENTUNO Q' &&
      github.run_attempt == 1 &&
      github.repository == 'Harrokk/Myai'
    runs-on: [self-hosted, Linux, ARM64, ventuno-q]
    timeout-minutes: 10
    steps:
      - name: Fetch exact source into dedicated disposable staging workspace
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          test "$(id -un)" = "arduino"
          test -n "${RUNNER_TEMP:-}"
          test -n "${GH_TOKEN:-}"
          workspace="$(mktemp -d "$RUNNER_TEMP/myai-usbspk-once-XXXXXXXX")"
          echo "MYAI_SPEAKER_WORK=$workspace" >> "$GITHUB_ENV"
          mkdir "$workspace/source"
          git init -q "$workspace/source"
          git -C "$workspace/source" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$workspace/source" -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -C "$workspace/source" -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git -C "$workspace/source" remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git -C "$workspace/source" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Mock-only volume and device safety tests (no playback)
        shell: bash
        run: |
          set -euo pipefail
          cd "$MYAI_SPEAKER_WORK/source"
          /home/arduino/MyAI/.venv/bin/python -m pytest -q -p no:cacheprovider \
            tests/test_ventuno_usb_speaker_smoke.py \
            tests/test_ventuno_tts_temp_stage.py \
            tests/test_ventuno_usb_audio_inventory.py

      - name: Verify speakers, production voice disabled and installed aplay flags
        shell: bash
        run: |
          set -euo pipefail
          systemctl is-active --quiet myai-geniex.service
          systemctl is-active --quiet myai-ventuno.service
          cd "$MYAI_SPEAKER_WORK/source"
          /home/arduino/MyAI/.venv/bin/python - <<'PY'
          import json
          import shutil
          import subprocess
          from pathlib import Path
          from scripts.ventuno_usb_audio_inventory import inventory_usb_audio
          profile = json.loads(
              Path("/home/arduino/MyAI/config/profiles/ventuno_q.json").read_text(encoding="utf-8")
          )
          voice = profile.get("voice", {})
          assert isinstance(voice, dict)
          assert all(voice.get(key) is not True
                     for key in ("enabled", "tts_enabled", "handsfree_enabled"))
          hardware = inventory_usb_audio()
          assert 1 in hardware["usb_audio_cards"]
          assert [1, 0] in hardware["usb_playback_pairs"]
          assert any(n["pair"] == [1, 0] and n["character_device"] and n["accessible"]
                     for n in hardware["playback_device_nodes"])
          exe = shutil.which("aplay")
          assert exe
          result = subprocess.run(
              [exe, "--help"], capture_output=True, timeout=6, check=False
          )
          text = (result.stdout + result.stderr)[:65536]
          assert b"--file-type" in text and b"--device" in text
          print("Preflight: USB speaker card 1 PCM 0, aplay flags, inactive voice confirmed.")
          PY

      - name: Stage approved Swedish eSpeak NG entirely under runner temporary directory
        shell: bash
        run: |
          set -euo pipefail
          cd "$MYAI_SPEAKER_WORK/source"
          /home/arduino/MyAI/.venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.ventuno_tts_temp_stage import stage_sweden_tts
          work = Path(os.environ["MYAI_SPEAKER_WORK"])
          report = stage_sweden_tts(work / "myai-tts-espeak-stage", work)
          print("Isolated Swedish voice staging:", json.dumps(report, sort_keys=True))
          assert report["status"] == "isolated-swedish-tts-signal-verified"
          assert report["physical_playback_verified"] is False
          assert report["services_changed"] is False
          PY

      - name: Exactly ONE approved, volume-capped Swedish USB speaker playback
        id: play
        shell: bash
        run: |
          set -euo pipefail
          cd "$MYAI_SPEAKER_WORK/source"
          /home/arduino/MyAI/.venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.ventuno_usb_speaker_smoke import play_usb_speaker
          report = play_usb_speaker(
              authorized=True,
              stage_folder=Path(os.environ["MYAI_SPEAKER_WORK"]) / "myai-tts-espeak-stage",
              device="plughw:1,0",
          )
          print("VENTUNO USB speaker one-time result:", json.dumps(report, sort_keys=True))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("playback_status=" + str(report["status"]) + "\n")
          if report["status"] != "usb-speaker-pcm-playback-completed":
              raise SystemExit(2)
          PY

      - name: Confirm running services and erase disposable checkout and voice packages
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          systemctl is-active --quiet myai-geniex.service
          systemctl is-active --quiet myai-ventuno.service
          if [ -n "${MYAI_SPEAKER_WORK:-}" ] && [ -n "${RUNNER_TEMP:-}" ]; then
            case "$MYAI_SPEAKER_WORK" in
              "$RUNNER_TEMP"/myai-usbspk-once-*)
                if [ -d "$MYAI_SPEAKER_WORK" ] && [ ! -L "$MYAI_SPEAKER_WORK" ]; then
                  rm -rf -- "$MYAI_SPEAKER_WORK"
                fi
                ;;
              *)
                echo "Invalid disposable workspace; refusing cleanup" >&2
                exit 1
                ;;
            esac
          fi
          echo "All staged eSpeak files removed. MyAI, GenieX, production voice config unchanged."

      - name: Post allowlisted playback outcome as source commit status
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
          PLAY_STATUS: ${{ steps.play.outputs.playback_status }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request
          sha = os.environ.get("GITHUB_SHA", "")
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          token = os.environ.get("GH_TOKEN", "")
          if not (re.fullmatch(r"[a-f0-9]{40}", sha) and token and
                  re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo)):
              raise SystemExit(0)
          allowed = {
              "usb-speaker-pcm-playback-completed",
              "alsa-speaker-playback-nonzero",
              "speaker-playback-timeout",
              "speaker-playback-launch-error",
              "usb-speaker-missing-or-renumbered",
              "isolated-tts-unavailable", "aplay-not-installed",
              "tts-process-failed", "invalid-or-unbounded-swedish-test-wav",
          }
          value = os.environ.get("PLAY_STATUS", "")
          value = value if value in allowed else "no-playback-result"
          state = {"success": "success", "failure": "failure"}.get(
              os.environ.get("JOB_RESULT", ""), "error")
          body = {
              "state": state,
              "context": "myai/ventuno-usb-speaker-consent-once",
              "description": ("One low-level Swedish USB playback: " + value)[:140],
              "target_url": "https://github.com/" + repo + "/actions/runs/" +
                            os.environ.get("GITHUB_RUN_ID", ""),
          }
          request = urllib.request.Request(
              "https://api.github.com/repos/" + repo + "/statuses/" + sha,
              data=json.dumps(body).encode("utf-8"), method="POST",
              headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=10) as response:
                  print("Speaker outcome status published:", response.status == 201)
          except Exception as error:
              print("Speaker status publication failed:", type(error).__name__)
          PY
