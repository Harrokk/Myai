name: VENTUNO independent six regression privacy alignment
on:
  push:
    branches: [dev/manual-audit-six-regression-alignment-20261017]

permissions:
  contents: read

jobs:
  nonphysical-manual-review-gates:
    runs-on: [self-hosted, Linux, ARM64, ventuno-q]
    timeout-minutes: 7
    steps:
      - name: Exact commit into scratch, never installed MyAI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(id -un)" = arduino
          test -d "$RUNNER_TEMP" && test ! -L "$RUNNER_TEMP"
          root="$(mktemp -d "$RUNNER_TEMP/myai-manual-audit-XXXXXXXX")"
          chmod 700 "$root"
          echo "MYAI_MANUAL_AUDIT_SCRATCH=$root" >> "$GITHUB_ENV"
          git init -q "$root"
          git -C "$root" remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git -C "$root" -c credential.helper= fetch -q --depth=1 origin "$GITHUB_SHA"
          git -C "$root" -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git -C "$root" remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git"
          test "$(git -C "$root" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Two independent source and dependency policy checks
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail
          cd "$MYAI_MANUAL_AUDIT_SCRATCH"
          timeout --signal=TERM --kill-after=3s 120s \
            /usr/bin/python3 -B -m scripts.ventuno_deep_source_audit
          timeout --signal=TERM --kill-after=3s 60s \
            /usr/bin/python3 -B -m scripts.ventuno_dependency_source_review
          timeout --signal=TERM --kill-after=3s 30s \
            /usr/bin/python3 -B -m scripts.ventuno_historical_consent_audit
          timeout --signal=TERM --kill-after=3s 90s \
            /usr/bin/python3 -B -m scripts.ventuno_remote_revision_closeout
          echo "Source review passed; production dependency lock and physical consent remain NO-GO."

      - name: Independent fake-only regression pass
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail
          cd "$MYAI_MANUAL_AUDIT_SCRATCH"
          timeout --signal=TERM --kill-after=3s 135s \
            /home/arduino/MyAI/.venv/bin/python -B -m pytest -q \
              tests/test_ventuno_historical_consent_audit.py \
              tests/test_ventuno_dependency_source_review.py \
              tests/test_ventuno_remote_revision_closeout.py \
              tests/test_ventuno_all_manual_actions_drift_gate.py \
              tests/test_error_log.py \
              tests/test_tool_manager.py \
              tests/test_ventuno_exception_privacy_boundary.py \
              tests/test_ventuno_dependency_source_review.py
          echo "No vendor libs, model inference, microphone, playback, HTP, installs or service changes."

      - name: Delete only new disposable checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          case "${MYAI_MANUAL_AUDIT_SCRATCH:-}" in
            "$RUNNER_TEMP"/myai-manual-audit-*)
              if [ -d "$MYAI_MANUAL_AUDIT_SCRATCH" ] && [ ! -L "$MYAI_MANUAL_AUDIT_SCRATCH" ]; then
                rm -rf -- "$MYAI_MANUAL_AUDIT_SCRATCH"
              fi
              ;;
            "") ;;
            *) echo "Unexpected scratch location, refusing cleanup" >&2; exit 2 ;;
          esac
