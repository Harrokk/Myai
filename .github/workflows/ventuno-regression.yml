name: MyAI VENTUNO regression tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ventuno-regression
  cancel-in-progress: false

jobs:
  regression:
    name: Selected Python regression tests on VENTUNO Q
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, ventuno-q]
    timeout-minutes: 10
    steps:
      - name: Check out trusted development branch
        uses: actions/checkout@v4
        with:
          ref: dev/routing-boundary-followup
          persist-credentials: false
          clean: true

      - name: Verify local test environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          test "$(id -un)" = "arduino"
          test -x /home/arduino/MyAI/.venv/bin/python
          /home/arduino/MyAI/.venv/bin/python -m pytest --version

      - name: Run selected regression tests
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          /home/arduino/MyAI/.venv/bin/python -m pytest -q \
            tests/test_systemd_units.py \
            tests/test_geniex_supervisor.py \
            tests/test_ventuno_preflight.py \
            tests/test_runtime_service.py
