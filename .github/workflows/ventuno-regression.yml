name: MyAI VENTUNO regression tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ventuno-regression.yml

permissions:
  contents: read

concurrency:
  group: ventuno-regression
  cancel-in-progress: false

jobs:
  regression:
    name: Test local MyAI working tree on VENTUNO Q
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, ventuno-q]
    timeout-minutes: 10
    steps:
      - name: Verify runner and local Python environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          test "$(id -un)" = "arduino"
          test -x /home/arduino/MyAI/.venv/bin/python
          /home/arduino/MyAI/.venv/bin/python -m pytest --version

      - name: Run local regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd /home/arduino/MyAI
          .venv/bin/python -m pytest -q \
            tests/test_systemd_units.py \
            tests/test_geniex_readiness.py \
            tests/test_geniex_supervisor.py \
            tests/test_ventuno_preflight.py \
            tests/test_runtime_service.py

      - name: Validate Python changes and working tree
        shell: bash
        run: |
          set -euo pipefail
          cd /home/arduino/MyAI
          git diff --check
          .venv/bin/python -m py_compile \
            core/systemd_units.py \
            core/geniex_readiness.py \
            scripts/ventuno_runtime.py \
            tests/test_systemd_units.py \
            tests/test_geniex_readiness.py

      - name: Validate generated systemd units without installing
        shell: bash
        run: |
          set -euo pipefail
          cd /home/arduino/MyAI
          .venv/bin/python scripts/generate_ventuno_systemd.py
          systemd-analyze verify \
            runtime/systemd/myai-geniex.service \
            runtime/systemd/myai-ventuno.service \
            runtime/systemd/myai-geniex-watchdog.service \
            runtime/systemd/myai-ventuno.target
