name: VENTUNO native voice staging with pinned wheels - no audio or NPU
on:
  push:
    branches: [dev/ventuno-voice-abi-staging-20261016]
    paths:
      - .github/workflows/ventuno-voice-native-abi-stage.yml
      - scripts/ventuno_remote_synthetic_e2e.py
      - tests/test_ventuno_remote_synthetic_e2e.py
      - scripts/ventuno_voice_static_lock_check.py
      - tests/test_ventuno_voice_static_lock_check.py
      - config/voice_arm64_cp312_wheels.lock.json
      - requirements-voice-arm64-hashed.lock
      - scripts/ventuno_release_actions_inventory.py
      - tests/test_ventuno_release_actions_inventory.py
      - scripts/ventuno_native_voice_import_report.py
      - tests/test_ventuno_native_voice_import_report.py
      - .github/workflows/ventuno-diagnostics.yml
      - docs/VENTUNO_PINNED_PYAV18_NATIVE_STAGING.md
permissions:
  contents: read
concurrency:
  group: myai-native-voice-staging-no-devices
  cancel-in-progress: false
jobs:
  hosted-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout immutable commit privately
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d "$RUNNER_TEMP/myai-stt-host.XXXXXXXX")"
          chmod 700 "$scratch"
          echo "STAGE_SCRATCH=$scratch" >> "$GITHUB_ENV"
          cd "$scratch"
          git init -q
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Check locked PyAV 18 and synthetic STT-assistant-WAV path
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail
          cd "$STAGE_SCRATCH"
          python3 -m venv "$RUNNER_TEMP/myai-stt-host-venv"
          "$RUNNER_TEMP/myai-stt-host-venv/bin/python" -m pip install \
            -q --no-input --disable-pip-version-check pytest==8.3.5 -r requirements.txt
          "$RUNNER_TEMP/myai-stt-host-venv/bin/python" -B -m scripts.ventuno_voice_static_lock_check
          "$RUNNER_TEMP/myai-stt-host-venv/bin/python" -B -m scripts.ventuno_remote_synthetic_e2e
          "$RUNNER_TEMP/myai-stt-host-venv/bin/python" -B -m scripts.ventuno_release_actions_inventory
          "$RUNNER_TEMP/myai-stt-host-venv/bin/python" -B -m pytest -q \
            tests/test_ventuno_voice_static_lock_check.py \
            tests/test_ventuno_remote_synthetic_e2e.py \
            tests/test_ventuno_release_actions_inventory.py \
            tests/test_ventuno_native_voice_import_report.py \
            tests/test_ventuno_synthetic_voice_chain.py \
            tests/test_voice_recovery_crash_boundaries.py \
            tests/test_ventuno_isolated_voice_stage_contract.py
      - name: Remove disposable hosted tree
        if: always()
        shell: bash
        run: |
          if [ -n "$STAGE_SCRATCH" ]; then rm -rf -- "$STAGE_SCRATCH"; fi
          rm -rf -- "$RUNNER_TEMP/myai-stt-host-venv"
  board-native-import-only:
    needs: hosted-synthetic
    runs-on: [self-hosted, Linux, ARM64, ventuno-q]
    timeout-minutes: 13
    steps:
      - name: Exact SHA in a disposable board-only checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(id -un)" = arduino
          test -n "$RUNNER_TEMP"
          scratch="$(mktemp -d "$RUNNER_TEMP/myai-stt-native.XXXXXXXX")"
          chmod 700 "$scratch"
          echo "STAGE_SCRATCH=$scratch" >> "$GITHUB_ENV"
          cd "$scratch"
          git init -q
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Require board memory and disk headroom before importing anything
        shell: bash
        run: |
          set -euo pipefail
          cd "$STAGE_SCRATCH"
          /usr/bin/python3 -B -m scripts.ventuno_voice_static_lock_check
          /usr/bin/python3 - <<'PY'
          import os,pathlib,shutil
          root=pathlib.Path(os.environ["STAGE_SCRATCH"])
          free=shutil.disk_usage(root).free
          available=int(next(s.split()[1] for s in pathlib.Path("/proc/meminfo").read_text().splitlines()
                             if s.startswith("MemAvailable:")))*1024
          print("STAGING_DISK_GIB="+str(round(free/1024**3,2)))
          print("STAGING_AVAILABLE_RAM_GIB="+str(round(available/1024**3,2)))
          assert free>=6*1024**3 and available>=4*1024**3,"insufficient reserves"
          assert not str(root).startswith("/home/arduino/MyAI/"), "production tree blocked"
          PY
      - name: Download and hash verify exact wheels into disposable directory only
        shell: bash
        env:
          PIP_NO_INPUT: "1"
          PIP_NO_CACHE_DIR: "1"
          PYTHONDONTWRITEBYTECODE: "1"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail
          cd "$STAGE_SCRATCH"
          mkdir -m 700 wheels
          # Board's system Python may have NO pip module. Create disposable
          # venv first; neither install nor download runs in production.
          timeout --signal=TERM --kill-after=3s 60s /usr/bin/python3 -m venv "$STAGE_SCRATCH/venv" || {
            echo "STAGING_EPHEMERAL_VENV=blocked"; exit 2;
          }
          timeout --signal=TERM --kill-after=3s 240s "$STAGE_SCRATCH/venv/bin/python" -m pip download \
            --no-input --disable-pip-version-check --only-binary=:all: \
            --require-hashes --no-cache-dir -q \
            --dest "$STAGE_SCRATCH/wheels" -r requirements-voice-arm64-hashed.lock \
            > "$STAGE_SCRATCH/download.log" 2>&1 || {
              echo "STAGING_PINNED_DOWNLOAD=blocked"; exit 2;
            }
          /usr/bin/python3 - <<'PY'
          import hashlib,json,os,pathlib
          base=pathlib.Path(os.environ["STAGE_SCRATCH"])
          lock=json.loads((base/"config/voice_arm64_cp312_wheels.lock.json").read_text())
          expected={row["filename"]:row["sha256"] for row in lock["wheels"]}
          observed={p.name:hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in (base/"wheels").iterdir() if p.is_file() and not p.is_symlink()}
          assert len(expected)==len(observed)==28 and observed==expected,"wheel digests mismatch"
          assert any(name.startswith("av-18.") for name in observed), "PyAV 18 required"
          print("STAGING_PINNED_WHEELS=28-sha256-matched")
          PY
      - name: Install pinned wheels into temporary venv and import six modules only
        shell: bash
        env:
          PIP_NO_INPUT: "1"
          PIP_NO_CACHE_DIR: "1"
          PYTHONDONTWRITEBYTECODE: "1"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          cd "$STAGE_SCRATCH"
          export HOME="$STAGE_SCRATCH/home"
          export XDG_CACHE_HOME="$STAGE_SCRATCH/cache"
          mkdir -m 700 "$HOME" "$XDG_CACHE_HOME"
          test -x "$STAGE_SCRATCH/venv/bin/python"
          timeout --signal=TERM --kill-after=3s 175s \
            "$STAGE_SCRATCH/venv/bin/python" -m pip install \
            -q --no-input --no-index --only-binary=:all: \
            --require-hashes --find-links "$STAGE_SCRATCH/wheels" \
            -r requirements-voice-arm64-hashed.lock \
            > "$STAGE_SCRATCH/install.log" 2>&1 || {
              echo "STAGING_EPHEMERAL_INSTALL=blocked"; exit 2;
            }
          timeout --signal=TERM --kill-after=3s 25s \
            "$STAGE_SCRATCH/venv/bin/python" -m pip check \
            > "$STAGE_SCRATCH/check.log" 2>&1 || {
              echo "STAGING_PIP_CHECK=blocked"; exit 2;
            }
          # Import six packages through separate resource-limited children.
          # Missing PortAudio is a known system-library BLOCKER and must be
          # visible without falsely claiming fully functional audio.
          timeout --signal=TERM --kill-after=3s 220s \
            "$STAGE_SCRATCH/venv/bin/python" -I \
            scripts/ventuno_native_voice_import_report.py
          echo "Native import probe never opens audio devices or creates models."

      - name: Clean isolated ARM64 wheelhouse and venv under RUNNER_TEMP only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          scratch="$STAGE_SCRATCH"
          case "$scratch" in
            "$RUNNER_TEMP"/myai-stt-native.*)
              if [ -d "$scratch" ] && [ ! -L "$scratch" ]; then rm -rf -- "$scratch"; fi
              ;;
            *) echo "Unexpected scratch directory; no deletion" ;;
          esac
          echo "STAGING_CLEANUP=disposable-only"
