name: VENTUNO one-pass QAIRT HTP V75 package metadata only
on:
  push:
    branches: [dev/ventuno-htp-v75-package-inventory-20261014]
    paths:
      - .github/workflows/ventuno-qairt-v75-package-readonly.yml
permissions:
  contents: read
concurrency:
  group: myai-qairt-v75-package-readonly-20261014
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: [self-hosted, Linux, ARM64, ventuno-q]
    timeout-minutes: 4
    steps:
      - name: Exact-commit package metadata without HTP, sudo or system changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          test "$(id -un)" = "arduino"
          test "$GITHUB_REF" = "refs/heads/dev/ventuno-htp-v75-package-inventory-20261014"
          scratch="$(mktemp -d "$RUNNER_TEMP/myai-qairt-v75.XXXXXX")"
          chmod 700 "$scratch"
          trap 'cd "$RUNNER_TEMP" && rm -rf -- "$scratch"' EXIT
          cd "$scratch"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          timeout --signal=TERM --kill-after=3s 30s /home/arduino/MyAI/.venv/bin/python -B -m scripts.ventuno_qairt_v75_package_readonly
          echo 'Only package/version and exact allowlisted file metadata inspected; no HTP/GenieX service action.'
