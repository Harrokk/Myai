name: VENTUNO tiny QNN HTP startup dependencies (read-only)
on:
  push:
    branches: [dev/ventuno-qnn-tiny-htp-feasibility-20261014]
    paths:
      - .github/workflows/ventuno-tiny-htp-startup-readonly.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: myai-ci-ventuno
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, ventuno-q]
    timeout-minutes: 3
    steps:
      - name: Fetch exact isolated source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(id -un)" = "arduino"
          mkdir -p "$RUNNER_TEMP/myai-qnn-readonly-elf"
          cd "$RUNNER_TEMP/myai-qnn-readonly-elf"
          git init -q
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Inspect only ELF headers and SDK skeleton presence
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/myai-qnn-readonly-elf"
          timeout --signal=TERM --kill-after=3s 45s /home/arduino/MyAI/.venv/bin/python -B -m scripts.ventuno_qnn_htp_startup_readonly
          echo 'No QNN process, model inference, audio or service changes.'
