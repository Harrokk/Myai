name: High-risk voice STT consensus safety (synthetic only)
on:
  push:
    branches: [dev/ventuno-voice-highrisk-exact-vote-20261014]
    paths:
      - .github/workflows/ventuno-highrisk-voice-stt-consensus-safety.yml
      - core/voice_pipeline.py
      - tests/test_voice_pipeline.py
permissions:
  contents: read
concurrency:
  group: myai-voice-stt-consensus-20261014
  cancel-in-progress: false
jobs:
  synthetic-voice-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Exact-SHA disposable hosted x86 checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          scratch="$(mktemp -d "$RUNNER_TEMP/myai-stt-vote.XXXXXX")"
          chmod 700 "$scratch"
          echo "MYAI_STT_VOTE_SCRATCH=$scratch" >> "$GITHUB_ENV"
          cd "$scratch"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install only pytest in a disposable host venv
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/myai-stt-vote-venv"
          "$RUNNER_TEMP/myai-stt-vote-venv/bin/python" -m pip install \
            --disable-pip-version-check --only-binary=:all: pytest==8.3.5
      - name: Voice safety regressions with fake STT/audio only
        shell: bash
        run: |
          set -euo pipefail
          cd "$MYAI_STT_VOTE_SCRATCH"
          "$RUNNER_TEMP/myai-stt-vote-venv/bin/python" -B -m pytest -q \
            tests/test_voice_pipeline.py
          echo 'No microphone, audio capture, QNN, model load, backend, device, or production changes.'
      - name: Remove disposable test data
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${MYAI_STT_VOTE_SCRATCH:-}" ]; then
            rm -rf -- "$MYAI_STT_VOTE_SCRATCH"
          fi
          rm -rf -- "$RUNNER_TEMP/myai-stt-vote-venv"
