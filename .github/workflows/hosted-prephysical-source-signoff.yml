name: MyAI prephysical source-only signoff (hosted ARM64, NO VENTUNO)

on:
  push:
    branches:
      - "dev/voice-prephysical-hosted-readiness-20261104"
    paths:
      - ".github/workflows/hosted-prephysical-source-signoff.yml"
      - "scripts/ci_prephysical_source_gate.py"
      - "tests/test_ci_prephysical_source_gate.py"
      - "docs/checkpoints/2026-11-04-prephysical-test-handoff.md"

permissions:
  contents: read

concurrency:
  group: myai-prephysical-hosted-source-signoff
  cancel-in-progress: true

jobs:
  hosted-source-signoff:
    name: Two-pass structural audit, source denial gate and manual-test handoff
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Reject any physical runner, untrusted branch, or non-ARM64 host
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test "$(uname -m)" = "aarch64"
          test "$GITHUB_REPOSITORY" = "Harrokk/Myai"
          test "$GITHUB_REF" = "refs/heads/dev/voice-prephysical-hosted-readiness-20261104"

      - name: Fetch exact SHA into disposable temporary checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/myai-prephysical-source"
          cd "$RUNNER_TEMP/myai-prephysical-source"
          git init -q
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout -q --force --detach FETCH_HEAD
          git remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Run independent repository structural passes and sensitive-call audit
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/myai-prephysical-source"
          python3 -B -m scripts.ventuno_deep_source_audit
          python3 -B -m scripts.ventuno_eight_sensitive_calls_review
          python3 -B scripts/static_repository_audit.py
          echo "HOSTED STRUCTURAL SOURCE AND REVIEWED CALLS: PASS"

      - name: Install isolated pinned source-test environment, never system packages
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/myai-prephysical-venv"
          "$RUNNER_TEMP/myai-prephysical-venv/bin/python" -m pip install \
            --disable-pip-version-check --only-binary=:all: \
            "pytest==8.3.5" "cryptography==45.0.7" \
            -r "$RUNNER_TEMP/myai-prephysical-source/requirements.txt"

      - name: Verify immutable source and explicitly denied physical consent
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/myai-prephysical-source"
          "$RUNNER_TEMP/myai-prephysical-venv/bin/python" -B \
            -m scripts.ci_prephysical_source_gate \
            --source-root . --expected-sha "$GITHUB_SHA"
          echo "SOURCE PREPHYSICAL HANDOFF GATE: PASS - NO AUDIO CONSENT"

      - name: Run source-only tests for voice, model identity and release gate
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/myai-prephysical-source"
          "$RUNNER_TEMP/myai-prephysical-venv/bin/python" -m pytest -q \
            tests/test_ci_prephysical_source_gate.py \
            tests/test_voice_verification.py \
            tests/test_voice_risk_policy.py \
            tests/test_voice_tier_authorization.py \
            tests/test_voice_dispatch_plan_binding.py \
            tests/test_voice_model_provenance.py \
            tests/test_ventuno_physical_pilot_gate.py \
            tests/test_ventuno_big_test_readiness.py \
            tests/test_config_validation.py

      - name: Destroy temporary checkout and venv, no hardware or artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/myai-prephysical-source" \
                    "$RUNNER_TEMP/myai-prephysical-venv"
          echo "No model weights, microphone, USB or VENTUNO were touched."

      - name: Document strict source-only authorization limit
        if: always()
        shell: bash
        run: |
          echo "## MyAI OFF-HOST source readiness, not physical execution consent" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact source SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Runs on disposable GITHUB-HOSTED ARM64 only; never the Arduino VENTUNO." >> "$GITHUB_STEP_SUMMARY"
          echo "Physical read-only metadata gate must be separately run by operator before any consented audio." >> "$GITHUB_STEP_SUMMARY"
          echo "No microphone, playback, model inference, Geniex, HTP/NPU, services, production config, local packages or board runner." >> "$GITHUB_STEP_SUMMARY"
          echo "Risk-tiered voice and critical execution remain hard-blocked. No merge, release or hardware test authorized." >> "$GITHUB_STEP_SUMMARY"
