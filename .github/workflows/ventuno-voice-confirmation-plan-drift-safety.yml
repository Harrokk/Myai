name: Voice confirmation plan-drift synthetic safety
on:
  push:
    branches: [dev/ventuno-voice-confirmation-plan-drift-nogo-20261015]
    paths:
      - .github/workflows/ventuno-voice-confirmation-plan-drift-safety.yml
      - core/voice_pipeline.py
      - tests/test_voice_pipeline.py
permissions:
  contents: read
concurrency:
  group: myai-voice-plan-drift-20261015
  cancel-in-progress: false
jobs:
  fake-tool-plan-and-stt:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout exact SHA into isolated temporary host directory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          scratch="$(mktemp -d "$RUNNER_TEMP/myai-voice-plan-drift.XXXXXX")"
          chmod 700 "$scratch"
          echo "MYAI_VOICE_DRIFT_SCRATCH=$scratch" >> "$GITHUB_ENV"
          cd "$scratch"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install pinned pytest in disposable x86 venv
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/myai-voice-plan-drift-venv"
          "$RUNNER_TEMP/myai-voice-plan-drift-venv/bin/python" -m pip install \
            --disable-pip-version-check --only-binary=:all: pytest==8.3.5
      - name: Run fake recognizer and mutable tool-plan tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$MYAI_VOICE_DRIFT_SCRATCH"
          "$RUNNER_TEMP/myai-voice-plan-drift-venv/bin/python" -B -m pytest -q tests/test_voice_pipeline.py
          echo 'No microphones, USB audio, QNN, hosted AI inference, tool actions, model data or production changes.'
      - name: Remove disposable test artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${MYAI_VOICE_DRIFT_SCRATCH:-}" ]; then
            rm -rf -- "$MYAI_VOICE_DRIFT_SCRATCH"
          fi
          rm -rf -- "$RUNNER_TEMP/myai-voice-plan-drift-venv"
