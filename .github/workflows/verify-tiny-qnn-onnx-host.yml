name: Verify tiny QNN ONNX fixture on isolated host

on:
  workflow_dispatch:
  push:
    branches:
      - dev/routing-boundary-followup
    paths:
      - .github/workflows/verify-tiny-qnn-onnx-host.yml
      - scripts/prepare_tiny_qnn_host_sample.py
      - scripts/verify_tiny_qnn_host_sample.py
      - tests/test_prepare_tiny_qnn_host_sample.py
      - tests/test_verify_tiny_qnn_host_sample.py
      - scripts/qairt_host_toolchain_preflight.py
      - tests/test_qairt_host_toolchain_preflight.py

permissions:
  contents: read

concurrency:
  group: tiny-qnn-host-onnx
  cancel-in-progress: true

jobs:
  validate:
    name: Build and validate ONNX on separate x86_64 runner
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Fetch exact commit without repository or model cache access
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          mkdir -p "$RUNNER_TEMP/tiny-qnn-checkout"
          cd "$RUNNER_TEMP/tiny-qnn-checkout"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --force --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Create isolated Python environment with pinned ONNX dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/tiny-qnn-venv"
          "$RUNNER_TEMP/tiny-qnn-venv/bin/python" -m pip install \
            --disable-pip-version-check --only-binary=:all: \
            numpy==1.26.4 onnx==1.17.0 onnxruntime==1.20.1 pytest==8.3.5

      - name: Execute ONNX checker and independent CPU numerical tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/tiny-qnn-checkout"
          "$RUNNER_TEMP/tiny-qnn-venv/bin/python" -m pytest -q \
            tests/test_prepare_tiny_qnn_host_sample.py \
            tests/test_verify_tiny_qnn_host_sample.py \
            tests/test_qairt_host_toolchain_preflight.py

      - name: Generate and independently validate test model
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/tiny-qnn-checkout"
          "$RUNNER_TEMP/tiny-qnn-venv/bin/python" \
            -m scripts.prepare_tiny_qnn_host_sample \
            --output-dir "$RUNNER_TEMP/tiny_qnn_fixture"
          "$RUNNER_TEMP/tiny-qnn-venv/bin/python" \
            -m scripts.verify_tiny_qnn_host_sample \
            --fixture-dir "$RUNNER_TEMP/tiny_qnn_fixture"
          test ! -e "$RUNNER_TEMP/tiny_qnn_fixture/context.bin"
          test ! -e "$RUNNER_TEMP/tiny_qnn_fixture/htp-profile.bin"

      - name: Test QAIRT host SDK readiness without installing SDK
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/tiny-qnn-checkout"
          "$RUNNER_TEMP/tiny-qnn-venv/bin/python" \
            -m scripts.qairt_host_toolchain_preflight \
            --sdk-root "$RUNNER_TEMP/not-installed-qairt-sdk" \
            --fixture-dir "$RUNNER_TEMP/tiny_qnn_fixture" \
            --host linux

      - name: Encode only the verified synthetic fixture for manual transfer
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/tiny-qnn-venv/bin/python" - <<'PY'
          import base64
          import hashlib
          import io
          import os
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          root = Path(os.environ["RUNNER_TEMP"]) / "tiny_qnn_fixture"
          allowed = ("tiny_qdq_conv.onnx", "input.raw",
                     "input_list.txt", "fixture_metadata.json")
          buffer = io.BytesIO()
          with ZipFile(buffer, "w", compression=ZIP_DEFLATED) as zipped:
              for name in allowed:
                  path = root / name
                  if not path.is_file() or path.is_symlink() or path.stat().st_size > 128 * 1024:
                      raise RuntimeError("unsafe-or-unverified-sample")
                  zipped.write(path, arcname=name)
          binary = buffer.getvalue()
          if len(binary) > 16384:
              raise RuntimeError("sample-archive-too-large")
          print("SYNTHETIC_QNN_HOST_ZIP_SHA256:", hashlib.sha256(binary).hexdigest())
          print("SYNTHETIC_QNN_HOST_ZIP_BASE64_START")
          print(base64.b64encode(binary).decode("ascii"))
          print("SYNTHETIC_QNN_HOST_ZIP_BASE64_END")
          print("Host archive is ONNX-only; not a QNN runtime context.")
          PY

      - name: Print fail-closed scope
        shell: bash
        run: |
          echo 'ONNX checker plus CPU reference only; no QNN SDK or NPU used.'
          echo 'The artifact must be QAIRT-converted and revalidated separately.'
          echo 'No model contexts or services on VENTUNO Q were touched.'
