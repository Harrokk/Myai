name: MyAI single consented VENTUNO acoustic metadata voice smoke 2026-10-23

on:
  push:
    branches: [dev/ventuno-consented-acoustic-metadata-smoke-20261023]
    paths:
      - .github/workflows/ventuno-consented-acoustic-metadata-smoke-20261023.yml

permissions:
  contents: read

concurrency:
  group: ventuno-one-shot-acoustic-metadata-2026-10-23
  cancel-in-progress: false

jobs:
  dialogue:
    # One real audio attempt is authorized only by this conversation,
    # on the SINGLE specifically named commit-message push. Never on rerun.
    if: github.run_attempt == 1 && github.event.before == '4171ca49d29df6a627c8bc5a3ae06c0f8ec4b29f' && github.event.head_commit.message == 'Authorize one acoustic-metadata 3s USB dialogue on VENTUNO Q 2026-10-23'
    name: Single 3s Swedish question with bounded PCM metadata and capped answer
    runs-on: [self-hosted, Linux, ARM64, ventuno-q]
    timeout-minutes: 20
    steps:
      - name: Checkout exact authorized source into isolated runner temporary root
        shell: bash
        env:
          MYAI_FROZEN_SOURCE_SHA: 029679ea5e10a97e867aa1db6e09bc3bcdeac3d1
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          test "$(id -un)" = "arduino"
          test "$(id -u)" -ne 0
          test "$GITHUB_REF_NAME" = "dev/ventuno-consented-acoustic-metadata-smoke-20261023"
          test -n "${RUNNER_TEMP:-}"
          work="$(mktemp -d "$RUNNER_TEMP/myai-usb-dialog-XXXXXXXX")"
          chmod 0700 "$work"
          echo "MYAI_DIALOG_WORK=$work" >> "$GITHUB_ENV"
          mkdir -p "$work/source"
          git init -q "$work/source"
          git -C "$work/source" remote add origin "https://github.com/Harrokk/Myai.git"
          git -C "$work/source" fetch --quiet --depth=1 origin "$MYAI_FROZEN_SOURCE_SHA"
          git -C "$work/source" checkout -q --detach FETCH_HEAD
          test "$(git -C "$work/source" rev-parse HEAD)" = "$MYAI_FROZEN_SOURCE_SHA"
          test -z "$(git -C "$work/source" status --porcelain --untracked-files=no)"
          echo "NEW ONE-USE AUDIO CONSENT 2026-10-23: one 3s recording, one short capped reply, frozen source $MYAI_FROZEN_SOURCE_SHA"

      - name: Run all one-shot dialog and USB driver regression tests with mocked audio
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          cd "$MYAI_DIALOG_WORK/source"
          /home/arduino/MyAI/.venv/bin/python -m pytest -q -p no:cacheprovider \
            tests/test_ventuno_usb_dialogue_once.py \
            tests/test_ventuno_usb_dialogue_hardware.py \
            tests/test_ventuno_usb_voice_dialog_readiness.py \
            tests/test_ventuno_usb_speaker_smoke.py \
            tests/test_ventuno_usb_audio_inventory.py
          echo "All safety tests use synthetic samples; no physical audio opened."

      - name: Check actual USB audio identity, active services and 8GiB RAM reserve
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          cd "$MYAI_DIALOG_WORK/source"
          /home/arduino/MyAI/.venv/bin/python - <<'PY'
          from pathlib import Path
          from scripts.ventuno_usb_voice_dialog_readiness import inspect
          import os
          report = inspect(disk_root=Path(os.environ["MYAI_DIALOG_WORK"]))
          print("Pre-staging local hardware readiness:", report["status"],
                "memory mib:", report["ram_available_mib"],
                "disk mib:", report["disk_available_mib"])
          assert report["status"] == "ready-for-separate-consented-dialogue-test"
          assert report["microphone_opened"] is False
          assert report["speaker_opened"] is False
          PY

      - name: Stage only verified ARM64 Whisper libraries in new temporary environment
        shell: bash
        run: |
          set -euo pipefail
          cd "$MYAI_DIALOG_WORK/source"
          PY="$(readlink -f "$(command -v python3)")"
          test -x "$PY"
          "$PY" -m venv "$MYAI_DIALOG_WORK/myai-voice-staging"
          /home/arduino/MyAI/.venv/bin/python -m scripts.ventuno_stt_wheel_preflight \
            --runner-temp "$MYAI_DIALOG_WORK"
          /home/arduino/MyAI/.venv/bin/python -m scripts.ventuno_stt_import_staging \
            --runner-temp "$MYAI_DIALOG_WORK"

      - name: Fetch and verify pinned publicly licensed Swedish speech fixture
        shell: bash
        run: |
          set -euo pipefail
          cd "$MYAI_DIALOG_WORK/source"
          /home/arduino/MyAI/.venv/bin/python -m scripts.ventuno_swedish_reference_audio \
            --runner-temp "$MYAI_DIALOG_WORK"

      - name: Verify pinned Whisper Tiny CPU model before user audio is accessed
        shell: bash
        run: |
          set -euo pipefail
          cd "$MYAI_DIALOG_WORK/source"
          /home/arduino/MyAI/.venv/bin/python - <<'PY'
          import os
          from pathlib import Path
          from scripts.ventuno_whisper_tiny_cpu_smoke import smoke
          base = Path(os.environ["MYAI_DIALOG_WORK"])
          result = smoke(base / "myai-voice-staging/bin/python", base)
          allowed = result.get("status") == "tiny-sv-cpu-word-and-silence-verified"
          print("Pinned offline Swedish Whisper CPU preflight:", allowed)
          assert allowed
          assert result["model_files_verified"] is True
          assert result["cpu_inference_verified"] is True
          assert result["microphone_used"] is False
          PY

      - name: Stage Swedish offline eSpeak and verify WAV without physical audio
        shell: bash
        run: |
          set -euo pipefail
          cd "$MYAI_DIALOG_WORK/source"
          /home/arduino/MyAI/.venv/bin/python - <<'PY'
          import os
          from pathlib import Path
          from scripts.ventuno_tts_temp_stage import stage_sweden_tts
          root = Path(os.environ["MYAI_DIALOG_WORK"])
          report = stage_sweden_tts(root / "myai-tts-espeak-stage", root)
          success = report.get("status") == "isolated-swedish-tts-signal-verified"
          print("Offline temporary Swedish synthesis verified:", success)
          assert success
          assert report["physical_playback_verified"] is False
          assert report["services_changed"] is False
          PY

      - name: Final checks before spoken cue - USB, model, RAM and services
        shell: bash
        run: |
          set -euo pipefail
          cd "$MYAI_DIALOG_WORK/source"
          /home/arduino/MyAI/.venv/bin/python - <<'PY'
          import os
          from pathlib import Path
          from scripts.ventuno_usb_voice_dialog_readiness import inspect
          from scripts.ventuno_usb_dialogue_hardware import _preflight
          root = Path(os.environ["MYAI_DIALOG_WORK"])
          report = inspect(disk_root=root)
          print("Final live audio safety readiness:", report["status"])
          assert report["status"] == "ready-for-separate-consented-dialogue-test"
          _preflight(root)
          print("Exactly one audible spoken cue then 3s recording allowed.")
          PY

      - name: Verify EXACT new cue can render in RAM on real board below 3.5 seconds
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: |
          set -euo pipefail
          cd "$MYAI_DIALOG_WORK/source"
          /home/arduino/MyAI/.venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          from scripts.ventuno_tts_temp_stage import espeak_paths
          from scripts.ventuno_usb_dialogue_hardware import (
              SPOKEN_START_CUE, _preflight,
          )
          from scripts.ventuno_usb_speaker_smoke import (
              quiet_wav_from_tts, MAX_DURATION_SECONDS,
          )
          root=Path(os.environ["MYAI_DIALOG_WORK"])
          _preflight(root)
          stage=root/"myai-tts-espeak-stage"
          exe,data=espeak_paths(stage)
          assert exe is not None and data is not None
          env=os.environ.copy()
          env["LD_LIBRARY_PATH"]=(
              str(stage/"extracted/usr/lib/aarch64-linux-gnu")
              + os.pathsep + env.get("LD_LIBRARY_PATH","")
          )
          rendered=subprocess.run(
              [str(exe),"--path="+str(data.parent),
               "-v","sv","--stdout",SPOKEN_START_CUE],
              cwd=stage,env=env,check=False,
              stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=9,
          )
          if rendered.returncode:
              raise SystemExit("BLOCKED: exact cue could not be rendered locally")
          safe,metrics=quiet_wav_from_tts(rendered.stdout)
          if safe is None or metrics["duration_seconds"]>MAX_DURATION_SECONDS:
              raise SystemExit("BLOCKED: real-board cue exceeds audio policy")
          print("Actual board generated cue preflight PASS (not played):",
                json.dumps({
                    "cue_seconds":metrics["duration_seconds"],
                    "safe_digital_peak_fraction":metrics["limited_peak_fraction"],
                    "max_duration_seconds":MAX_DURATION_SECONDS,
                    "no_microphone_or_speaker_opened":True,
                },sort_keys=True))
          PY

      - name: ONE consented spoken cue then 3s USB recording and capped reply
        id: dialogue
        shell: bash
        run: |
          set -euo pipefail
          cd "$MYAI_DIALOG_WORK/source"
          /home/arduino/MyAI/.venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path
          import array
          import math
          import sys
          import time
          from scripts import ventuno_usb_dialogue_hardware as hardware
          acoustic = {}
          original_build_ports = hardware.build_ports
          def instrumented_build_ports(root, *, response_backend="geniex"):
              ports = original_build_ports(root, response_backend=response_backend)
              original_capture = ports.capture
              def measured_capture():
                  started = time.monotonic()
                  try:
                      pcm = original_capture()
                  finally:
                      elapsed = time.monotonic() - started
                      acoustic["capture_wall_band"] = (
                          "under-3s" if elapsed < 3
                          else "3-to-3.5s" if elapsed < 3.5
                          else "3.5-to-4s" if elapsed < 4
                          else "4-to-5s" if elapsed < 5
                          else "over-5s"
                      )
                  if len(pcm) == 96000:
                      samples = array.array("h")
                      samples.frombytes(pcm)
                      if sys.byteorder != "little":
                          samples.byteswap()
                      def level_band(section):
                          rms = math.sqrt(
                              sum(int(v) * int(v) for v in section) / len(section)
                          ) / 32768
                          return ("below-0.001" if rms < 0.001 else
                                  "0.001-to-0.005" if rms < 0.005 else
                                  "0.005-to-0.02" if rms < 0.02 else
                                  "0.02-to-0.08" if rms < 0.08 else
                                  "above-0.08")
                      acoustic["one_second_level_bands"] = [
                          level_band(samples[i * 16000:(i + 1) * 16000])
                          for i in range(3)
                      ]
                  return pcm
              ports.capture = measured_capture
              return ports
          hardware.build_ports = instrumented_build_ports
          result = hardware.run_one_authorized_hardware_dialog(
              Path(os.environ["MYAI_DIALOG_WORK"]),
              consent_to_record=True,
              consent_to_play=True,
          )
          # Only coarse categorical PCM levels and command outcomes leave RAM.
          result["bounded_audio_diagnostics"] = acoustic
          print("ONE-TIME USB voice result:", json.dumps(result, sort_keys=True))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("dialogue_result=" + str(result["status"]) + "\n")
          if result["status"] != "one-shot-usb-dialogue-alsa-playback-completed":
              raise SystemExit(2)
          PY

      - name: Confirm MyAI and GenieX and securely remove only isolated workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          systemctl is-active --quiet myai-geniex.service
          systemctl is-active --quiet myai-ventuno.service
          if [ -n "${MYAI_DIALOG_WORK:-}" ] && [ -n "${RUNNER_TEMP:-}" ]; then
            case "$MYAI_DIALOG_WORK" in
              "$RUNNER_TEMP"/myai-usb-dialog-*)
                if [ -d "$MYAI_DIALOG_WORK" ] && [ ! -L "$MYAI_DIALOG_WORK" ]; then
                  rm -rf -- "$MYAI_DIALOG_WORK"
                fi
                ;;
              *) echo "Refusing unsafe temp cleanup" >&2; exit 1 ;;
            esac
          fi
          echo "No WAV, user transcript, Whisper model or other speech data kept."
          echo "No active MyAI or GenieX services/configuration changed."
