name: VENTUNO GenieX FastRPC concurrency gate metadata only
on:
  push:
    branches: [dev/ventuno-htp-geniex-fastrpc-unknown-nogo-20261014]
    paths:
      - .github/workflows/ventuno-geniex-htp-concurrency-readonly.yml
permissions:
  contents: read
concurrency:
  group: myai-geniex-htp-concurrency-20261014
  cancel-in-progress: false
jobs:
  read-only:
    runs-on: [self-hosted, Linux, ARM64, ventuno-q]
    timeout-minutes: 4
    steps:
      - name: Exact commit and bounded proc-only inspection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          test "$(id -un)" = "arduino"
          test "$GITHUB_REF" = "refs/heads/dev/ventuno-htp-geniex-fastrpc-unknown-nogo-20261014"
          scratch="$(mktemp -d "$RUNNER_TEMP/myai-geniex-gate.XXXXXX")"
          chmod 700 "$scratch"
          trap 'cd "$RUNNER_TEMP" && rm -rf -- "$scratch"' EXIT
          cd "$scratch"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          timeout --signal=TERM --kill-after=3s 30s /home/arduino/MyAI/.venv/bin/python -B -m scripts.ventuno_geniex_htp_concurrency_gate_readonly
          echo 'No qnn-net-run, device opens, firmware, models, audio or production changes.'
