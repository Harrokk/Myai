name: VENTUNO legacy HTP DSP selector parity metadata only
on:
  push:
    branches: [dev/ventuno-htp-dsp-selector-parity-20261014]
    paths:
      - .github/workflows/ventuno-htp-selector-parity-readonly.yml
permissions:
  contents: read
concurrency:
  group: myai-htp-selector-parity-20261014
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, ventuno-q]
    timeout-minutes: 4
    steps:
      - name: Compare only legacy picker inode to official packaged Skel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          test "$(id -un)" = "arduino"
          test "$GITHUB_REF" = "refs/heads/dev/ventuno-htp-dsp-selector-parity-20261014"
          scratch="$(mktemp -d "$RUNNER_TEMP/myai-htp-selector.XXXXXX")"
          chmod 700 "$scratch"
          trap 'cd "$RUNNER_TEMP" && rm -rf -- "$scratch"' EXIT
          cd "$scratch"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          timeout --signal=TERM --kill-after=3s 35s /home/arduino/MyAI/.venv/bin/python -B -m scripts.ventuno_htp_dsp_selector_parity_readonly
          echo 'Only stat/resolve and path selection; no model, DSP device, QNN, audio or service activity.'
