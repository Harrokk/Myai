name: Try isolated QAIRT 2.45 host ONNX conversion

on:
  workflow_dispatch:
  push:
    branches:
      - dev/routing-boundary-followup
    paths:
      - .github/workflows/qairt-245-host-conversion.yml
      - scripts/qairt_245_host_conversion_trial.py
      - tests/test_qairt_245_host_conversion_trial.py
      - scripts/qairt_245_host_dlc_info.py
      - tests/test_qairt_245_host_dlc_info.py
      - scripts/qairt_245_cpu_reference_trial.py
      - tests/test_qairt_245_cpu_reference_trial.py
      - scripts/prepare_qairt245_native_fixture.py

permissions:
  contents: read

concurrency:
  group: qairt-245-isolated-host-conversion
  cancel-in-progress: true

jobs:
  trial:
    name: Convert verified tiny ONNX with official QAIRT 2.45, no device
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact commit on x86_64 Ubuntu
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          mkdir -p "$RUNNER_TEMP/myai-qairt-trial"
          cd "$RUNNER_TEMP/myai-qairt-trial"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --force --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Resolve Python 3.10 with its matching shared library on host
        shell: bash
        run: |
          set -euo pipefail
          PY310=""
          for candidate in /opt/hostedtoolcache/Python/3.10.*/x64/bin/python3.10; do
            if test -x "$candidate"; then
              PY310="$candidate"
              break
            fi
          done
          if test -z "$PY310" && command -v python3.10 >/dev/null 2>&1; then
            PY310="$(command -v python3.10)"
          fi
          if test -z "$PY310" && command -v uv >/dev/null 2>&1; then
            uv python install 3.10
            PY310="$(uv python find 3.10)"
          fi
          test -n "$PY310" || { echo 'No Python 3.10 on isolated host'; exit 2; }
          "$PY310" -c 'import sys; assert sys.version_info[:2] == (3, 10)'
          PYLIB="$("$PY310" -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR") or "")')"
          test -f "$PYLIB/libpython3.10.so.1.0" || {
            echo 'Python 3.10 shared library missing'; exit 2;
          }
          echo "QAIRT_HOST_PY310=$PY310" >> "$GITHUB_ENV"
          echo "QAIRT_HOST_PYLIB=$PYLIB" >> "$GITHUB_ENV"
          echo "Python 3.10 and required libpython3.10.so.1.0 confirmed."

      - name: Set up separate Python host validation environment
        shell: bash
        run: |
          set -euo pipefail
          "$QAIRT_HOST_PY310" -m venv "$RUNNER_TEMP/qairt-host-venv"
          "$RUNNER_TEMP/qairt-host-venv/bin/python" -m pip install \
            --disable-pip-version-check --only-binary=:all: \
            numpy==1.26.4 onnx==1.17.0 onnxruntime==1.20.1 pytest==8.3.5 \
            PyYAML==6.0.2 scipy==1.11.4 onnxsim==0.4.36 \
            pandas==2.2.3 psutil==6.1.1 tabulate==0.9.0 tqdm==4.67.1
          cd "$RUNNER_TEMP/myai-qairt-trial"
          "$RUNNER_TEMP/qairt-host-venv/bin/python" -m pytest -q \
            tests/test_qairt_245_host_conversion_trial.py \
            tests/test_fetch_qairt_245_official.py \
            tests/test_qairt_245_archive_audit.py \
            tests/test_prepare_tiny_qnn_host_sample.py \
            tests/test_verify_tiny_qnn_host_sample.py \
            tests/test_qairt_245_host_dlc_info.py \
            tests/test_qairt_245_cpu_reference_trial.py

      - name: Verify LLVM C++ runtime on disposable Ubuntu host
        shell: bash
        run: |
          set -euo pipefail
          if ! ldconfig -p | grep -Fq 'libc++.so.1'; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
              libc++1-18 libc++abi1-18
          fi
          ldconfig -p | grep -Fq 'libc++.so.1' || {
            echo 'LLVM C++ runtime unavailable on isolated build host'
            exit 2
          }
          echo 'Required libpython3.10 and libc++.so.1 libraries are present.'

      - name: Generate and verify fixed ONNX model with CPU reference
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/myai-qairt-trial"
          "$RUNNER_TEMP/qairt-host-venv/bin/python" -m scripts.prepare_tiny_qnn_host_sample \
            --output-dir "$RUNNER_TEMP/tiny_qnn_fixture"
          "$RUNNER_TEMP/qairt-host-venv/bin/python" -m scripts.verify_tiny_qnn_host_sample \
            --fixture-dir "$RUNNER_TEMP/tiny_qnn_fixture"

      - name: Download official SDK and confirm previously observed ZIP identity
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/myai-qairt-trial"
          "$RUNNER_TEMP/qairt-host-venv/bin/python" -m scripts.fetch_qairt_245_official \
            --output "$RUNNER_TEMP/qairt_245.zip"
          "$RUNNER_TEMP/qairt-host-venv/bin/python" -m scripts.qairt_245_archive_audit \
            --zip "$RUNNER_TEMP/qairt_245.zip"
          "$RUNNER_TEMP/qairt-host-venv/bin/python" - <<'PY'
          from pathlib import Path
          from scripts.qairt_245_archive_audit import inspect_archive
          import os
          p = Path(os.environ["RUNNER_TEMP"]) / "qairt_245.zip"
          report = inspect_archive(p)
          expected = "ffa6a5d6eb0be2846de2fa4fbeb1389ef91a1b92ef894cdcd38cad66ed7ccab7"
          assert report["status"] == "host-conversion-components-in-official-archive"
          assert report["archive_sha256"] == expected, "archive identity changed"
          print("Official QAIRT archive matches tested SHA-256.")
          PY

      - name: Extract validated SDK only on disposable x86 runner
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/myai-qairt-trial"
          "$RUNNER_TEMP/qairt-host-venv/bin/python" - <<'PY'
          import os
          import shutil
          from pathlib import Path
          from zipfile import ZipFile
          root = Path(os.environ["RUNNER_TEMP"])
          if shutil.disk_usage(root).free < 5_000_000_000:
              raise RuntimeError("insufficient space for SDK extraction")
          dest = root / "qairt-extracted"
          dest.mkdir(mode=0o700)
          with ZipFile(root / "qairt_245.zip") as archive:
              archive.extractall(dest)
          sdk = dest / "qairt" / "2.45.0.260326"
          assert sdk.is_dir(), "expected QAIRT versioned SDK root absent"
          print("Verified QAIRT 2.45 SDK extracted in isolated runner temp only.")
          PY

      - name: Try QNN source and DLC conversion on host only
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/myai-qairt-trial"
          "$RUNNER_TEMP/qairt-host-venv/bin/python" -m scripts.qairt_245_host_conversion_trial \
            --sdk-root "$RUNNER_TEMP/qairt-extracted/qairt/2.45.0.260326" \
            --fixture-dir "$RUNNER_TEMP/tiny_qnn_fixture" \
            --output-dir "$RUNNER_TEMP/tiny_qnn_converted"
          echo 'Any output is host-only and has not been verified as a valid HTP context.'

      - name: Read exact synthetic DLC with Qualcomm official qairt-dlc-info
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/myai-qairt-trial"
          "$RUNNER_TEMP/qairt-host-venv/bin/python" -m scripts.qairt_245_host_dlc_info \
            --sdk-root "$RUNNER_TEMP/qairt-extracted/qairt/2.45.0.260326" \
            --dlc "$RUNNER_TEMP/tiny_qnn_converted/tiny_qdq_conv.dlc"
          echo 'Native DLC parser only; no HTP context generated or model executed.'

      - name: Prepare exact native UFXP8 input for isolated CPU-only run
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/myai-qairt-trial"
          "$RUNNER_TEMP/qairt-host-venv/bin/python" -m scripts.prepare_qairt245_native_fixture \
            --fixture-dir "$RUNNER_TEMP/tiny_qnn_fixture" \
            --output-dir "$RUNNER_TEMP/tiny_qnn_native"

      - name: Compare QNN CPU DLC output to independent ONNX CPU result
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/myai-qairt-trial"
          "$RUNNER_TEMP/qairt-host-venv/bin/python" -m scripts.qairt_245_cpu_reference_trial \
            --sdk-root "$RUNNER_TEMP/qairt-extracted/qairt/2.45.0.260326" \
            --dlc "$RUNNER_TEMP/tiny_qnn_converted/tiny_qdq_conv.dlc" \
            --fixture-dir "$RUNNER_TEMP/tiny_qnn_fixture" \
            --native-dir "$RUNNER_TEMP/tiny_qnn_native" \
            --output-dir "$RUNNER_TEMP/tiny_qnn_cpu_output"
          echo 'CPU-only QNN checked; no VENTUNO Q inference or service changes.'

      - name: Inspect and preserve only bounded synthetic DLC as Base64
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/qairt-host-venv/bin/python" - <<'PY'
          import base64
          import hashlib
          import os
          from pathlib import Path
          from zipfile import is_zipfile, ZipFile
          p = Path(os.environ["RUNNER_TEMP"]) / "tiny_qnn_converted" / "tiny_qdq_conv.dlc"
          if p.is_symlink() or not p.is_file():
              raise RuntimeError("synthetic DLC not generated")
          n = p.stat().st_size
          if not 512 <= n <= 65536:
              raise RuntimeError("synthetic DLC outside size cap")
          data = p.read_bytes()
          if data.startswith(b"\\x7fELF"):
              raise RuntimeError("SDK executable must never be treated as DLC")
          print("SYNTHETIC_QNN_DLC_SIZE:", n)
          print("SYNTHETIC_QNN_DLC_SHA256:", hashlib.sha256(data).hexdigest())
          print("SYNTHETIC_QNN_DLC_ZIP:", is_zipfile(p))
          if is_zipfile(p):
              with ZipFile(p) as archive:
                  print("SYNTHETIC_QNN_DLC_ZIP_ENTRY_COUNT:", len(archive.namelist()))
          print("SYNTHETIC_QNN_DLC_BASE64_START")
          print(base64.b64encode(data).decode("ascii"))
          print("SYNTHETIC_QNN_DLC_BASE64_END")
          print("This is only the synthetic compiled model, not the QAIRT SDK.")
          PY

      - name: Delete official SDK and converter outputs
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/qairt-extracted" "$RUNNER_TEMP/tiny_qnn_converted" "$RUNNER_TEMP/tiny_qnn_cpu_output"
          rm -f "$RUNNER_TEMP/qairt_245.zip"
          echo 'Official SDK removed from ephemeral runner; no redistribution.'
          echo 'VENTUNO systemd services and production model were not touched.'
