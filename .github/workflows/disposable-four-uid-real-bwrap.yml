name: Disposable four-UID verifier real Bubblewrap Ed25519
on:
  push:
    branches: [dev/manual-audit-four-uid-real-bwrap-attestation-20261018]
    paths:
      - scripts/test_hosted_four_uid_real_bwrap.py
      - tests/test_hosted_four_uid_real_bwrap_source.py
      - .github/workflows/disposable-four-uid-real-bwrap.yml
      - docs/security/disposable-four-uid-real-bwrap.md
      - core/selfdev_bwrap_observation.py
      - core/selfdev_unix_peercred.py
      - core/selfdev_signed_evidence.py
      - core/selfdev_attestation_replay.py

permissions:
  contents: read

jobs:
  four-uid-real-bwrap:
    name: OS peer credentials, real bwrap and verifier-UID-only signature
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Confirm temporary GitHub-hosted x86 runner
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test "$(uname -m)" = "x86_64"
          test "$(id -u)" -ne 0

      - name: Checkout exact Git revision into private temp directory
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d "$RUNNER_TEMP/myai-fouruid-bwrap-XXXXXXXX")"
          chmod 700 "$root"
          echo "MYAI_FOUR_UID_CHECKOUT=$root" >> "$GITHUB_ENV"
          git init -q "$root"
          git -C "$root" remote add origin "https://github.com/Harrokk/Myai.git"
          git -C "$root" fetch -q --depth=1 origin "$GITHUB_SHA"
          git -C "$root" checkout -q --detach FETCH_HEAD
          test "$(git -C "$root" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install required unprivileged Bubblewrap package on disposable VM
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends bubblewrap
          test -x /usr/bin/bwrap
          test -x /usr/bin/python3
          # NEVER change AppArmor, kernel userns rules or fallback to host tests.

      - name: Stage only public test modules in an accessible temporary directory
        shell: bash
        run: |
          set -euo pipefail
          public="$(mktemp -d /tmp/myai-fouruid-public-XXXXXXXX)"
          chmod 0755 "$public"
          echo "MYAI_FOUR_UID_PUBLIC=$public" >> "$GITHUB_ENV"
          mkdir -p "$public/core" "$public/scripts"
          chmod 0755 "$public/core" "$public/scripts"
          for module in selfdev_bounded_runner.py selfdev_bwrap_observation.py \
              selfdev_unix_peercred.py selfdev_signed_evidence.py \
              selfdev_attestation_replay.py; do
            cp "$MYAI_FOUR_UID_CHECKOUT/core/$module" "$public/core/$module"
            chmod 0644 "$public/core/$module"
          done
          if [ -f "$MYAI_FOUR_UID_CHECKOUT/core/__init__.py" ]; then
            cp "$MYAI_FOUR_UID_CHECKOUT/core/__init__.py" "$public/core/__init__.py"
            chmod 0644 "$public/core/__init__.py"
          fi
          cp "$MYAI_FOUR_UID_CHECKOUT/scripts/test_hosted_four_uid_real_bwrap.py" \
            "$public/scripts/test_hosted_four_uid_real_bwrap.py"
          chmod 0644 "$public/scripts/test_hosted_four_uid_real_bwrap.py"
          python3 -m venv "$public/venv"
          "$public/venv/bin/python" -m pip install \
            --disable-pip-version-check --only-binary=:all: \
            "cryptography==45.0.7"

      - name: Exercise four numeric UIDs with real verifier-run Bubblewrap
        shell: bash
        run: |
          set -euo pipefail
          cd "$MYAI_FOUR_UID_PUBLIC"
          # Only public reviewed test modules/venv are accessible to all UIDs.
          # The exact-SHA source checkout stays private to the hosted runner.
          # Verifier-owned private fixture and updater ledger are separate.
          # Only temporary hosted VM root may prepare simulated Unix UIDs.
          # The verifier and updater immediately drop to their dedicated IDs.
          sudo env \
            MYAI_HOSTED_FOUR_UID_BWRAP=yes \
            MYAI_RUNNER_ENVIRONMENT=github-hosted \
            PYTHONDONTWRITEBYTECODE=1 \
            PYTHONPATH="$MYAI_FOUR_UID_PUBLIC" \
            "$MYAI_FOUR_UID_PUBLIC/venv/bin/python" -B \
            scripts/test_hosted_four_uid_real_bwrap.py

      - name: Remove only this disposable checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          case "${MYAI_FOUR_UID_CHECKOUT:-}" in
            "$RUNNER_TEMP"/myai-fouruid-bwrap-*)
              if [ -d "$MYAI_FOUR_UID_CHECKOUT" ] && [ ! -L "$MYAI_FOUR_UID_CHECKOUT" ]; then
                sudo rm -rf -- "$MYAI_FOUR_UID_CHECKOUT"
              fi
              ;;
            "") ;;
            *) echo "Unsafe temporary checkout path; refusing removal" >&2; exit 2 ;;
          esac
          case "${MYAI_FOUR_UID_PUBLIC:-}" in
            /tmp/myai-fouruid-public-*)
              if [ -d "$MYAI_FOUR_UID_PUBLIC" ] && [ ! -L "$MYAI_FOUR_UID_PUBLIC" ]; then
                sudo rm -rf -- "$MYAI_FOUR_UID_PUBLIC"
              fi
              ;;
            "") ;;
            *) echo "Unexpected public test path; refusing removal" >&2; exit 2 ;;
          esac
