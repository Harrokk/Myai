name: MyAI memory literal search and dialog fallback (synthetic)
on:
  push:
    branches: [dev/ventuno-memory-literal-like-read-failsoft-20261015]
    paths:
      - .github/workflows/ventuno-memory-literal-like-failsoft.yml
      - core/memory.py
      - core/assistant.py
      - tests/test_memory_literal_search_and_recovery.py
permissions:
  contents: read
concurrency:
  group: myai-memory-literal-failsoft-20261015
  cancel-in-progress: false
jobs:
  synthetic-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Exact-SHA isolated GitHub-hosted x86 checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          scratch="$(mktemp -d "$RUNNER_TEMP/myai-memory-failsoft.XXXXXX")"
          chmod 700 "$scratch"
          echo "MYAI_MEMORY_TEST_SCRATCH=$scratch" >> "$GITHUB_ENV"
          cd "$scratch"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Pinned dependencies in disposable x86 virtualenv
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/myai-memory-failsoft-venv"
          "$RUNNER_TEMP/myai-memory-failsoft-venv/bin/python" -m pip install \
            --disable-pip-version-check --only-binary=:all: \
            pytest==8.3.5 requests==2.32.5 psutil==7.1.0
      - name: SQLite wildcard privacy and memory read outage regression
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          cd "$MYAI_MEMORY_TEST_SCRATCH"
          "$RUNNER_TEMP/myai-memory-failsoft-venv/bin/python" -B -m pytest -q \
            tests/test_memory_literal_search_and_recovery.py \
            tests/test_memory.py \
            tests/test_assistant_core.py
          echo 'Temporary synthetic SQLite DB only; no real memory or active Ventuno state.'
      - name: Remove disposable test files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${MYAI_MEMORY_TEST_SCRATCH:-}" ]; then
            rm -rf -- "$MYAI_MEMORY_TEST_SCRATCH"
          fi
          rm -rf -- "$RUNNER_TEMP/myai-memory-failsoft-venv"
