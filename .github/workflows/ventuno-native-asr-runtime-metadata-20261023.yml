name: VENTUNO one-use native App Lab ASR runtime metadata preflight

on:
  push:
    branches: [dev/ventuno-app-lab-asr-runtime-preflight-20261023]
    paths:
      - .github/workflows/ventuno-native-asr-runtime-metadata-20261023.yml

permissions:
  contents: read

concurrency:
  group: myai-one-use-native-asr-host-metadata-20261023
  cancel-in-progress: false

jobs:
  inventory:
    if: github.run_attempt == 1 && github.event.before == 'e22caa9a49061a7edf9f0ff4ff46416e1e5f001d' && github.event.head_commit.message == 'Authorize one passive App Lab ASR runtime metadata check 2026-10-23'
    runs-on: [self-hosted, Linux, ARM64, ventuno-q]
    timeout-minutes: 4
    steps:
      - name: Check installed Whisper asset and host USB microphone paths without opening devices
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: |
          set -euo pipefail
          test "$(id -un)" = "arduino"
          test "$(id -u)" = "1000"
          test "$(uname -m)" = "aarch64"
          python3 -B - <<'PY'
          import json
          import os
          import re
          import stat
          import subprocess
          from pathlib import Path

          MODEL_ROOT = Path("/var/lib/arduino-app-cli/models")
          MODEL = MODEL_ROOT / "audio-analytics/asr" / "whisper_small_quantized-voice_ai-w8a16-qualcomm_qcs8275"
          ASSETS = Path("/var/lib/arduino-app-cli/assets")

          def mode_is(path, kind):
              try:
                  mode = path.lstat().st_mode
                  return kind(mode)
              except (OSError, ValueError):
                  return False

          def directory(path):
              return mode_is(path, stat.S_ISDIR)

          def regular(path):
              return mode_is(path, stat.S_ISREG)

          def bounded_bytes(path, max_bytes=64*1024):
              if not regular(path):
                  return None
              try:
                  with path.open("rb") as fh:
                      raw = fh.read(max_bytes+1)
                  return raw if len(raw) <= max_bytes else None
              except (OSError, ValueError):
                  return None

          def active(unit):
              try:
                  p = subprocess.run(
                      ["systemctl", "is-active", "--quiet", unit],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                      timeout=5,
                      check=False,
                  )
                  return p.returncode == 0
              except (OSError, subprocess.TimeoutExpired):
                  return False

          proc = bounded_bytes(Path("/proc/asound/pcm"), 16*1024)
          cap_pair = bool(proc and any(
              re.match(rb"^\s*0?1-0?0:", row) and
              re.search(rb"\bcapture\s+[1-9][0-9]*\b", row)
              for row in proc.splitlines()
          ))
          node = Path("/dev/snd/pcmC1D0c")
          node_ok = mode_is(node, stat.S_ISCHR)
          node_rw = bool(node_ok and os.access(
              node, os.R_OK|os.W_OK, follow_symlinks=False
          ))
          by_id = Path("/dev/snd/by-id")
          link_count = 0
          if directory(by_id):
              try:
                  with os.scandir(by_id) as scan:
                      for i, item in enumerate(scan):
                          if i >= 24:
                              break
                          if item.is_symlink():
                              link_count += 1
              except OSError:
                  pass

          model_dir = directory(MODEL)
          has_payload = False
          marker = regular(MODEL/".download")
          top_level_complete = False
          if model_dir:
              try:
                  with os.scandir(MODEL) as scan:
                      for i, item in enumerate(scan):
                          if i >= 128:
                              break
                          if item.name.startswith("."):
                              continue
                          if not item.is_symlink() and (
                              item.is_file(follow_symlinks=False)
                              or item.is_dir(follow_symlinks=False)
                          ):
                              has_payload = True
                      else:
                          top_level_complete = True
              except OSError:
                  pass

          asset_catalog_found = False
          asr_declared = False
          assets_scanned = 0
          if directory(ASSETS):
              try:
                  with os.scandir(ASSETS) as roots:
                      for i, ent in enumerate(roots):
                          if i >= 16:
                              break
                          if not ent.is_dir(follow_symlinks=False):
                              continue
                          assets_scanned += 1
                          data = bounded_bytes(Path(ent.path)/"bricks-list.yaml", 1024*1024)
                          if data is not None:
                              asset_catalog_found = True
                              asr_declared |= bool(re.search(
                                  rb"(?m)^\s*(?:-\s*)?id:\s*arduino:asr\s*$",
                                  data
                              ))
              except OSError:
                  pass

          mem = bounded_bytes(Path("/proc/meminfo"), 16384) or b""
          match = re.search(rb"(?m)^MemAvailable:\s*(\d+)\s+kB",mem)
          avail_mib = int(match[1])//1024 if match else None
          mem_band = ("unknown" if avail_mib is None else
                      "below-6-GiB" if avail_mib < 6144 else
                      "6-to-10-GiB" if avail_mib < 10240 else
                      "at-least-10-GiB")
          myai = active("myai-ventuno.service")
          genie = active("myai-geniex.service")
          candidate = all((cap_pair,node_rw,model_dir,has_payload,
                           top_level_complete,not marker,myai,genie))
          report = {
              "status": ("host-metadata-candidate-guest-npu-unverified"
                         if candidate else "host-metadata-blocked-or-inconclusive"),
              "host_alsa_usb_capture_pair_1_0":cap_pair,
              "host_capture_node_accessible":node_rw,
              "host_alsa_by_id_symlinks_exist":link_count > 0,
              "model_folder_exists":model_dir,
              "model_folder_non_bookkeeping_payload":has_payload,
              "model_folder_top_level_scan_complete":top_level_complete,
              "model_folder_download_marker":marker,
              "app_lab_assets_catalog_present":asset_catalog_found,
              "arduino_asr_in_local_assets_catalog":asr_declared,
              "memory_band":mem_band,
              "production_myai_active":myai,
              "production_geniex_active":genie,
              "app_lab_container_audio_mapping_proven":False,
              "app_lab_container_model_mount_proven":False,
              "geniex_and_asr_npu_coexistence_proven":False,
              "swedish_transcription_verified":False,
              "asr_inference_attempted":False,
              "microphone_opened":False,
              "docker_command_executed":False,
              "model_installed_or_downloaded":False,
              "services_or_config_changed":False,
          }
          print("MYAI_NATIVE_ASR_HOST_PREFLIGHT="+json.dumps(report,sort_keys=True))
          PY
          echo "All observations are passive. No model load or audio."
