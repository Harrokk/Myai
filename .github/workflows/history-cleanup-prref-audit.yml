name: Sensitive data PR-ref audit

on:
  push:
    branches:
      - "dev/routing-boundary-followup"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install git-filter-repo
        run: |
          python -m pip install --disable-pip-version-check git-filter-repo==2.47.0
          git filter-repo --version

      - name: Clone fresh repository
        run: git clone "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" audit-repo

      - name: Run sensitive-data-removal audit locally
        run: |
          set -euo pipefail
          cd audit-repo
          git filter-repo --force --sensitive-data-removal \
            --invert-paths \
            --path memory.db \
            --path __init__.cpython-314.pyc \
            --path system.cpython-314.pyc \
            2>&1 | tee ../sdr-output.txt

      - name: Report affected PR refs and first changed commits
        shell: python
        run: |
          from pathlib import Path
          import re

          changed_path = Path("audit-repo/.git/filter-repo/changed-refs")
          changed = (
              changed_path.read_text(encoding="utf-8").splitlines()
              if changed_path.exists()
              else []
          )
          pr_refs = sorted(
              ref.strip()
              for ref in changed
              if re.fullmatch(r"refs/pull/\d+/head", ref.strip())
          )

          print(f"AFFECTED_PR_COUNT={len(pr_refs)}")
          for ref in pr_refs:
              print(f"AFFECTED_PR_REF={ref}")

          output = Path("sdr-output.txt").read_text(
              encoding="utf-8",
              errors="replace",
          )
          lines = output.splitlines()
          for index, line in enumerate(lines):
              if "First Changed Commit" in line:
                  print(line)
                  for extra in lines[index + 1:index + 8]:
                      if not extra.strip():
                          break
                      print(extra)
                  break
