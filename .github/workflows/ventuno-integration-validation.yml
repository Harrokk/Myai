name: VENTUNO integration branch validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ventuno-integration-validation
  cancel-in-progress: false

jobs:
  validate:
    name: Validate GenieX integration branch on VENTUNO Q
    if: github.repository == 'Harrokk/Myai' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, ventuno-q]
    timeout-minutes: 10
    steps:
      - name: Check out fixed integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/geniex-readiness
          persist-credentials: false
          clean: true

      - name: Verify runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          test "$(id -un)" = "arduino"
          test -x /home/arduino/MyAI/.venv/bin/python
          /home/arduino/MyAI/.venv/bin/python -m pytest --version

      - name: Run VENTUNO regression tests
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          /home/arduino/MyAI/.venv/bin/python -m pytest -q \
            tests/test_systemd_units.py \
            tests/test_geniex_readiness.py \
            tests/test_geniex_supervisor.py \
            tests/test_ventuno_preflight.py \
            tests/test_runtime_service.py

      - name: Compile integration Python files
        shell: bash
        run: |
          set -euo pipefail
          /home/arduino/MyAI/.venv/bin/python -m py_compile \
            core/systemd_units.py \
            core/geniex_readiness.py \
            scripts/ventuno_runtime.py \
            tests/test_systemd_units.py \
            tests/test_geniex_readiness.py

      - name: Validate generated systemd units without installing
        shell: bash
        run: |
          set -euo pipefail
          /home/arduino/MyAI/.venv/bin/python scripts/generate_ventuno_systemd.py
          systemd-analyze verify \
            runtime/systemd/myai-geniex.service \
            runtime/systemd/myai-ventuno.service \
            runtime/systemd/myai-geniex-watchdog.service \
            runtime/systemd/myai-ventuno.target
