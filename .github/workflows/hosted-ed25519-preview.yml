name: Offline Ed25519 preview cryptography verification
on:
  push:
    branches: [dev/offline-signed-preview-20261014]
    paths:
      - core/selfdev_signed_manifest.py
      - core/selfdev_request_protocol.py
      - tests/test_selfdev_signed_manifest.py
      - .github/workflows/hosted-ed25519-preview.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ed25519:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch exact source commit into ephemeral host
        shell: bash
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE" init -q
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/Harrokk/Myai.git"
          git -C "$GITHUB_WORKSPACE" fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install host-only cryptography test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/myai-ed25519-only"
          "$RUNNER_TEMP/myai-ed25519-only/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: "cryptography==45.0.7" "pytest==8.3.5"
      - name: Run real Ed25519 signature and tamper regression
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/myai-ed25519-only/bin/python" -B -m pytest -q -rs tests/test_selfdev_signed_manifest.py
