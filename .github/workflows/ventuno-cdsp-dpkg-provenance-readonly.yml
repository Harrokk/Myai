name: VENTUNO CDSP firmware and FastRPC package provenance metadata
on:
  push:
    branches: [dev/ventuno-cdsp-firmware-dpkg-provenance-20261014]
    paths:
      - .github/workflows/ventuno-cdsp-dpkg-provenance-readonly.yml
permissions:
  contents: read
concurrency:
  group: myai-cdsp-dpkg-provenance-20261014
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: [self-hosted, Linux, ARM64, ventuno-q]
    timeout-minutes: 4
    steps:
      - name: Query exact firmware candidate and shell dpkg metadata without file opens
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          test "$(id -un)" = "arduino"
          test "$GITHUB_REF" = "refs/heads/dev/ventuno-cdsp-firmware-dpkg-provenance-20261014"
          scratch="$(mktemp -d "$RUNNER_TEMP/myai-cdsp-dpkg.XXXXXX")"
          chmod 700 "$scratch"
          trap 'cd "$RUNNER_TEMP" && rm -rf -- "$scratch"' EXIT
          cd "$scratch"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          timeout --signal=TERM --kill-after=3s 35s /home/arduino/MyAI/.venv/bin/python -B -m scripts.ventuno_cdsp_dpkg_provenance_readonly
          echo 'Read-only dpkg ownership/versions; no firmware image reads, device opens, model run, or production changes.'
