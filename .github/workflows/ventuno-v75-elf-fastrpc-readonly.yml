name: VENTUNO bounded V75 ELF and FastRPC package metadata
on:
  push:
    branches: [dev/ventuno-v75-elf-fastrpc-provenance-20261014]
    paths:
      - .github/workflows/ventuno-v75-elf-fastrpc-readonly.yml
permissions:
  contents: read
concurrency:
  group: myai-v75-elf-fastrpc-20261014
  cancel-in-progress: false
jobs:
  source-metadata:
    runs-on: [self-hosted, Linux, ARM64, ventuno-q]
    timeout-minutes: 4
    steps:
      - name: Read bounded resolved ELF header and FastRPC package metadata only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          test "$(id -un)" = "arduino"
          test "$GITHUB_REF" = "refs/heads/dev/ventuno-v75-elf-fastrpc-provenance-20261014"
          scratch="$(mktemp -d "$RUNNER_TEMP/myai-v75-elf.XXXXXX")"
          chmod 700 "$scratch"
          trap 'cd "$RUNNER_TEMP" && rm -rf -- "$scratch"' EXIT
          cd "$scratch"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          timeout --signal=TERM --kill-after=3s 30s /home/arduino/MyAI/.venv/bin/python -B -m scripts.ventuno_v75_elf_fastrpc_readonly
          echo 'No /dev open, no library load or execution, no model, no service or package modification.'
