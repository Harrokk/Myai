name: Exact voice consent to tool-dispatch binding safety
on:
  push:
    branches: [dev/ventuno-voice-dispatch-plan-binding-20261015]
    paths:
      - .github/workflows/ventuno-voice-dispatch-plan-binding-safety.yml
      - core/assistant.py
      - core/tool_manager.py
      - core/voice_pipeline.py
      - core/voice_plan_attestation.py
      - modules/system/memory_admin.py
      - tests/test_voice_dispatch_plan_binding.py
permissions:
  contents: read
concurrency:
  group: myai-voice-dispatch-binding-20261015
  cancel-in-progress: false
jobs:
  mocked-dispatch-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Exact commit in disposable x86 working directory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          scratch="$(mktemp -d "$RUNNER_TEMP/myai-voice-dispatch.XXXXXX")"
          chmod 700 "$scratch"
          echo "MYAI_DISPATCH_SCRATCH=$scratch" >> "$GITHUB_ENV"
          cd "$scratch"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Pinned pytest with isolated temporary venv
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/myai-voice-dispatch-venv"
          "$RUNNER_TEMP/myai-voice-dispatch-venv/bin/python" -m pip install \
            --disable-pip-version-check --only-binary=:all: \
            pytest==8.3.5 requests==2.32.5 psutil==7.1.0
      - name: Mock dispatch and voice approval regressions only
        shell: bash
        run: |
          set -euo pipefail
          cd "$MYAI_DISPATCH_SCRATCH"
          "$RUNNER_TEMP/myai-voice-dispatch-venv/bin/python" -B -m pytest -q \
            tests/test_voice_dispatch_plan_binding.py
          echo 'No real workspace writes, microphone, QNN, GenieX or model inference.'
      - name: Clean disposable test artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${MYAI_DISPATCH_SCRATCH:-}" ]; then
            rm -rf -- "$MYAI_DISPATCH_SCRATCH"
          fi
          rm -rf -- "$RUNNER_TEMP/myai-voice-dispatch-venv"
