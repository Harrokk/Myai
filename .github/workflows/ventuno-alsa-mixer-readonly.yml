name: VENTUNO ALSA mixer capture controls read-only

on:
  push:
    branches:
      - dev/routing-boundary-followup
    paths:
      - .github/workflows/ventuno-alsa-mixer-readonly.yml
      - scripts/ventuno_alsa_mixer_probe.py
      - tests/test_ventuno_alsa_mixer_probe.py
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ventuno-alsa-mixer-readonly
  cancel-in-progress: false

jobs:
  inspect:
    name: Read ALSA mixer state without opening microphone
    runs-on: [self-hosted, Linux, ARM64, ventuno-q]
    timeout-minutes: 5
    steps:
      - name: Fetch exact source into disposable checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          test "$(id -un)" = "arduino"
          test -n "${RUNNER_TEMP:-}"
          source_dir="$(mktemp -d "$RUNNER_TEMP/myai-alsa-mixer-XXXXXXXX")"
          echo "MYAI_MIXER_SOURCE=$source_dir" >> "$GITHUB_ENV"
          git init -q "$source_dir"
          git -C "$source_dir" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$source_dir" -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -C "$source_dir" -c credential.helper= checkout -q --detach FETCH_HEAD
          git -C "$source_dir" remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run no-recording regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$MYAI_MIXER_SOURCE"
          /home/arduino/MyAI/.venv/bin/python -m pytest -q tests/test_ventuno_alsa_mixer_probe.py
      - name: Inspect capture mixer controls without recording
        id: mixer
        shell: bash
        run: |
          set -euo pipefail
          systemctl is-active --quiet myai-geniex.service
          systemctl is-active --quiet myai-ventuno.service
          cd "$MYAI_MIXER_SOURCE"
          /home/arduino/MyAI/.venv/bin/python - <<'PY'
          import json
          import os
          from scripts.ventuno_alsa_mixer_probe import inspect_mixer
          result = inspect_mixer()
          print("VENTUNO read-only ALSA mixer state:", json.dumps(result, sort_keys=True))
          print("No ALSA capture, speaker playback, mixer write or service restart attempted.")
          output_file = os.environ["GITHUB_OUTPUT"]
          with open(output_file, "a", encoding="utf-8") as handle:
              handle.write("mixer_status=" + str(result["status"]) + "\n")
              handle.write("capture_controls=" + str(result["capture_controls"]) + "\n")
          PY
      - name: Check services and remove only this temporary checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          systemctl is-active --quiet myai-geniex.service
          systemctl is-active --quiet myai-ventuno.service
          if [ -n "${MYAI_MIXER_SOURCE:-}" ] && [ -n "${RUNNER_TEMP:-}" ]; then
            case "$MYAI_MIXER_SOURCE" in
              "$RUNNER_TEMP"/myai-alsa-mixer-*)
                if [ -d "$MYAI_MIXER_SOURCE" ]; then rm -rf -- "$MYAI_MIXER_SOURCE"; fi
                ;;
              *)
                echo "Unexpected checkout path; refusing cleanup" >&2
                exit 1
                ;;
            esac
          fi

      - name: Report sanitized diagnostic status on tested commit
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
          MIXER_STATUS: ${{ steps.mixer.outputs.mixer_status }}
          CAPTURE_CONTROLS: ${{ steps.mixer.outputs.capture_controls }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request
          sha = os.environ.get("GITHUB_SHA", "")
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          token = os.environ.get("GH_TOKEN", "")
          job = os.environ.get("JOB_RESULT", "")
          category = os.environ.get("MIXER_STATUS", "")
          count = os.environ.get("CAPTURE_CONTROLS", "")
          if not (re.fullmatch(r"[0-9a-f]{40}", sha) and
                  re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo) and token):
              print("Commit status not posted: missing identity or token.")
              raise SystemExit(0)
          allowed = {
              "capture-control-metadata-readable",
              "capture-controls-without-level-readings",
              "some-capture-switches-report-off",
              "some-capture-volumes-report-zero",
              "no-capture-controls-exposed",
              "amixer-unavailable",
              "mixer-query-failed",
              "mixer-output-unavailable",
          }
          category = category if category in allowed else "no-mixer-result"
          count = count if re.fullmatch(r"[0-9]{1,4}", count) else "unknown"
          state = {"success": "success", "failure": "failure"}.get(job, "error")
          target = (
              "https://github.com/" + repo + "/actions/runs/"
              + os.environ.get("GITHUB_RUN_ID", "")
          )
          body = {
              "state": state,
              "context": "myai/ventuno-alsa-mixer-readonly",
              "description": ("Read-only audit: " + category + ", capture controls=" + count)[:140],
              "target_url": target,
          }
          request = urllib.request.Request(
              "https://api.github.com/repos/" + repo + "/statuses/" + sha,
              data=json.dumps(body).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=10) as response:
                  print("Sanitized CI status posted:", response.status == 201)
          except Exception as exc:
              print("Could not publish CI status:", type(exc).__name__)
          PY
