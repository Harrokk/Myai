name: VENTUNO CDSP remoteproc and shell metadata only
on:
  push:
    branches: [dev/ventuno-cdsp-remoteproc-shell-readonly-20261014]
    paths:
      - .github/workflows/ventuno-cdsp-remoteproc-shell-readonly.yml
permissions:
  contents: read
concurrency:
  group: myai-cdsp-shell-readonly-20261014
  cancel-in-progress: false
jobs:
  readonly:
    runs-on: [self-hosted, Linux, ARM64, ventuno-q]
    timeout-minutes: 4
    steps:
      - name: Exact commit, bounded sysfs and shell file header only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          test "$(id -un)" = "arduino"
          test "$GITHUB_REF" = "refs/heads/dev/ventuno-cdsp-remoteproc-shell-readonly-20261014"
          scratch="$(mktemp -d "$RUNNER_TEMP/myai-cdsp-shell.XXXXXX")"
          chmod 700 "$scratch"
          trap 'cd "$RUNNER_TEMP" && rm -rf -- "$scratch"' EXIT
          cd "$scratch"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          timeout --signal=TERM --kill-after=3s 30s /home/arduino/MyAI/.venv/bin/python -B -m scripts.ventuno_cdsp_remoteproc_shell_readonly
          echo 'Bounded metadata only; no DSP context, QNN inference, package or service changes.'
