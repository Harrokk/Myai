name: VENTUNO unprivileged local recovery timer canary - synthetic only
on:
  push:
    branches: [dev/ventuno-htp-systemd-independent-canary-20261015]
    paths:
      - .github/workflows/ventuno-htp-local-recovery-canary.yml
      - scripts/ventuno_htp_local_recovery_canary.py
      - tests/test_ventuno_htp_local_recovery_canary.py
      - scripts/ventuno_htp_system_recovery_staged.py
      - tests/test_ventuno_htp_system_recovery_staged.py
      - deploy/systemd/myai-htp-staged-restore.service
      - deploy/systemd/myai-htp-staged-restore.timer
      - scripts/ventuno_runner_boot_policy_readonly.py
      - tests/test_ventuno_runner_boot_policy_readonly.py
      - deploy/systemd/actions.runner.Harrokk-Myai.ventuno-q.service.d/20-myai-restart-policy.conf
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: myai-ventuno-htp-local-recovery-canary-20261015
  cancel-in-progress: false
jobs:
  offline-safety:
    name: Mock crash, timeout, no sudo and fail-closed local timer tests
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Exact commit private ephemeral checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          scratch="$(mktemp -d "$RUNNER_TEMP/myai-local-timer-unit.XXXXXX")"
          chmod 700 "$scratch"
          echo "MYAI_TIMER_UNIT_TEST=$scratch" >> "$GITHUB_ENV"
          cd "$scratch"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run isolated synthetic safety and prior dry-run recovery tests
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/myai-timer-canary-venv"
          "$RUNNER_TEMP/myai-timer-canary-venv/bin/python" -m pip install \
            --disable-pip-version-check --only-binary=:all: \
            pytest==8.3.5 psutil==7.1.0 requests==2.32.5
          cd "$MYAI_TIMER_UNIT_TEST"
          "$RUNNER_TEMP/myai-timer-canary-venv/bin/python" -B -m pytest -q \
            tests/test_ventuno_htp_local_recovery_canary.py \
            tests/test_ventuno_htp_maintenance_recovery_dryrun.py \
            tests/test_ventuno_htp_system_recovery_staged.py \
            tests/test_ventuno_runner_boot_policy_readonly.py
      - name: Clear isolated checkout and Python environment
        if: always()
        shell: bash
        run: |
          if [ -n "${MYAI_TIMER_UNIT_TEST:-}" ]; then rm -rf -- "$MYAI_TIMER_UNIT_TEST"; fi
          rm -rf -- "$RUNNER_TEMP/myai-timer-canary-venv"

  ventuno-sandbox-user-timer:
    # ARCHIVED - NO LIVE SYSTEMD USER-MANAGER TIMER on unapproved DRAFT.
    # Re-enable only with separate physical operator and rollback approval.
    if: false
    name: On-board independent user-manager timer only for FAKE marker
    needs: offline-safety
    runs-on: [self-hosted, Linux, ARM64, ventuno-q]
    timeout-minutes: 4
    steps:
      - name: Exact revision temporary checkout on the board
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          test "$(id -un)" = "arduino"
          scratch="$(mktemp -d "$RUNNER_TEMP/myai-timer-canary-code.XXXXXX")"
          chmod 700 "$scratch"
          echo "MYAI_TIMER_CANARY_CODE=$scratch" >> "$GITHUB_ENV"
          cd "$scratch"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: One unprivileged timer canary - no real service changes
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: |
          set -euo pipefail
          cd "$MYAI_TIMER_CANARY_CODE"
          timeout --signal=TERM --kill-after=3s 65s \
            /home/arduino/MyAI/.venv/bin/python -B \
            -m scripts.ventuno_htp_local_recovery_canary --exercise \
            | tee "$MYAI_TIMER_CANARY_CODE/sanitized-canary.jsonl"
          /home/arduino/MyAI/.venv/bin/python -B - <<'PY'
          import json
          from pathlib import Path
          rows = Path("sanitized-canary.jsonl").read_text(encoding="utf-8").splitlines()
          assert len(rows) == 1 and rows[0].startswith("MYAI_HTP_LOCAL_RECOVERY_CANARY_JSON=")
          result = json.loads(rows[0].split("=", 1)[1])
          assert result["real_service_stop_start_restart_performed"] is False
          assert result["geniex_or_myai_modified"] is False
          assert result["npu_or_qnn_executed"] is False
          assert result["system_manager_or_sudo_used"] is False
          assert result["persistent_system_rollback_installed"] is False
          assert result["runner_disconnect_or_reboot_recovery_verified"] is False
          assert result["private_paths_or_logs_exported"] is False
          print("Systemd user-manager canary completed or explicit NO-GO; no live maintenance.")
          PY
      - name: Read installed runner boot-autostart configuration only
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: |
          set -euo pipefail
          cd "$MYAI_TIMER_CANARY_CODE"
          timeout --signal=TERM --kill-after=3s 15s \
            /home/arduino/MyAI/.venv/bin/python -B \
            -m scripts.ventuno_runner_boot_policy_readonly \
            | tee "$MYAI_TIMER_CANARY_CODE/runner-boot.jsonl"
          /home/arduino/MyAI/.venv/bin/python -B - <<'PY'
          import json
          from pathlib import Path
          rows = Path("runner-boot.jsonl").read_text(encoding="utf-8").splitlines()
          assert len(rows) == 1 and rows[0].startswith("MYAI_RUNNER_BOOT_POLICY_JSON=")
          r = json.loads(rows[0].split("=", 1)[1])
          assert r["runner_reconnect_after_actual_reboot_verified"] is False
          assert r["runner_service_or_network_modified"] is False
          assert r["runner_credentials_or_unit_paths_exported"] is False
          print("Runner boot policy metadata checked without reboot or service change.")
          PY
      - name: Remove temporary checkout after the canary's execution budget
        if: always()
        shell: bash
        run: |
          if [ -n "${MYAI_TIMER_CANARY_CODE:-}" ]; then rm -rf -- "$MYAI_TIMER_CANARY_CODE"; fi
