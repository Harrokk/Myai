name: VENTUNO read-only ACL and udev root metadata classification
on:
  push:
    branches: [dev/ventuno-fastrpc-acl-root-evidence-20261014]
    paths:
      - .github/workflows/ventuno-fastrpc-acl-root-readonly.yml
permissions:
  contents: read
concurrency:
  group: myai-fastrpc-acl-root-20261014
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: [self-hosted, Linux, ARM64, ventuno-q]
    timeout-minutes: 4
    steps:
      - name: Exact-commit isolated metadata read, never open device nodes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          test "$(id -un)" = "arduino"
          test "$GITHUB_REF" = "refs/heads/dev/ventuno-fastrpc-acl-root-evidence-20261014"
          scratch="$(mktemp -d "$RUNNER_TEMP/myai-fastrpc-acl.XXXXXX")"
          chmod 700 "$scratch"
          trap 'cd "$RUNNER_TEMP" && rm -rf -- "$scratch"' EXIT
          cd "$scratch"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          timeout --signal=TERM --kill-after=3s 30s /home/arduino/MyAI/.venv/bin/python -B -m scripts.ventuno_fastrpc_acl_root_readonly
          echo 'Metadata-only check complete; no QNN, audio, device open, permissions change, or production deployment.'
