name: MyAI tests on VENTUNO Q

on:
  push:
    branches:
      - "dev/**"
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: myai-ci-ventuno
  cancel-in-progress: false

jobs:
  test:
    name: Run isolated MyAI unit tests
    runs-on: [self-hosted, Linux, ARM64, ventuno-q]
    timeout-minutes: 20
    steps:
      - name: Fetch exact commit in temporary workspace
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(id -un)" = "arduino"
          mkdir -p "$RUNNER_TEMP/myai-ci-source"
          cd "$RUNNER_TEMP/myai-ci-source"
          git init -q
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --force --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Compile Python sources
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/myai-ci-source"
          /home/arduino/MyAI/.venv/bin/python -m compileall -q core modules scripts mail.py

      - name: Run full test suite without modifying live installation
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/myai-ci-source"
          /home/arduino/MyAI/.venv/bin/python -m pytest -q

      - name: Summarize test run
        if: always()
        shell: bash
        run: |
          echo "## MyAI CI on VENTUNO Q" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Tests execute from runner temporary workspace, not /home/arduino/MyAI." >> "$GITHUB_STEP_SUMMARY"
