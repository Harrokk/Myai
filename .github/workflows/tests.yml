name: MyAI tests

on:
  push:
    branches:
      - "dev/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch repository using git (no external actions)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Verify Python 3.12 is available
        shell: bash
        run: |
          set -euo pipefail
          python3.12 --version

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3.12 -m venv "$RUNNER_TEMP/myai-tests-venv"
          "$RUNNER_TEMP/myai-tests-venv/bin/python" -m pip install -r requirements.txt pytest

      - name: Compile Python sources
        shell: bash
        run: "$RUNNER_TEMP/myai-tests-venv/bin/python" -m compileall -q core modules scripts mail.py

      - name: Run tests
        shell: bash
        run: "$RUNNER_TEMP/myai-tests-venv/bin/python" -m pytest -q
