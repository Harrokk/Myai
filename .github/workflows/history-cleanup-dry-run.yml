name: History cleanup dry run

on:
  push:
    branches:
      - "dev/routing-boundary-followup"

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install git-filter-repo
        run: |
          python -m pip install --disable-pip-version-check git-filter-repo==2.47.0
          git filter-repo --version

      - name: Clone two complete mirrors
        run: |
          git clone --mirror "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" before.git
          cp -a before.git after.git

      - name: Rewrite only the cleanup mirror
        run: |
          git --git-dir=after.git filter-repo --force \
            --invert-paths \
            --path memory.db \
            --path __init__.cpython-314.pyc \
            --path system.cpython-314.pyc

      - name: Verify ref coverage and tip contents
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          forbidden = {
              "memory.db",
              "__init__.cpython-314.pyc",
              "system.cpython-314.pyc",
          }

          def git(repo, *args):
              return subprocess.run(
                  ["git", f"--git-dir={repo}", *args],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout

          def refs(repo):
              out = git(
                  repo,
                  "for-each-ref",
                  "--format=%(refname) %(objectname)",
                  "refs/heads",
                  "refs/tags",
              )
              result = {}
              for line in out.splitlines():
                  if not line.strip():
                      continue
                  ref, sha = line.split(" ", 1)
                  result[ref] = sha
              return result

          def tree_paths(repo, sha):
              out = git(repo, "ls-tree", "-r", "--name-only", sha)
              return {
                  line.strip()
                  for line in out.splitlines()
                  if line.strip()
              }

          before = refs("before.git")
          after = refs("after.git")

          if set(before) != set(after):
              missing = sorted(set(before) - set(after))
              added = sorted(set(after) - set(before))
              raise SystemExit(
                  f"Ref set changed. Missing={missing} Added={added}"
              )

          changed_tips = []
          for ref in sorted(before):
              before_paths = tree_paths("before.git", before[ref])
              after_paths = tree_paths("after.git", after[ref])
              removed = before_paths - after_paths
              added = after_paths - before_paths

              unexpected_removed = {
                  path
                  for path in removed
                  if Path(path).name not in forbidden
              }

              if added or unexpected_removed:
                  raise SystemExit(
                      f"Unexpected tip-tree change on {ref}: "
                      f"added={sorted(added)} "
                      f"unexpected_removed={sorted(unexpected_removed)}"
                  )

              if before[ref] != after[ref]:
                  changed_tips.append(ref)

          print(f"Verified refs: {len(before)}")
          print(f"Rewritten tip commits: {len(changed_tips)}")

      - name: Verify forbidden history is gone
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          forbidden = {
              "memory.db",
              "__init__.cpython-314.pyc",
              "system.cpython-314.pyc",
          }

          out = subprocess.run(
              ["git", "--git-dir=after.git", "rev-list", "--objects", "--all"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout

          matches = []
          for line in out.splitlines():
              parts = line.strip().split(" ", 1)
              if len(parts) == 2 and Path(parts[1]).name in forbidden:
                  matches.append(line.strip())

          if matches:
              raise SystemExit(
                  "Forbidden history still reachable:\n" + "\n".join(matches)
              )

          print("Dry-run cleanup verified: forbidden history is absent.")

      - name: Confirm original mirror was untouched
        shell: python
        run: |
          import subprocess

          out = subprocess.run(
              ["git", "--git-dir=before.git", "rev-list", "--objects", "--all"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout

          if "memory.db" not in out:
              raise SystemExit("Original mirror unexpectedly lacks memory.db")

          print("Original mirror remained untouched; no remote refs were modified.")
