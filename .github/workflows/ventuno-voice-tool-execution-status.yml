name: Voice tool execution status synthetic CI
on:
  push:
    branches: [dev/ventuno-voice-tool-execution-status-20261015]
    paths:
      - .github/workflows/ventuno-voice-tool-execution-status.yml
      - core/voice_pipeline.py
      - tests/test_voice_tool_execution_status_bridge.py
      - tests/test_voice_memory_feedback_bridge.py
  pull_request:
    paths:
      - core/voice_pipeline.py
      - tests/test_voice_tool_execution_status_bridge.py
permissions:
  contents: read
concurrency:
  group: myai-voice-tool-status-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synthetic-voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact event commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install pinned Python test tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/myai-voice-tool-status"
          "$RUNNER_TEMP/myai-voice-tool-status/bin/python" -m pip install \
            --disable-pip-version-check --only-binary=:all: \
            pytest==8.3.5 requests==2.32.5 psutil==7.1.0
      - name: Synthetic voice UI and memory integration regressions
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/myai-voice-tool-status/bin/python" -B -m pytest -q \
            tests/test_voice_tool_execution_status_bridge.py \
            tests/test_voice_memory_feedback_bridge.py \
            tests/test_voice_pipeline.py
          echo 'No actual board, GPIO, memory, audio input, NPU, packages or device data.'
      - name: Remove disposable environment
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/myai-voice-tool-status"
