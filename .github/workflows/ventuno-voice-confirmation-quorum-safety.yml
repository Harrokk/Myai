name: Synthetic high-risk voice confirmation quorum
on:
  push:
    branches: [dev/ventuno-voice-confirmation-three-votes-20261014]
    paths:
      - .github/workflows/ventuno-voice-confirmation-quorum-safety.yml
      - core/voice_pipeline.py
      - tests/test_voice_pipeline.py
permissions:
  contents: read
concurrency:
  group: myai-voice-confirmation-quorum-20261014
  cancel-in-progress: false
jobs:
  fake-voice-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout exact commit in disposable GitHub-hosted x86 directory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          scratch="$(mktemp -d "$RUNNER_TEMP/myai-voice-confirmation.XXXXXX")"
          chmod 700 "$scratch"
          echo "MYAI_VOICE_CONFIRM_SCRATCH=$scratch" >> "$GITHUB_ENV"
          cd "$scratch"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install only pinned pytest in disposable venv
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/myai-voice-confirmation-venv"
          "$RUNNER_TEMP/myai-voice-confirmation-venv/bin/python" -m pip install \
            --disable-pip-version-check --only-binary=:all: pytest==8.3.5
      - name: Test three-independent recognizers and cancellation veto using fake STT
        shell: bash
        run: |
          set -euo pipefail
          cd "$MYAI_VOICE_CONFIRM_SCRATCH"
          "$RUNNER_TEMP/myai-voice-confirmation-venv/bin/python" -B -m pytest -q tests/test_voice_pipeline.py
          echo 'Synthetic audio only. No microphone, QNN, STT model, GenieX or production changes.'
      - name: Clean disposable checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${MYAI_VOICE_CONFIRM_SCRATCH:-}" ]; then
            rm -rf -- "$MYAI_VOICE_CONFIRM_SCRATCH"
          fi
          rm -rf -- "$RUNNER_TEMP/myai-voice-confirmation-venv"
