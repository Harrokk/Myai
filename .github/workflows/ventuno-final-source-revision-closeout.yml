name: VENTUNO final remote source revision closeout
on:
  push:
    branches: [dev/ventuno-audit-source-closeout-20261016]
permissions:
  contents: read
jobs:
  premerge-source-only:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    steps:
      - name: Fetch exact candidate SHA to isolated runner scratch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test -d "$RUNNER_TEMP" && test ! -L "$RUNNER_TEMP"
          root="$(mktemp -d "$RUNNER_TEMP/myai-main-trigger-XXXXXXXX")"
          chmod 700 "$root"
          echo "MYAI_MAIN_TRIGGER_SCRATCH=$root" >> "$GITHUB_ENV"
          git init -q "$root"
          git -C "$root" remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git -C "$root" -c credential.helper= fetch -q --depth=1 origin "$GITHUB_SHA"
          git -C "$root" -c credential.helper= checkout -q --detach FETCH_HEAD
          git -C "$root" remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git"
          test "$(git -C "$root" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install audit dependencies in disposable hosted ARM64 venv
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/myai-final-source-venv"
          "$RUNNER_TEMP/myai-final-source-venv/bin/python" -m pip install \
            --disable-pip-version-check --only-binary=:all: \
            "pytest==8.3.5" "cryptography==45.0.7" \
            -r "$MYAI_MAIN_TRIGGER_SCRATCH/requirements.txt"
          echo "MYAI_AUDIT_PY=$RUNNER_TEMP/myai-final-source-venv/bin/python" >> "$GITHUB_ENV"
      - name: Deny accidental automatic effects on review branch AND main
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: |
          set -euo pipefail
          cd "$MYAI_MAIN_TRIGGER_SCRATCH"
          timeout --signal=TERM --kill-after=3s 50s \
            "$MYAI_AUDIT_PY" -B -m scripts.ventuno_workflow_release_review --branch "$GITHUB_REF_NAME"
          timeout --signal=TERM --kill-after=3s 50s \
            "$MYAI_AUDIT_PY" -B -m scripts.ventuno_workflow_release_review --branch main
          timeout --signal=TERM --kill-after=3s 50s \
            "$MYAI_AUDIT_PY" -B -m scripts.ventuno_legacy_inference_quarantine
          timeout --signal=TERM --kill-after=3s 35s \
            "$MYAI_AUDIT_PY" -B -m scripts.ventuno_five_real_model_job_quarantine
          timeout --signal=TERM --kill-after=3s 35s \
            "$MYAI_AUDIT_PY" -B -m scripts.ventuno_manual_actions_triage_gate
          timeout --signal=TERM --kill-after=3s 35s \
            "$MYAI_AUDIT_PY" -B -m scripts.ventuno_all_manual_actions_drift_gate
          timeout --signal=TERM --kill-after=3s 35s \
            "$MYAI_AUDIT_PY" -B -m scripts.ventuno_board_timer_quarantine
          timeout --signal=TERM --kill-after=3s 35s \
            "$MYAI_AUDIT_PY" -B -m scripts.ventuno_manual_workflow_source_identity
          timeout --signal=TERM --kill-after=3s 120s \
            "$MYAI_AUDIT_PY" -B -m scripts.ventuno_remote_revision_closeout
          timeout --signal=TERM --kill-after=3s 110s \
            "$MYAI_AUDIT_PY" -B -m pytest -q \
              tests/test_ventuno_workflow_release_review.py \
              tests/test_ventuno_legacy_inference_quarantine.py \
              tests/test_ventuno_five_real_model_job_quarantine.py \
              tests/test_ventuno_manual_actions_triage_gate.py \
              tests/test_ventuno_all_manual_actions_drift_gate.py \
              tests/test_ventuno_board_timer_quarantine.py \
              tests/test_ventuno_remote_revision_closeout.py
          echo "No release approval: manual dispatch and YAML expression review still pending."
      - name: Delete isolated scratch only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          case "${MYAI_MAIN_TRIGGER_SCRATCH:-}" in
            "$RUNNER_TEMP"/myai-main-trigger-*)
              if [ -d "$MYAI_MAIN_TRIGGER_SCRATCH" ] && [ ! -L "$MYAI_MAIN_TRIGGER_SCRATCH" ]; then
                rm -rf -- "$MYAI_MAIN_TRIGGER_SCRATCH"
              fi
              ;;
            "") ;;
            *) echo "Unexpected cleanup path" >&2; exit 2 ;;
          esac
          rm -rf -- "$RUNNER_TEMP/myai-final-source-venv"
