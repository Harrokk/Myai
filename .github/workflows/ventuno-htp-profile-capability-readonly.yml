name: VENTUNO HTP profiling capability - vendor minimum and installed CLI metadata
on:
  push:
    branches: [dev/ventuno-htp-optrace-capability-20261015]
    paths:
      - .github/workflows/ventuno-htp-profile-capability-readonly.yml
      - scripts/ventuno_htp_profile_capture_capability_readonly.py
      - tests/test_ventuno_htp_profile_capture_capability_readonly.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: myai-htp-profile-capability-readonly-20261015
  cancel-in-progress: false
jobs:
  offline-regressions:
    name: Host-only vendor-minimum and profiler distinction tests
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Obtain exact commit in private temporary x86 checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          scratch="$(mktemp -d "$RUNNER_TEMP/myai-htp-profile-unit.XXXXXX")"
          chmod 700 "$scratch"
          echo "MYAI_HTP_PROFILE_UNIT=$scratch" >> "$GITHUB_ENV"
          cd "$scratch"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify version and profile-gate logic with mock-only tests
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/myai-htp-profile-venv"
          "$RUNNER_TEMP/myai-htp-profile-venv/bin/python" -m pip install \
            --disable-pip-version-check --only-binary=:all: \
            pytest==8.3.5 psutil==7.1.0 requests==2.32.5
          cd "$MYAI_HTP_PROFILE_UNIT"
          "$RUNNER_TEMP/myai-htp-profile-venv/bin/python" -B -m pytest -q \
            tests/test_ventuno_htp_profile_capture_capability_readonly.py \
            tests/test_ventuno_qnn_profile_feasibility.py
      - name: Cleanup ephemeral x86 environment
        if: always()
        shell: bash
        run: |
          if [ -n "${MYAI_HTP_PROFILE_UNIT:-}" ]; then rm -rf -- "$MYAI_HTP_PROFILE_UNIT"; fi
          rm -rf -- "$RUNNER_TEMP/myai-htp-profile-venv"

  installed-cli-metadata:
    name: Read installed Ventuno package metadata and CLI --help only
    runs-on: [self-hosted, Linux, ARM64, ventuno-q]
    needs: offline-regressions
    timeout-minutes: 4
    steps:
      - name: Exact-SHA temporary board checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          test "$(id -un)" = "arduino"
          scratch="$(mktemp -d "$RUNNER_TEMP/myai-htp-prof-readonly.XXXXXX")"
          chmod 700 "$scratch"
          echo "MYAI_HTP_PROFILE_BOARD=$scratch" >> "$GITHUB_ENV"
          cd "$scratch"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Inspect version and help flags - NO NPU runtime or private files
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: |
          set -euo pipefail
          cd "$MYAI_HTP_PROFILE_BOARD"
          timeout --signal=TERM --kill-after=3s 105s \
            /home/arduino/MyAI/.venv/bin/python -B \
            -m scripts.ventuno_htp_profile_capture_capability_readonly \
            | tee "$MYAI_HTP_PROFILE_BOARD/status.jsonl"
          /home/arduino/MyAI/.venv/bin/python -B - <<'PY'
          import json
          from pathlib import Path
          lines = Path("status.jsonl").read_text(encoding="utf-8").splitlines()
          assert len(lines) == 1 and lines[0].startswith("MYAI_HTP_PROFILE_CAPABILITY_JSON=")
          report = json.loads(lines[0].split("=", 1)[1])
          assert report["status"].startswith("no_go_")
          assert report["htp_per_op_cycles_measured"] is False
          assert report["model_graph_placement_verified"] is False
          assert report["live_service_restart_or_stop_performed"] is False
          assert report["profile_log_or_private_model_read"] is False
          assert report["new_model_or_qnn_client_started"] is False
          assert report["device_or_firmware_modified"] is False
          assert report["raw_cli_output_or_paths_exported"] is False
          print("HTP profiling qualification completed; NO-GO is not NPU execution.")
          PY
      - name: Cleanup board temporary code and sanitized status
        if: always()
        shell: bash
        run: |
          if [ -n "${MYAI_HTP_PROFILE_BOARD:-}" ]; then rm -rf -- "$MYAI_HTP_PROFILE_BOARD"; fi
