name: VENTUNO one tiny Qualcomm CPU reference (not HTP)
on:
  push:
    branches: [dev/ventuno-qnn-static-loader-audit-20261014]
    paths:
      - .github/workflows/ventuno-qnn-tiny-cpu-once.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: myai-one-tiny-cpu-reference
  cancel-in-progress: false
jobs:
  one-cpu-fixture:
    runs-on: [self-hosted, Linux, ARM64, ventuno-q]
    timeout-minutes: 3
    steps:
      - name: Fetch exact temporary source revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(id -un)" = "arduino"
          mkdir -p "$RUNNER_TEMP/myai-cpu-tiny-once"
          cd "$RUNNER_TEMP/myai-cpu-tiny-once"
          git init -q
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: One resource-limited CPU backend synthetic 16KB DLC only
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          MYAI_ALLOW_ONE_TINY_QNN_CPU_ATTEMPT: "yes"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/myai-cpu-tiny-once"
          timeout --signal=TERM --kill-after=3s 50s /home/arduino/MyAI/.venv/bin/python -B -m scripts.ventuno_qnn_cpu_reference_once
          echo 'CPU-only 64-byte synthetic input. No HTP, audio, GenieX changes or model output text.'
