name: MyAI disposable ARM64 voice ABI and synthetic pipeline - NO AUDIO
on:
  push:
    branches: [dev/ventuno-disposable-voice-abi-and-fault-tests-20261016]
    paths:
      - .github/workflows/ventuno-disposable-voice-abi.yml
      - scripts/ventuno_disposable_voice_abi.py
      - tests/test_ventuno_disposable_voice_abi.py
      - tests/test_ventuno_disposable_voice_e2e.py
      - requirements-voice-arm64-hashed.lock
      - config/voice_arm64_cp312_wheels.lock.json
      - docs/VENTUNO_DISPOSABLE_VOICE_ABI.md
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: myai-disposable-voice-abi-20261016
  cancel-in-progress: false

jobs:
  hosted-verify-wheels-and-fake-voice:
    name: Hosted x86 synthetic E2E + fetch exact HASHED ARM64 wheels
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Exact-commit checkout in disposable location
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/myai-voice-abi-$GITHUB_RUN_ID"
          test ! -e "$scratch"
          mkdir -m 700 "$scratch"
          echo "MYAI_VOICE_SCRATCH=$scratch" >> "$GITHUB_ENV"
          mkdir -m 700 "$scratch/source"
          cd "$scratch/source"
          git init -q
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run full dummy voice and ABI-contract regressions on hosted
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail
          cd "$MYAI_VOICE_SCRATCH/source"
          python3 -m venv "$MYAI_VOICE_SCRATCH/host-test-venv"
          "$MYAI_VOICE_SCRATCH/host-test-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input -q \
            pytest==8.3.5 -r requirements.txt
          "$MYAI_VOICE_SCRATCH/host-test-venv/bin/python" -B -m pytest -q \
            tests/test_ventuno_disposable_voice_abi.py \
            tests/test_ventuno_disposable_voice_e2e.py \
            tests/test_voice_pipeline.py \
            tests/test_voice_providers.py
          echo "MYAI_HOSTED_DUMMY_VOICE_E2E_COMPLETED=true"
      - name: Download 28 locked binary ARM64 wheels (not installed anywhere)
        shell: bash
        run: |
          set -euo pipefail
          cd "$MYAI_VOICE_SCRATCH/source"
          mkdir -m 700 "$MYAI_VOICE_SCRATCH/wheels"
          timeout --signal=TERM --kill-after=3s 180s \
            "$MYAI_VOICE_SCRATCH/host-test-venv/bin/python" -m pip download \
            --disable-pip-version-check --no-input --quiet \
            --only-binary=:all: --implementation cp --python-version 3.12 \
            --abi cp312 --platform manylinux2014_aarch64 \
            --platform manylinux_2_17_aarch64 \
            --platform manylinux_2_28_aarch64 \
            --require-hashes --dest "$MYAI_VOICE_SCRATCH/wheels" \
            -r requirements-voice-arm64-hashed.lock \
            > "$MYAI_VOICE_SCRATCH/pip-download.log" 2>&1 || {
              echo "MYAI_ARM64_LOCKED_WHEEL_DOWNLOAD_BLOCKED=true"
              exit 2
            }
          cp config/voice_arm64_cp312_wheels.lock.json \
            "$MYAI_VOICE_SCRATCH/wheels/wheelhouse.lock.json"
          "$MYAI_VOICE_SCRATCH/host-test-venv/bin/python" -B \
            -m scripts.ventuno_voice_wheelhouse_gate \
            --wheelhouse "$MYAI_VOICE_SCRATCH/wheels"
          echo "MYAI_ARM64_HOSTED_WHEEL_DOWNLOAD_AND_HASH_VERIFIED=true"
      - name: Transfer verified wheel archive to isolated ARM64 job
        uses: actions/upload-artifact@v4
        with:
          name: voice-arm64-cp312-verified-wheels
          path: ${{ runner.temp }}/myai-voice-abi-${{ github.run_id }}/wheels/*.whl
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Remove temporary hosted checkout and wheel files
        if: always()
        shell: bash
        run: |
          scratch="$RUNNER_TEMP/myai-voice-abi-$GITHUB_RUN_ID"
          if [ -d "$scratch" ] && [ ! -L "$scratch" ]; then
            rm -rf -- "$scratch"
          fi

  ventuno-disposable-import-only:
    name: VENTUNO ARM64 disposable venv + import-only native ABI, NO AUDIO
    needs: hosted-verify-wheels-and-fake-voice
    runs-on: [self-hosted, Linux, ARM64, ventuno-q]
    timeout-minutes: 12
    steps:
      - name: Confirm safe host and make unrelated private test checkout
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          test "$(id -un)" = "arduino"
          test -d /home/arduino/MyAI/.venv
          test "$RUNNER_TEMP" != /home/arduino/MyAI
          free_kib="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          ram_kib="$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)"
          test "$free_kib" -gt 6291456
          test "$ram_kib" -gt 2097152
          scratch="$RUNNER_TEMP/myai-voice-abi-$GITHUB_RUN_ID"
          test ! -e "$scratch"
          mkdir -m 700 "$scratch"
          echo "MYAI_VOICE_SCRATCH=$scratch" >> "$GITHUB_ENV"
          mkdir -m 700 "$scratch/source"
          mkdir -m 700 "$scratch/home"
          mkdir -m 700 "$scratch/temp"
          mkdir -m 700 "$scratch/cache"
          cd "$scratch/source"
          git init -q
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(pwd -P)" != /home/arduino/MyAI
          echo "MYAI_DISPOSABLE_BOARD_STAGE_ISOLATED=true"
      - name: Download private artifact from exact hosted run
        uses: actions/download-artifact@v4
        with:
          name: voice-arm64-cp312-verified-wheels
          path: ${{ runner.temp }}/myai-voice-abi-${{ github.run_id }}/wheels
      - name: Recheck complete offline wheel manifest on actual ARM64 board
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: |
          set -euo pipefail
          cd "$MYAI_VOICE_SCRATCH/source"
          cp config/voice_arm64_cp312_wheels.lock.json \
            "$MYAI_VOICE_SCRATCH/wheels/wheelhouse.lock.json"
          /usr/bin/python3 -B -m scripts.ventuno_voice_wheelhouse_gate \
            --wheelhouse "$MYAI_VOICE_SCRATCH/wheels"
          /usr/bin/python3 -B -m scripts.ventuno_isolated_voice_stage_contract
          echo "MYAI_ARM64_BOARD_WHEELS_AND_STAGE_PROVENANCE_VALID=true"
      - name: Install only into private disposable ARM64 venv, never production
        shell: bash
        run: |
          set -euo pipefail
          scratch="$MYAI_VOICE_SCRATCH"
          test -d "$scratch/wheels"
          test ! -e "$scratch/venv"
          /usr/bin/python3 -m venv "$scratch/venv"
          # Wheel-only, strictly offline and hash-pinned; no direct PyPI access.
          timeout --signal=TERM --kill-after=3s 240s \
            env -i PATH="/usr/bin:/bin" HOME="$scratch/home" \
              TMPDIR="$scratch/temp" XDG_CACHE_HOME="$scratch/cache" \
              PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
              HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 \
              "$scratch/venv/bin/python" -m pip install \
              --disable-pip-version-check --no-input --no-cache-dir \
              --no-index --only-binary=:all: --require-hashes \
              --find-links "$scratch/wheels" \
              -r "$scratch/source/requirements-voice-arm64-hashed.lock" \
              > "$scratch/pip-install.log" 2>&1 || {
                echo "MYAI_DISPOSABLE_ARM64_WHEEL_INSTALL_BLOCKED=true"
                exit 2
              }
          timeout 30s "$scratch/venv/bin/python" -m pip check \
            > "$scratch/pip-check.log" 2>&1 || {
              echo "MYAI_DISPOSABLE_ARM64_PIP_DEPENDENCIES_INVALID=true"
              exit 2
            }
          echo "MYAI_DISPOSABLE_ARM64_WHEEL_INSTALL_IN_PRIVATE_VENV=true"
      - name: Import eight native voice packages without opening devices or model
        shell: bash
        run: |
          set -euo pipefail
          scratch="$MYAI_VOICE_SCRATCH"
          cd "$scratch/source"
          ulimit -c 0
          for module in numpy av ctranslate2 webrtcvad sounddevice faster_whisper pyttsx3 onnxruntime; do
            if ! timeout --signal=TERM --kill-after=3s 35s \
              env -i PATH="/usr/bin:/bin" HOME="$scratch/home" \
                TMPDIR="$scratch/temp" XDG_CACHE_HOME="$scratch/cache" \
                PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
                HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 \
                HF_HUB_DISABLE_TELEMETRY=1 OMP_NUM_THREADS=2 \
                "$scratch/venv/bin/python" -I -B \
                "$scratch/source/scripts/ventuno_disposable_voice_abi.py" \
                --module "$module"; then
              echo "MYAI_DISPOSABLE_ARM64_IMPORT_BLOCKED=$module"
              exit 2
            fi
          done
          echo "MYAI_DISPOSABLE_ARM64_NATIVE_IMPORTS_VALIDATED=true"
          echo "No model, microphone, TTS engine, service or NPU was started."
      - name: Clean all private test code, wheel data and venv
        if: always()
        shell: bash
        run: |
          scratch="$RUNNER_TEMP/myai-voice-abi-$GITHUB_RUN_ID"
          if [ -d "$scratch" ] && [ ! -L "$scratch" ]; then
            rm -rf -- "$scratch"
          fi
          echo "MYAI_DISPOSABLE_ARM64_STAGE_CLEANUP_ATTEMPTED=true"
