name: VENTUNO CDSP firmware filesystem metadata only
on:
  push:
    branches: [dev/ventuno-cdsp-firmware-search-metadata-20261014]
    paths:
      - .github/workflows/ventuno-cdsp-firmware-search-readonly.yml
permissions:
  contents: read
concurrency:
  group: myai-cdsp-firmware-search-20261014
  cancel-in-progress: false
jobs:
  metadata-only:
    runs-on: [self-hosted, Linux, ARM64, ventuno-q]
    timeout-minutes: 4
    steps:
      - name: Exact commit read-only firmware search path stat and CDSP sysfs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          test "$(id -un)" = "arduino"
          test "$GITHUB_REF" = "refs/heads/dev/ventuno-cdsp-firmware-search-metadata-20261014"
          scratch="$(mktemp -d "$RUNNER_TEMP/myai-cdsp-fw.XXXXXX")"
          chmod 700 "$scratch"
          trap 'cd "$RUNNER_TEMP" && rm -rf -- "$scratch"' EXIT
          cd "$scratch"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          timeout --signal=TERM --kill-after=3s 30s /home/arduino/MyAI/.venv/bin/python -B -m scripts.ventuno_cdsp_firmware_search_readonly
          echo 'Only stat sysfs/name and firmware filesystem path metadata; no firmware binary read, no NPU, no service action.'
