name: VENTUNO classify HTP V75 Skel package symlink metadata only
on:
  push:
    branches: [dev/ventuno-htp-skel-link-identity-20261014]
    paths:
      - .github/workflows/ventuno-htp-skel-link-readonly.yml
permissions:
  contents: read
concurrency:
  group: myai-htp-v75-skel-link-20261014
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: [self-hosted, Linux, ARM64, ventuno-q]
    timeout-minutes: 4
    steps:
      - name: Verify symlink metadata without any QNN or hardware operations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          test "$(id -un)" = "arduino"
          test "$GITHUB_REF" = "refs/heads/dev/ventuno-htp-skel-link-identity-20261014"
          scratch="$(mktemp -d "$RUNNER_TEMP/myai-v75-skel.XXXXXX")"
          chmod 700 "$scratch"
          trap 'cd "$RUNNER_TEMP" && rm -rf -- "$scratch"' EXIT
          cd "$scratch"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          timeout --signal=TERM --kill-after=3s 30s /home/arduino/MyAI/.venv/bin/python -B -m scripts.ventuno_htp_v75_skel_link_readonly
          echo 'Resolved vendor target category and package ownership metadata only; no device open, HTP, model or production changes.'
