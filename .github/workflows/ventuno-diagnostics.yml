name: VENTUNO Q automated diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - dev/routing-boundary-followup
    paths:
      - .github/workflows/ventuno-diagnostics.yml

permissions:
  contents: read

concurrency:
  group: ventuno-diagnostics
  cancel-in-progress: false

jobs:
  diagnostics:
    name: Read-only checks on VENTUNO Q
    runs-on: [self-hosted, Linux, ARM64, ventuno-q]
    timeout-minutes: 10
    steps:
      - name: Fetch exact commit without third-party Actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(id -un)" = "arduino"
          mkdir -p "$RUNNER_TEMP/myai-checkout"
          cd "$RUNNER_TEMP/myai-checkout"
          git init -q
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Checked out exact workflow commit"


      - name: Confirm device identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          test "$(id -un)" = "arduino"
          echo "VENTUNO runner: $(uname -m), $(id -un)"

      - name: Check installed services and heartbeat
        shell: bash
        run: |
          set -euo pipefail
          for unit in myai-geniex.service myai-ventuno.service myai-geniex-watchdog.service; do
            echo "Checking $unit"
            systemctl is-active --quiet "$unit"
            systemctl is-enabled --quiet "$unit"
          done
          /home/arduino/MyAI/.venv/bin/python - <<'PY'
          import json
          import time
          from pathlib import Path
          p = Path("/home/arduino/MyAI/runtime/myai_runtime.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data.get("running") is True, "Runtime not running"
          assert not data.get("last_error"), "Runtime reports an error"
          age = time.time() - float(data["written_unix_time"])
          assert -30 < age < 120, f"Stale heartbeat: {age:.0f}s"
          print(f"Heartbeat OK; age {age:.0f}s; provider {data.get('llm_provider')}")
          PY

      - name: Check GenieX API without model inference
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:18181/v1/models > /dev/null
          echo "GenieX API responds"

      - name: Run bounded GenieX inference smoke test
        shell: bash
        run: |
          set -euo pipefail
          /home/arduino/MyAI/.venv/bin/python - <<'PY'
          import json
          import time
          from urllib.request import Request, urlopen

          base = "http://127.0.0.1:18181/v1"
          with urlopen(base + "/models", timeout=15) as response:
              models = json.load(response).get("data", [])
          assert models and models[0].get("id"), "GenieX model catalog is empty"
          model = models[0]["id"]
          payload = json.dumps({
              "model": model,
              "messages": [{"role": "user", "content": "Svara enbart med talet 4: vad är 2+2?"}],
              "max_tokens": 24,
              "temperature": 0,
              "stream": False,
          }).encode("utf-8")
          request = Request(
              base + "/chat/completions",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          start = time.monotonic()
          with urlopen(request, timeout=90) as response:
              result = json.load(response)
          elapsed = time.monotonic() - start
          choices = result.get("choices") or []
          answer = str((choices[0].get("message") or {}).get("content") or "").strip() if choices else ""
          assert answer, "GenieX returned an empty response"
          print(f"GenieX inference OK in {elapsed:.2f}s; output length {len(answer)}")
          # Only print numeric performance metrics, never prompts or generated text.
          for key in ("usage", "timings", "profile", "performance"):
              value = result.get(key)
              if isinstance(value, dict):
                  metrics = {str(k)[:60]: v for k, v in value.items()
                             if isinstance(v, (int, float)) and not isinstance(v, bool)}
                  print("GenieX response numeric", key, metrics)
          print("Metrics from the GenieX API are host-level inference timings,")
          print("not a direct per-layer HTP/QNN utilization profile.")
          print("This confirms inference works, but does not independently prove NPU utilization.")
          PY

      - name: Check generated systemd units without installing
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/myai-checkout"
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          /home/arduino/MyAI/.venv/bin/python scripts/generate_ventuno_systemd.py \
            --python /home/arduino/MyAI/.venv/bin/python \
            --output-dir "$tmpdir"
          for unit in myai-ventuno.service myai-geniex-watchdog.service; do
            grep -Fq '/home/arduino/MyAI/.venv/bin/python' "$tmpdir/$unit"
            grep -Fq '/home/arduino/.local/bin' "$tmpdir/$unit"
          done
          echo "Generated units preserve venv Python and GenieX PATH"

      - name: Inspect NPU device and runtime without inference
        shell: bash
        run: |
          set -euo pipefail
          echo "GenieX binary:"
          test -x /home/arduino/.local/bin/geniex
          /home/arduino/.local/bin/geniex --version
          echo "Qualcomm device nodes (names only):"
          find /dev -maxdepth 2 \( -iname '*qaic*' -o -iname '*npu*' -o -iname '*dsp*' \) -print 2>/dev/null || true
          echo "Qualcomm-related loaded kernel modules:"
          (lsmod 2>/dev/null || true) | grep -Ei 'qaic|qcom|fastrpc|dsp' || true
          echo "Note: This inventory does not prove live NPU utilization."

      - name: Inspect GenieX accelerator backend evidence (read-only)
        shell: bash
        run: |
          set -euo pipefail
          /home/arduino/MyAI/.venv/bin/python - <<'PY'
          import os
          from pathlib import Path

          needles = ("qnn", "qairt", "htp", "hexagon", "fastrpc", "adsprpc", "cdsprpc", "qaic", "npu", "dsp")
          processes = []
          for entry in Path("/proc").iterdir():
              if not entry.name.isdigit():
                  continue
              try:
                  comm = (entry / "comm").read_text(errors="replace").strip()
                  cmd = (entry / "cmdline").read_bytes().replace(b"\\x00", b" ").decode(errors="replace").lower()
                  if "geniex" in comm.lower() or "geniex" in cmd:
                      processes.append((int(entry.name), comm))
              except (OSError, PermissionError):
                  continue
          print("GenieX process count:", len(processes))
          for pid, comm in processes:
              root = Path("/proc") / str(pid)
              print(f"PID {pid}, executable name: {comm}")
              try:
                  lines = (root / "maps").read_text(errors="replace").splitlines()
                  libraries = sorted({line.split()[-1] for line in lines if "/" in line and
                                      any(word in line.lower() for word in needles)})
                  print("Accelerator-related mapped libraries (paths):", libraries[:40])
              except (OSError, PermissionError) as exc:
                  print("Cannot inspect maps:", type(exc).__name__)
              try:
                  devices = sorted({os.readlink(fd) for fd in (root / "fd").iterdir()
                                    if any(word in os.readlink(fd).lower() for word in needles)})
                  print("Accelerator-related open descriptors:", devices[:40])
              except (OSError, PermissionError) as exc:
                  print("Cannot inspect descriptors:", type(exc).__name__)
          print("Backend library/device evidence is suggestive, not proof of NPU execution.")
          PY

      - name: Sample accelerator frequency and process CPU during inference
        shell: bash
        run: |
          set -euo pipefail
          /home/arduino/MyAI/.venv/bin/python - <<'PY'
          import json
          import os
          import threading
          import time
          from pathlib import Path
          from urllib.request import Request, urlopen

          base = "http://127.0.0.1:18181/v1"
          with urlopen(base + "/models", timeout=15) as response:
              models = json.load(response).get("data", [])
          assert models and models[0].get("id"), "Missing model"

          # Read only exposed counters; absence is explicitly inconclusive.
          roots = [Path("/sys/class/devfreq"), Path("/sys/class/kgsl")]
          sensors = []
          for root in roots:
              if not root.exists():
                  continue
              for device in root.iterdir():
                  name = device.name.lower()
                  if root.name == "devfreq" and not any(
                      term in name for term in ("npu", "dsp", "htp", "cdsp", "compute", "q6")
                  ):
                      continue
                  for field in ("cur_freq", "busy_time", "total_time", "gpu_busy_percentage"):
                      candidate = device / field
                      if candidate.is_file():
                          sensors.append(candidate)
          sensors = sorted(set(sensors), key=str)
          print("Accelerator candidate counters:", [str(p) for p in sensors])

          pids = []
          for proc in Path("/proc").iterdir():
              if not proc.name.isdigit():
                  continue
              try:
                  if (proc / "comm").read_text().strip() == "geniex":
                      pids.append(int(proc.name))
              except OSError:
                  pass
          print("GenieX PIDs:", pids)
          ticks_per_second = os.sysconf("SC_CLK_TCK")

          def snapshot():
              values = {}
              for path in sensors:
                  try:
                      values[str(path)] = path.read_text().strip()[:80]
                  except OSError:
                      values[str(path)] = "unavailable"
              for pid in pids:
                  try:
                      stat = (Path("/proc") / str(pid) / "stat").read_text()
                      fields = stat.rsplit(")", 1)[1].split()
                      values[f"pid:{pid}:cpu_seconds"] = round(
                          (int(fields[11]) + int(fields[12])) / ticks_per_second, 3
                      )
                  except (OSError, ValueError, IndexError):
                      pass
              return values

          samples = [("before", snapshot())]
          stop = threading.Event()

          def sampler():
              while not stop.wait(0.5):
                  samples.append(("during", snapshot()))

          worker = threading.Thread(target=sampler, daemon=True)
          worker.start()
          payload = json.dumps({
              "model": models[0]["id"],
              "messages": [{"role": "user", "content":
                  "Skriv en kort förklaring på svenska av skillnaden mellan CPU och NPU."}],
              "max_tokens": 96,
              "temperature": 0,
              "stream": False,
          }).encode()
          request = Request(
              base + "/chat/completions", data=payload,
              headers={"Content-Type": "application/json"}, method="POST",
          )
          start = time.monotonic()
          try:
              with urlopen(request, timeout=90) as response:
                  result = json.load(response)
          finally:
              stop.set()
              worker.join(timeout=3)
          elapsed = time.monotonic() - start
          samples.append(("after", snapshot()))
          answer = (result.get("choices") or [{}])[0].get("message", {}).get("content")
          assert answer and str(answer).strip(), "Empty inference result"
          print("Inference elapsed seconds:", round(elapsed, 2))
          print("Sample count:", len(samples))
          for phase, values in samples[::max(1, len(samples) // 12)]:
              print(phase, json.dumps(values, sort_keys=True))
          print("Final sample:", json.dumps(samples[-1][1], sort_keys=True))
          print("CPU time and frequency alone do not prove NPU utilization.")
          PY

      - name: Discover available Qualcomm performance telemetry (read-only)
        shell: bash
        run: |
          set -euo pipefail
          /home/arduino/MyAI/.venv/bin/python - <<'PY'
          from pathlib import Path

          keywords = ("npu", "dsp", "cdsp", "adsp", "fastrpc", "qnn",
                      "htp", "hexagon", "q6", "compute", "qcom")
          def read_short(path):
              try:
                  return path.read_text(errors="replace").strip().replace("\\x00", " ")[:120]
              except (OSError, UnicodeError):
                  return None

          for label, root in (
              ("remoteproc", Path("/sys/class/remoteproc")),
              ("devfreq", Path("/sys/class/devfreq")),
              ("qualcomm platform devices", Path("/sys/bus/platform/devices")),
              ("trace event systems", Path("/sys/kernel/tracing/events")),
              ("debug trace event systems", Path("/sys/kernel/debug/tracing/events")),
          ):
              try:
                  if not root.is_dir():
                      print(f"{label}: unavailable")
                      continue
                  entries = sorted(root.iterdir(), key=lambda p: p.name)
              except OSError:
                  print(f"{label}: not readable (access restricted)")
                  continue
              if label in ("remoteproc", "devfreq"):
                  selected = entries[:40]
              else:
                  selected = [p for p in entries
                              if any(term in p.name.lower() for term in keywords)][:40]
              print(f"{label}: total={len(entries)}, candidates={len(selected)}")
              for entry in selected:
                  print(" ", entry.name)
                  fields = ("name", "state") if label == "remoteproc" else (
                      "governor", "cur_freq", "available_frequencies",
                      "busy_time", "total_time", "trans_stat"
                  ) if label == "devfreq" else ()
                  for field in fields:
                      value = read_short(entry / field)
                      if value is not None:
                          print(f"    {field}: {value}")
          for root in (Path("/sys/kernel/debug"), Path("/sys/kernel/tracing")):
              try:
                  print(f"{root}: exists={root.exists()}, readable={root.is_dir()}")
              except OSError:
                  print(f"{root}: access restricted")
          print("Discovery does not enable tracing, change clocks, or modify services.")
          PY

      - name: Inventory QAIRT and GenieX profiling support (read-only)
        shell: bash
        run: |
          set -euo pipefail
          /home/arduino/MyAI/.venv/bin/python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          commands = ("qnn-net-run", "qnn-profile-viewer", "qnn-context-binary-utility",
                      "snpe-net-run", "geniex")
          print("Profiler command availability:")
          for cmd in commands:
              print(" ", cmd, shutil.which(cmd) or "not on PATH")

          # Restrict traversal to SDK/tool locations. Never print model files,
          # configurations, environment values or service credentials.
          roots = [
              Path("/home/arduino/.local/share/geniex/qairt"),
              Path("/home/arduino/.local/bin"),
              Path("/opt/qcom"),
              Path("/opt/qualcomm"),
              Path("/opt/qairt"),
              Path("/usr/local/bin"),
              Path("/usr/local/lib"),
          ]
          patterns = ("profil", "qnn-net-run", "qnn-context-binary",
                      "libqnnhtp", "qnn-sdk", "qairt")
          count = 0
          matches = []
          for root in roots:
              if not root.is_dir():
                  continue
              print("Search root:", str(root))
              for current, directories, files in os.walk(root, followlinks=False):
                  count += 1
                  if count > 800:
                      print("Directory scan cap reached")
                      break
                  depth = len(Path(current).relative_to(root).parts)
                  if depth >= 5:
                      directories[:] = []
                  for name in files:
                      if any(needle in name.lower() for needle in patterns):
                          # Do not inspect or execute these files.
                          matches.append(str(Path(current) / name))
                          if len(matches) >= 90:
                              break
                  if len(matches) >= 90:
                      break
              if count > 800 or len(matches) >= 90:
                  break
          print("Found profiler/backend files:", len(matches))
          for path in sorted(matches):
              print(" ", path)
          print("QNN profiling requires runtime support and an enabled profile session.")
          print("Library presence alone does not establish NPU execution time.")
          PY

      - name: Verify profiler CLI support without running a model
        shell: bash
        run: |
          set -euo pipefail
          /home/arduino/MyAI/.venv/bin/python - <<'PY'
          import subprocess

          commands = (
              ("qnn-net-run", "--help"),
              ("qnn-profile-viewer", "--help"),
              ("geniex", "serve", "--help"),
          )
          needles = ("profil", "reader", "trace", "qairt", "backend", "compute")
          for argv in commands:
              print("Checking CLI help:", " ".join(argv))
              try:
                  run = subprocess.run(
                      argv, capture_output=True, text=True, timeout=8,
                      errors="replace", check=False,
                  )
                  text = (run.stdout + "\\n" + run.stderr)
                  matches = [line.strip()[:180] for line in text.splitlines()
                             if any(key in line.lower() for key in needles)]
                  print("Exit status:", run.returncode)
                  print("Relevant flags:", matches[:20])
              except (OSError, subprocess.TimeoutExpired) as exc:
                  print("Help unavailable:", type(exc).__name__)
          print("This only requests CLI help; it does not run qnn-net-run inference.")
          PY

      - name: Preflight isolated QAIRT profiling without loading any model
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/myai-checkout"
          /home/arduino/MyAI/.venv/bin/python scripts/ventuno_qairt_profile_preflight.py

      - name: Verify QNN profiling model-format compatibility without service stop
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/myai-checkout"
          /home/arduino/MyAI/.venv/bin/python scripts/ventuno_qnn_profile_feasibility.py

      - name: Check runner and MyAI service persistence
        shell: bash
        run: |
          set -euo pipefail
          systemctl is-enabled --quiet actions.runner.Harrokk-Myai.ventuno-q.service
          systemctl is-active --quiet actions.runner.Harrokk-Myai.ventuno-q.service
          for unit in myai-geniex.service myai-ventuno.service myai-geniex-watchdog.service; do
            systemctl is-enabled --quiet "$unit"
          done
          echo "Runner and MyAI services configured to start at boot"

      - name: Run systemd regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/myai-checkout"
          /home/arduino/MyAI/.venv/bin/python -m pytest tests/test_systemd_units.py -q

      - name: Publish diagnostics summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VENTUNO Q diagnostics"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Runner: \`$RUNNER_NAME\`"
            echo "- Device: \`$(uname -m)\`"
            echo "- Service status:"
            for unit in actions.runner.Harrokk-Myai.ventuno-q.service myai-geniex.service myai-ventuno.service myai-geniex-watchdog.service; do
              state="$(systemctl is-active "$unit" 2>/dev/null || true)"
              echo "  - \`$unit\`: $state"
            done
            echo
            echo "NPU device inventory is informational, not a utilization measurement."
            echo "Review the individual steps for full checks and any failures."
          } >> "$GITHUB_STEP_SUMMARY"
