name: VENTUNO Q automated diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - dev/routing-boundary-followup
    paths:
      - .github/workflows/ventuno-diagnostics.yml

permissions:
  contents: read

concurrency:
  group: ventuno-diagnostics
  cancel-in-progress: false

jobs:
  diagnostics:
    name: Read-only checks on VENTUNO Q
    runs-on: [self-hosted, Linux, ARM64, ventuno-q]
    timeout-minutes: 10
    steps:
      - name: Check out diagnostics code in isolated runner workspace
        uses: actions/checkout@v4

      - name: Confirm device identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          test "$(id -un)" = "arduino"
          echo "VENTUNO runner: $(uname -m), $(id -un)"

      - name: Check installed services and heartbeat
        shell: bash
        run: |
          set -euo pipefail
          for unit in myai-geniex.service myai-ventuno.service myai-geniex-watchdog.service; do
            echo "Checking $unit"
            systemctl is-active --quiet "$unit"
            systemctl is-enabled --quiet "$unit"
          done
          /home/arduino/MyAI/.venv/bin/python - <<'PY'
          import json
          import time
          from pathlib import Path
          p = Path("/home/arduino/MyAI/runtime/myai_runtime.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data.get("running") is True, "Runtime not running"
          assert not data.get("last_error"), "Runtime reports an error"
          age = time.time() - float(data["written_unix_time"])
          assert -30 < age < 120, f"Stale heartbeat: {age:.0f}s"
          print(f"Heartbeat OK; age {age:.0f}s; provider {data.get('llm_provider')}")
          PY

      - name: Check GenieX API without model inference
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:18181/v1/models > /dev/null
          echo "GenieX API responds"

      - name: Check generated systemd units without installing
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          /home/arduino/MyAI/.venv/bin/python scripts/generate_ventuno_systemd.py \
            --python /home/arduino/MyAI/.venv/bin/python \
            --output-dir "$tmpdir"
          for unit in myai-ventuno.service myai-geniex-watchdog.service; do
            grep -Fq '/home/arduino/MyAI/.venv/bin/python' "$tmpdir/$unit"
            grep -Fq '/home/arduino/.local/bin' "$tmpdir/$unit"
          done
          echo "Generated units preserve venv Python and GenieX PATH"

      - name: Inspect NPU device and runtime without inference
        shell: bash
        run: |
          set -euo pipefail
          echo "GenieX binary:"
          test -x /home/arduino/.local/bin/geniex
          /home/arduino/.local/bin/geniex --version
          echo "Qualcomm device nodes (names only):"
          find /dev -maxdepth 2 \( -iname '*qaic*' -o -iname '*npu*' -o -iname '*dsp*' \) -print 2>/dev/null || true
          echo "Qualcomm-related loaded kernel modules:"
          (lsmod 2>/dev/null || true) | grep -Ei 'qaic|qcom|fastrpc|dsp' || true
          echo "Note: This inventory does not prove live NPU utilization."

      - name: Check runner and MyAI service persistence
        shell: bash
        run: |
          set -euo pipefail
          systemctl is-enabled --quiet actions.runner.Harrokk-Myai.ventuno-q.service
          systemctl is-active --quiet actions.runner.Harrokk-Myai.ventuno-q.service
          for unit in myai-geniex.service myai-ventuno.service myai-geniex-watchdog.service; do
            systemctl is-enabled --quiet "$unit"
          done
          echo "Runner and MyAI services configured to start at boot"

      - name: Run systemd regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          /home/arduino/MyAI/.venv/bin/python -m pytest tests/test_systemd_units.py -q

      - name: Publish diagnostics summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VENTUNO Q diagnostics"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Runner: \`$RUNNER_NAME\`"
            echo "- Device: \`$(uname -m)\`"
            echo "- Service status:"
            for unit in actions.runner.Harrokk-Myai.ventuno-q.service myai-geniex.service myai-ventuno.service myai-geniex-watchdog.service; do
              state="$(systemctl is-active "$unit" 2>/dev/null || true)"
              echo "  - \`$unit\`: $state"
            done
            echo
            echo "NPU device inventory is informational, not a utilization measurement."
            echo "Review the individual steps for full checks and any failures."
          } >> "$GITHUB_STEP_SUMMARY"
