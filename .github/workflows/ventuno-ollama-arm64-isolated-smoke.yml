name: VENTUNO pinned Ollama ARM64 isolated Qwen3 0.6B smoke

on:
  push:
    branches: [dev/routing-boundary-followup]
    paths:
      - .github/workflows/ventuno-ollama-arm64-isolated-smoke.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ventuno-ollama-arm64-isolated-smoke
  cancel-in-progress: false

jobs:
  isolated:
    # ARCHIVED - NO HARDWARE EXECUTION on the DRAFT revision candidate.
    # This legacy model/device job requires a new operator-authorized PR.
    if: false
    name: Run tiny Ollama model in disposable user-space with GenieX intact
    runs-on: [self-hosted, Linux, ARM64, ventuno-q]
    timeout-minutes: 25
    steps:
      - name: Preflight resource budget and verify tool availability
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          test "$(id -un)" = "arduino"
          test -n "${RUNNER_TEMP:-}"
          systemctl is-active --quiet myai-geniex.service
          systemctl is-active --quiet myai-ventuno.service
          for tool in curl tar sha256sum python3 zstd; do
            command -v "$tool" >/dev/null || {
              echo "Isolated Ollama prerequisites missing: $tool"
              exit 2
            }
          done
          python3 - <<'PY'
          import os, shutil
          root=os.environ["RUNNER_TEMP"]
          free=shutil.disk_usage(root).free
          lines=open("/proc/meminfo",encoding="ascii").readlines()
          available=int(next(x.split()[1] for x in lines if x.startswith("MemAvailable:"))) * 1024
          # 1.45 GB official archive, extracted libraries and model cache.
          # Fail closed; never free RAM by stopping GenieX.
          assert free >= 8 * 1024**3, "Insufficient temporary storage"
          assert available >= 8 * 1024**3, "Insufficient available RAM"
          print("Isolated Ollama download/inference resource gate passed.")
          PY
          work="$(mktemp -d "$RUNNER_TEMP/myai-ollama-smoke-XXXXXXXX")"
          echo "MYAI_OLLAMA_SMOKE=$work" >> "$GITHUB_ENV"

      - name: Download SHA256-pinned official ARM64 Ollama binary into temporary root
        shell: bash
        run: |
          set -euo pipefail
          cd "$MYAI_OLLAMA_SMOKE"
          curl --fail --location --silent --show-error \
            --connect-timeout 15 --max-time 900 --retry 1 \
            --output ollama-linux-arm64.tar.zst \
            "https://github.com/ollama/ollama/releases/download/v0.34.0/ollama-linux-arm64.tar.zst"
          printf '%s  %s\n' \
            "6a9e5b3650c2024d8a78da86b23876f6eea238657a3262d7e5ec0f3688c5d28e" \
            "ollama-linux-arm64.tar.zst" | sha256sum -c -
          python3 - <<'PY'
          import os
          from pathlib import Path
          size=(Path(os.environ["MYAI_OLLAMA_SMOKE"])/"ollama-linux-arm64.tar.zst").stat().st_size
          assert 200_000_000 <= size <= 2_100_000_000
          print("Official Ollama ARM64 v0.34.0 checksum verified.")
          PY

      - name: Safely unpack verified Ollama only in temporary user-space
        shell: bash
        run: |
          set -euo pipefail
          cd "$MYAI_OLLAMA_SMOKE"
          tar --zstd -tf ollama-linux-arm64.tar.zst | python3 -c '
          import sys
          from pathlib import PurePosixPath
          count=0
          for line in sys.stdin:
              path=PurePosixPath(line.strip())
              assert not path.is_absolute() and ".." not in path.parts
              count+=1
              assert count <= 30000
          assert count > 0
          '
          mkdir -p staged
          tar --zstd --no-same-owner --no-same-permissions \
            -xf ollama-linux-arm64.tar.zst -C staged
          test -x "$MYAI_OLLAMA_SMOKE/staged/bin/ollama"
          echo "Pinned Ollama executable staged without sudo or service changes."

      - name: One bounded local Ollama Qwen3 test and terminate the temporary server
        id: smoke
        shell: bash
        env:
          OLLAMA_HOST: "127.0.0.1:11435"
          OLLAMA_NUM_PARALLEL: "1"
          OLLAMA_MAX_LOADED_MODELS: "1"
          OLLAMA_KEEP_ALIVE: "0"
          OLLAMA_MODELS: "${{ runner.temp }}/myai-ollama-disposable-placeholder"
        run: |
          set -euo pipefail
          work="$MYAI_OLLAMA_SMOKE"
          bin="$work/staged/bin/ollama"
          test -x "$bin"
          export OLLAMA_MODELS="$work/models"
          export HOME="$work/home"
          mkdir -p "$OLLAMA_MODELS" "$HOME"
          # Do not inherit any local Ollama endpoint or proxy override.
          export OLLAMA_HOST="127.0.0.1:11435"
          export OLLAMA_NUM_PARALLEL=1 OLLAMA_MAX_LOADED_MODELS=1 OLLAMA_KEEP_ALIVE=0
          export OLLAMA_NO_CLOUD=1
          export OLLAMA_DEBUG=0
          pid=""
          cleanup_server() {
            if [ -n "$pid" ]; then
              kill "$pid" >/dev/null 2>&1 || true
              wait "$pid" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_server EXIT
          "$bin" serve > "$work/private-ollama-server.log" 2>&1 &
          pid=$!
          ready=0
          for attempt in $(seq 1 35); do
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            if curl --noproxy "*" --silent --fail --max-time 2 \
                  http://127.0.0.1:11435/api/version -o "$work/version.json"; then
              ready=1; break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo "Ollama ARM64 server could not start in isolated user-space."
            exit 2
          fi
          echo "Isolated local Ollama API responded. No production server affected."
          # Download *only* small official Qwen3 0.6B, not the original 8B.
          timeout 420 "$bin" pull qwen3:0.6b > /dev/null 2>&1
          python3 - <<'PY'
          import json, urllib.request, time
          base="http://127.0.0.1:11435"
          request=urllib.request.Request(base+"/api/chat", method="POST",
              data=json.dumps({
                  "model":"qwen3:0.6b",
                  "messages":[{"role":"user","content":"Svara på svenska med ett ord: hej."}],
                  "think":False,
                  "stream":False,
                  "keep_alive":0,
                  "options":{"num_ctx":1024,"num_predict":24,"temperature":0},
              }).encode("utf-8"),
              headers={"Content-Type":"application/json"})
          start=time.monotonic()
          with urllib.request.urlopen(request, timeout=110) as answer:
              raw=answer.read(65537)
          assert len(raw)<=65536, "Oversized Ollama result"
          result=json.loads(raw)
          content=(result.get("message") or {}).get("content","")
          assert isinstance(content,str) and 1<=len(content.strip())<=120
          elapsed=round(time.monotonic()-start,2)
          print("Isolated Qwen3 0.6B response verified; seconds:",elapsed)
          print("No prompt, reply or private model data saved in CI output.")
          PY
          echo "smoke_status=isolated-arm64-ollama-qwen3-text-verified" >> "$GITHUB_OUTPUT"

      - name: Stop transient model activity and clean only test workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          systemctl is-active --quiet myai-ventuno.service
          systemctl is-active --quiet myai-geniex.service
          if [ -n "${MYAI_OLLAMA_SMOKE:-}" ] && [ -n "${RUNNER_TEMP:-}" ]; then
            case "$MYAI_OLLAMA_SMOKE" in
              "$RUNNER_TEMP"/myai-ollama-smoke-*)
                if [ -d "$MYAI_OLLAMA_SMOKE" ] && [ ! -L "$MYAI_OLLAMA_SMOKE" ]; then
                  rm -rf -- "$MYAI_OLLAMA_SMOKE"
                fi
                ;;
              *) echo "Refusing unsafe cleanup" >&2; exit 1 ;;
            esac
          fi
          echo "Temporary Ollama binary, model cache and server logs removed."
          echo "Production MyAI and GenieX services and config remain unchanged."

      - name: Publish allowlisted outcome on the exact source commit
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
          SMOKE_STATUS: ${{ steps.smoke.outputs.smoke_status }}
        run: |
          python3 - <<'PY'
          import json,os,re,urllib.request
          sha=os.environ.get("GITHUB_SHA","")
          repo=os.environ.get("GITHUB_REPOSITORY","")
          token=os.environ.get("GH_TOKEN","")
          if not (re.fullmatch(r"[0-9a-f]{40}",sha) and token and
                  re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+",repo)):
              raise SystemExit(0)
          value=os.environ.get("SMOKE_STATUS","")
          value=(value if value=="isolated-arm64-ollama-qwen3-text-verified"
                 else "isolated-ollama-inconclusive")
          state="success" if os.environ.get("JOB_RESULT")=="success" else "failure"
          body={
              "state":state,
              "context":"myai/ventuno-ollama-arm64-isolated-smoke",
              "description":value,
              "target_url":"https://github.com/"+repo+"/actions/runs/"+
                           os.environ.get("GITHUB_RUN_ID",""),
          }
          req=urllib.request.Request(
              "https://api.github.com/repos/"+repo+"/statuses/"+sha,
              data=json.dumps(body).encode(),method="POST",
              headers={"Authorization":"Bearer "+token,
                       "Accept":"application/vnd.github+json",
                       "X-GitHub-Api-Version":"2022-11-28",
                       "Content-Type":"application/json"})
          try:
              with urllib.request.urlopen(req,timeout=10) as response:
                  print("Isolated Ollama status recorded:",response.status==201)
          except Exception as exc:
              print("Status post unavailable:",type(exc).__name__)
          PY
