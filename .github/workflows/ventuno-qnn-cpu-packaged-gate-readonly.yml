name: VENTUNO QNN CPU packaged backend metadata only
on:
  push:
    branches: [dev/ventuno-qnn-cpu-reference-distro-parity-20261014]
    paths:
      - .github/workflows/ventuno-qnn-cpu-packaged-gate-readonly.yml
permissions:
  contents: read
concurrency:
  group: myai-ventuno-qnn-cpu-packaged-20261014
  cancel-in-progress: false
jobs:
  read-only-metadata:
    runs-on: [self-hosted, Linux, ARM64, ventuno-q]
    timeout-minutes: 4
    steps:
      - name: Exact-commit metadata only; no QNN CPU/HTP execution
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          test "$(id -un)" = "arduino"
          test "$GITHUB_REF" = "refs/heads/dev/ventuno-qnn-cpu-reference-distro-parity-20261014"
          scratch="$(mktemp -d "$RUNNER_TEMP/myai-qnn-cpu-gate.XXXXXX")"
          chmod 700 "$scratch"
          trap 'cd "$RUNNER_TEMP" && rm -rf -- "$scratch"' EXIT
          cd "$scratch"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          timeout --signal=TERM --kill-after=3s 30s /home/arduino/MyAI/.venv/bin/python -B -m scripts.ventuno_qnn_cpu_packaged_gate_readonly
          echo 'No qnn-net-run, device nodes, models, services, package installs or production changes.'
