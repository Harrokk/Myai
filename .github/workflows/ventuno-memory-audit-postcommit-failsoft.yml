name: Memory audit post-write failure safety (synthetic only)
on:
  push:
    branches: [dev/ventuno-memory-audit-postcommit-failsoft-20261015]
    paths:
      - .github/workflows/ventuno-memory-audit-postcommit-failsoft.yml
      - core/assistant.py
      - tests/test_memory_literal_search_and_recovery.py
permissions:
  contents: read
concurrency:
  group: myai-memory-audit-postcommit-20261015
  cancel-in-progress: false
jobs:
  synthetic-logs:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Exact-SHA checkout in disposable hosted x86 workspace
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          scratch="$(mktemp -d "$RUNNER_TEMP/myai-memory-postcommit.XXXXXX")"
          chmod 700 "$scratch"
          echo "MYAI_AUDIT_TEST_SCRATCH=$scratch" >> "$GITHUB_ENV"
          cd "$scratch"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -c credential.helper= checkout --quiet --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Pinned test dependencies in disposable venv
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/myai-memory-postcommit-venv"
          "$RUNNER_TEMP/myai-memory-postcommit-venv/bin/python" -m pip install \
            --disable-pip-version-check --only-binary=:all: \
            pytest==8.3.5 requests==2.32.5 psutil==7.1.0
      - name: Exercise fake SQLite and post-action audit errors only
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          cd "$MYAI_AUDIT_TEST_SCRATCH"
          "$RUNNER_TEMP/myai-memory-postcommit-venv/bin/python" -B -m pytest -q \
            tests/test_memory_literal_search_and_recovery.py \
            tests/test_memory.py \
            tests/test_assistant_core.py
          echo 'No actual user memory, active Ventuno database, LLM inference or service modification.'
      - name: Delete synthetic checkout and venv
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${MYAI_AUDIT_TEST_SCRATCH:-}" ]; then
            rm -rf -- "$MYAI_AUDIT_TEST_SCRATCH"
          fi
          rm -rf -- "$RUNNER_TEMP/myai-memory-postcommit-venv"
